<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Utility — เครื่องมือฟรี ใช้ง่าย ครบในที่เดียว</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --border: #eceef2;
      --border-hover: #d5d9e2;
      --ink: #1e2024;
      --muted: #7c8494;
      --brand: #5848e5;
      --brand-soft: #eef0ff;
      --brand-ink: #ffffff;
      --danger: #e5484d;
      --success: #12a594;
      --radius: 14px;
      --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.03);
      --shadow-md: 0 6px 18px rgba(16, 24, 40, 0.06);
      --font: 'Noto Sans Thai', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Header */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .topbar-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--ink);
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      font: inherit;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--brand);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      letter-spacing: -0.02em;
    }

    .brand-name {
      font-weight: 700;
      font-size: 16px;
      color: #2c2f36;
    }

    /* Main Container */
    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px 72px;
    }

    /* Hero */
    .hero {
      text-align: center;
      margin-bottom: 36px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 800;
      color: #1f2229;
      letter-spacing: -0.01em;
    }

    .hero p {
      margin: 0 auto 26px;
      max-width: 480px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .search-wrap {
      max-width: 440px;
      margin: 0 auto;
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #a0a7b5;
      pointer-events: none;
      display: flex;
    }

    .search-input {
      width: 100%;
      padding: 11px 18px 11px 42px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      font: inherit;
      font-size: 13.5px;
      color: var(--ink);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      box-shadow: var(--shadow-sm);
    }

    .search-input::placeholder {
      color: #a5acb8;
    }

    .search-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(88, 72, 229, 0.12);
    }

    /* Category Sections */
    .category-section {
      margin-bottom: 28px;
    }

    .category-title {
      font-size: 12.5px;
      font-weight: 700;
      color: #7c8494;
      margin: 0 0 10px;
      letter-spacing: 0.01em;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    @media (max-width: 600px) {
      .tool-grid {
        grid-template-columns: 1fr;
      }
    }

    .tool-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-align: left;
      font: inherit;
      color: inherit;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      box-shadow: var(--shadow-sm);
    }

    .tool-card:hover {
      border-color: var(--border-hover);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .tool-card:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }

    .tool-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--brand-soft);
      color: var(--brand);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .tool-icon svg {
      width: 19px;
      height: 19px;
      stroke-width: 1.9;
    }

    .tool-meta {
      min-width: 0;
    }

    .tool-name {
      font-size: 14px;
      font-weight: 700;
      color: #1f2229;
      margin: 0 0 2px;
      line-height: 1.35;
    }

    .tool-desc {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Tool Workspace View */
    .workspace {
      display: none;
    }

    .workspace.active {
      display: block;
    }

    .home-view.hidden {
      display: none;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 14px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #454b57;
      cursor: pointer;
      margin-bottom: 18px;
      transition: border-color 0.15s, background 0.15s;
    }

    .back-btn:hover {
      background: #f3f4f8;
      border-color: var(--border-hover);
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .panel-header h2 {
      margin: 0 0 2px;
      font-size: 19px;
      font-weight: 700;
    }

    .panel-header p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }

    /* Common Workspace Controls */
    .dropzone {
      border: 2px dashed #d5d9e4;
      border-radius: 14px;
      padding: 28px 20px;
      text-align: center;
      background: #fafbfe;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      margin-bottom: 18px;
       display: block;
    }

    .dropzone:hover {
      border-color: var(--brand);
      background: #f4f5ff;
    }

    .dropzone input[type="file"] {
      display: none;
    }

    .dropzone-title {
      font-weight: 600;
      font-size: 14px;
      color: #2b2f38;
      margin-bottom: 4px;
    }

    .dropzone-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
      margin-bottom: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      min-width: 140px;
    }

    .field label {
      font-size: 12.5px;
      font-weight: 600;
      color: #434956;
    }

    .input, .select, .textarea {
      width: 100%;
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid var(--border-hover);
      background: #fff;
      font: inherit;
      font-size: 13.5px;
      color: var(--ink);
      outline: none;
    }

    .textarea {
      min-height: 120px;
      resize: vertical;
    }

    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(88, 72, 229, 0.12);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font: inherit;
      font-size: 13.5px;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 9px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
      text-decoration: none;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--brand);
      color: var(--brand-ink);
    }

    .btn-primary:hover:not(:disabled) {
      background: #4737d1;
    }

    .btn-secondary {
      background: #f3f4f8;
      color: #2b2f38;
      border-color: var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #e8eaf2;
    }

    .btn-danger {
      background: #fff0f0;
      color: var(--danger);
      border-color: #ffd6d6;
    }

    .preview-box {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      background: #f8f9fc;
      margin-top: 16px;
      text-align: center;
    }

    .checkerboard {
      background-image:
        linear-gradient(45deg, #e6e8ef 25%, transparent 25%),
        linear-gradient(-45deg, #e6e8ef 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e6e8ef 75%),
        linear-gradient(-45deg, transparent 75%, #e6e8ef 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    }

    canvas, .preview-img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .stat-card {
      background: #f8f9fc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .stat-val {
      font-size: 22px;
      font-weight: 800;
      color: var(--brand);
    }

    .stat-lbl {
      font-size: 12px;
      color: var(--muted);
    }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 12px 0;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fafbfe;
      font-size: 13px;
    }

    .page-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .page-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      background: #fff;
      text-align: center;
      position: relative;
    }

    .page-card canvas {
      width: 100%;
      border: 1px solid #eee;
      border-radius: 6px;
      transition: transform 0.2s;
    }

    .page-actions {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-top: 6px;
    }

    .icon-btn {
      padding: 4px 7px;
      font-size: 11px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #f8f9fc;
      cursor: pointer;
    }

    .icon-btn:hover {
      background: #ebedf5;
    }

    .swatch-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .color-chip {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px var(--border-hover);
    }

    .pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .pill-btn {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-hover);
      background: #fff;
      font: inherit;
      font-size: 12.5px;
      cursor: pointer;
    }

    .pill-btn.active {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }

    .empty-search {
      text-align: center;
      padding: 36px 16px;
      color: var(--muted);
      font-size: 14px;
      display: none;
    }

    .status-msg {
      font-size: 13px;
      margin-top: 10px;
      color: var(--brand);
      font-weight: 500;
    }
  </style>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button type="button" class="brand" id="homeLogoBtn" aria-label="กลับหน้าหลัก Utility">
        <span class="brand-logo">U</span>
        <span class="brand-name">Utility</span>
      </button>
    </div>
  </header>

  <main class="container">
    <!-- HOME DIRECTORY VIEW -->
    <div id="homeView" class="home-view">
      <section class="hero">
        <h1>เครื่องมือฟรี ใช้ง่าย ครบในที่เดียว</h1>
        <p>ลบพื้นหลัง จัดการ PDF ทำ QR Code ย่อลิงก์ และอีกมากมาย — ไม่ต้องสมัคร ไม่มีค่าใช้จ่าย</p>
        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input
            type="search"
            id="searchInput"
            class="search-input"
            placeholder="ค้นหาเครื่องมือ เช่น PDF, QR, ลบพื้นหลัง"
            aria-label="ค้นหาเครื่องมือ"
          >
        </div>
      </section>

      <div class="tabs-outer" style="border-bottom: 1px solid var(--border); margin-bottom: 24px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px;">
        <div class="tabs-list" id="tabsList" style="display: flex; gap: 8px;"></div>
      </div>

      <div id="categoriesContainer"></div>
      <div id="emptySearch" class="empty-search">ไม่พบเครื่องมือที่ตรงกับคำค้นหา</div>
    </div>

    <!-- ACTIVE TOOL WORKSPACE -->
    <section id="workspaceView" class="workspace" aria-live="polite">
      <button type="button" class="back-btn" id="backToHomeBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        กลับหน้ารวมเครื่องมือ
      </button>
      <div class="panel">
        <div class="panel-header">
          <div class="tool-icon" id="wsIcon"></div>
          <div>
            <h2 id="wsTitle"></h2>
            <p id="wsDesc"></p>
          </div>
        </div>
        <div id="wsBody"></div>
      </div>
    </section>
  </main>

    const categoriesContainer = document.getElementById('categoriesContainer');
    const searchInput = document.getElementById('searchInput');
    const emptySearch = document.getElementById('emptySearch');
    const homeView = document.getElementById('homeView');
    const workspaceView = document.getElementById('workspaceView');

    const wsDesc = document.getElementById('wsDesc');
    const wsBody = document.getElementById('wsBody');
    const tabsList = document.getElementById('tabsList');

    let activeTab = 'all';

    function renderTabs() {
      tabsList.innerHTML = '';
      const tabs = [
        { id: 'all', title: 'ทั้งหมด' },
        ...CATEGORIES.map(cat => ({ id: cat.title, title: cat.title }))
      ];
      tabs.forEach(t => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `pill-btn ${activeTab === t.id ? 'active' : ''}`;
        btn.style.whiteSpace = 'nowrap';
        btn.textContent = t.title;
        btn.addEventListener('click', () => {
          activeTab = t.id;
          renderTabs();
          renderDirectory(searchInput.value);
        });
        tabsList.appendChild(btn);
      });
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function triggerDownload(url, filename) {
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function renderDirectory(filterText = '') {
      const q = filterText.trim().toLowerCase();
      categoriesContainer.innerHTML = '';
      let totalVisible = 0;

      CATEGORIES.forEach(cat => {
        if (activeTab !== 'all' && cat.title !== activeTab) return;

        const matched = cat.tools.filter(t =>
          !q ||
          t.name.toLowerCase().includes(q) ||
          t.desc.toLowerCase().includes(q) ||
          cat.title.toLowerCase().includes(q)
        );
        if (matched.length === 0) return;
        totalVisible += matched.length;

        const sec = document.createElement('section');
        sec.className = 'category-section';
        sec.innerHTML = `<h2 class="category-title">${cat.title}</h2>`;

        const grid = document.createElement('div');
        grid.className = 'tool-grid';

        matched.forEach(tool => {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'tool-card';
          card.innerHTML = `
            <span class="tool-icon" aria-hidden="true">${ICONS[tool.icon]}</span>
            <div class="tool-meta">
              <div class="tool-name">${tool.name}</div>
              <p class="tool-desc">${tool.desc}</p>
            </div>
          `;
          card.addEventListener('click', () => openTool(tool));
          grid.appendChild(card);
        });

        sec.appendChild(grid);
        categoriesContainer.appendChild(sec);
      });

      emptySearch.style.display = totalVisible === 0 ? 'block' : 'none';
    }

    searchInput.addEventListener('input', e => renderDirectory(e.target.value));

    function showHome() {
      workspaceView.classList.remove('active');
      homeView.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('homeLogoBtn').addEventListener('click', showHome);
    document.getElementById('backToHomeBtn').addEventListener('click', showHome);

    function openTool(tool) {
      homeView.classList.add('hidden');
      workspaceView.classList.add('active');
      wsIcon.innerHTML = ICONS[tool.icon];
      wsTitle.textContent = tool.name;
      wsDesc.textContent = tool.desc;
      wsBody.innerHTML = '';
      TOOL_BUILDERS[tool.id](wsBody);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function loadImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => resolve({ img, dataUrl: reader.result });
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    const TOOL_BUILDERS = {
      /* 1. ลบพื้นหลังรูป */
      'bg-remove': (root) => {
        root.innerHTML = `
          <label class="dropzone">
            <input type="file" id="bgFile" accept="image/*">
            <div class="dropzone-title">คลิกเพื่อเลือกรูปภาพที่ต้องการลบพื้นหลัง</div>
            <div class="dropzone-sub">ระบบจะตรวจจับสีพื้นหลังบริเวณขอบภาพให้อัตโนมัติ หรือคลิกที่จุดพื้นหลังบนภาพเพื่อระบุสี</div>
          </label>
          <div class="controls-row">
            <div class="field">
              <label for="bgTol">ความละเอียดการตัดขอบ (Tolerance): <span id="bgTolVal">38</span></label>
              <input type="range" id="bgTol" min="5" max="140" value="38" class="input">
            </div>
            <button type="button" class="btn btn-primary" id="bgDownload" disabled>ดาวน์โหลด PNG พื้นใส</button>
          </div>
          <div class="preview-box checkerboard" id="bgPreviewWrap" style="display:none;">
            <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">คลิกที่พื้นหลังในรูปเพื่อเปลี่ยนสีที่ต้องการลบ</div>
            <canvas id="bgCanvas" style="cursor:crosshair;"></canvas>
          </div>
        `;
        let sourceImg = null;
        let targetColor = null;
        const fileIn = root.querySelector('#bgFile');
        const tolIn = root.querySelector('#bgTol');
        const tolVal = root.querySelector('#bgTolVal');
        const dlBtn = root.querySelector('#bgDownload');
        const wrap = root.querySelector('#bgPreviewWrap');
        const canvas = root.querySelector('#bgCanvas');
        const ctx = canvas.getContext('2d');

        function processBg() {
          if (!sourceImg) return;
          canvas.width = sourceImg.width;
          canvas.height = sourceImg.height;
          ctx.drawImage(sourceImg, 0, 0);
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const d = imgData.data;
          if (!targetColor) {
            targetColor = [d[0], d[1], d[2]];
          }
          const tol = Number(tolIn.value);
          const [tr, tg, tb] = targetColor;
          for (let i = 0; i < d.length; i += 4) {
            const dist = Math.sqrt(
              Math.pow(d[i] - tr, 2) +
              Math.pow(d[i + 1] - tg, 2) +
              Math.pow(d[i + 2] - tb, 2)
            );
            if (dist <= tol) {
              d[i + 3] = 0;
            } else if (dist <= tol + 18) {
              d[i + 3] = Math.round(((dist - tol) / 18) * 255);
            }
          }
          ctx.putImageData(imgData, 0, 0);
          wrap.style.display = 'block';
          dlBtn.disabled = false;
        }

        fileIn.addEventListener('change', async (e) => {
          const f = e.target.files[0];
          if (!f) return;
          const { img } = await loadImageFile(f);
          sourceImg = img;
          targetColor = null;
          processBg();
        });

        tolIn.addEventListener('input', () => {
          tolVal.textContent = tolIn.value;
          processBg();
        });

        canvas.addEventListener('click', (e) => {
          if (!sourceImg) return;
          const rect = canvas.getBoundingClientRect();
          const x = Math.floor((e.clientX - rect.left) * (canvas.width / rect.width));
          const y = Math.floor((e.clientY - rect.top) * (canvas.height / rect.height));
          const temp = document.createElement('canvas');
          temp.width = sourceImg.width;
          temp.height = sourceImg.height;
          const tctx = temp.getContext('2d');
          tctx.drawImage(sourceImg, 0, 0);
          const p = tctx.getImageData(x, y, 1, 1).data;
          targetColor = [p[0], p[1], p[2]];
          processBg();
        });

        dlBtn.addEventListener('click', () => {
          triggerDownload(canvas.toDataURL('image/png'), 'removed-bg.png');
        });
      },

      /* 2. ย่อขนาดไฟล์รูป */
      'img-compress': (root) => {
        root.innerHTML = `

            <input type="file" id="cmpFile" accept="image/*">
            <div class="dropzone-title">คลิกเพื่อเลือกรูปภาพที่ต้องการบีบอัด</div>
            <div class="dropzone-sub">รองรับ JPG, PNG, WebP พร้อมเปรียบเทียบขนาดก่อน-หลัง</div>

          </div>
          <div id="cmpStats" class="stat-grid" style="display:none;">
            <div class="stat-card"><div class="stat-val" id="origSize">-</div><div class="stat-lbl">ขนาดเดิม</div></div>
            <div class="stat-card"><div class="stat-val" id="newSize">-</div><div class="stat-lbl">ขนาดหลังบีบอัด</div></div>
            <div class="stat-card"><div class="stat-val" id="savedPct">-</div><div class="stat-lbl">ลดลง</div></div>
          </div>
          <div class="preview-box" id="cmpPreviewWrap" style="display:none;">
            <img id="cmpPreview" class="preview-img" alt="ตัวอย่างรูปที่ย่อขนาดแล้ว">
          </div>
        `;
        let rawFile = null;
        let loadedImg = null;
        let outUrl = '';

        const fileIn = root.querySelector('#cmpFile');
        const qualIn = root.querySelector('#cmpQual');
        const qualVal = root.querySelector('#cmpQualVal');
        const dlBtn = root.querySelector('#cmpDownload');

        function runCompress() {
          if (!loadedImg) return;
          const c = document.createElement('canvas');
          c.width = loadedImg.width;
          c.height = loadedImg.height;
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(loadedImg, 0, 0);
          const q = Number(qualIn.value) / 100;
          c.toBlob((blob) => {
            if (!blob) return;
            if (outUrl) URL.revokeObjectURL(outUrl);
            outUrl = URL.createObjectURL(blob);
            root.querySelector('#cmpPreview').src = outUrl;
            root.querySelector('#cmpPreviewWrap').style.display = 'block';
            root.querySelector('#cmpStats').style.display = 'grid';
            root.querySelector('#origSize').textContent = formatBytes(rawFile.size);
            root.querySelector('#newSize').textContent = formatBytes(blob.size);
            const pct = Math.max(0, Math.round((1 - blob.size / rawFile.size) * 100));
            root.querySelector('#savedPct').textContent = pct + '%';
            dlBtn.disabled = false;
          }, 'image/jpeg', q);
        }

        fileIn.addEventListener('change', async (e) => {
          const f = e.target.files[0];
          if (!f) return;
          rawFile = f;
          const { img } = await loadImageFile(f);
          loadedImg = img;
          runCompress();
        });

        qualIn.addEventListener('input', () => {
          qualVal.textContent = qualIn.value;
          runCompress();
        });

        dlBtn.addEventListener('click', () => {
          if (outUrl) triggerDownload(outUrl, 'compressed.jpg');
        });
      },

        function updateConversion() {
          if (!currentImg) return;
          const c = document.createElement('canvas');

          c.height = currentImg.height;
          const ctx = c.getContext('2d');
          if (fmtSel.value === 'image/jpeg') {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, c.width, c.height);
          }

          root.querySelector('#cvPreview').src = convertedUrl;
          root.querySelector('#cvPreviewWrap').style.display = 'block';

        }

          const f = e.target.files[0];

          const { img } = await loadImageFile(f);
          currentImg = img;
          updateConversion();
        });

        fmtSel.addEventListener('change', updateConversion);

        cvBtn.addEventListener('click', () => {

        function renderResized() {
          if (!srcImg) return;

          canvas.width = w;

          if (!f) return;
          const { img } = await loadImageFile(f);
          srcImg = img;
          ratio = img.width / img.height;
          wIn.value = img.width;
          hIn.value = img.height;
          renderResized();
        });

        wIn.addEventListener('input', () => {
          if (srcImg && lockIn.checked && wIn.value) {
            hIn.value = Math.max(1, Math.round(Number(wIn.value) / ratio));
          }
          renderResized();
        });

        hIn.addEventListener('input', () => {
          if (srcImg && lockIn.checked && hIn.value) {
            wIn.value = Math.max(1, Math.round(Number(hIn.value) * ratio));

          renderResized();

      'img-crop': (root) => {
        root.innerHTML = `

          <div class="controls-row">
            <div class="field">
              <label for="crZoom">ซูม (Zoom): <span id="crZoomVal">100</span>%</label>

            </div>
            <div class="field">
              <label for="crOffX">เลื่อนแนวนอน (X)</label>
              <input type="range" id="crOffX" min="-100" max="100" value="0" class="input">
            </div>
            <div class="field">
              <label for="crOffY">เลื่อนแนวตั้ง (Y)</label>
              <input type="range" id="crOffY" min="-100" max="100" value="0" class="input">
            </div>
            <button type="button" class="btn btn-primary" id="crDownload" disabled>ดาวน์โหลดรูปที่ครอป</button>
          </div>
          <div class="preview-box" id="crPreviewWrap" style="display:none;">
            <canvas id="crCanvas"></canvas>
          </div>
        `;
        let srcImg = null;
        let currentRatio = [1, 1];
        const canvas = root.querySelector('#crCanvas');
        const dlBtn = root.querySelector('#crDownload');
        const zoomIn = root.querySelector('#crZoom');
        const offXIn = root.querySelector('#crOffX');
        const offYIn = root.querySelector('#crOffY');

        function drawCrop() {
          if (!srcImg) return;
          const [rw, rh] = currentRatio;
          const targetRatio = rw / rh;
          const imgRatio = srcImg.width / srcImg.height;
          let baseW, baseH;
          if (imgRatio > targetRatio) {
            baseH = srcImg.height;
            baseW = baseH * targetRatio;
          } else {
            baseW = srcImg.width;
            baseH = baseW / targetRatio;
          }
          const zoom = Number(zoomIn.value) / 100;
          const cropW = baseW / zoom;
          const cropH = baseH / zoom;
          const maxShiftX = (srcImg.width - cropW) / 2;
          const maxShiftY = (srcImg.height - cropH) / 2;
          const sx = (srcImg.width - cropW) / 2 + (Number(offXIn.value) / 100) * maxShiftX;
          const sy = (srcImg.height - cropH) / 2 + (Number(offYIn.value) / 100) * maxShiftY;

          canvas.width = Math.round(cropW);
          canvas.height = Math.round(cropH);
          canvas.getContext('2d').drawImage(srcImg, sx, sy, cropW, cropH, 0, 0, canvas.width, canvas.height);
          root.querySelector('#crPreviewWrap').style.display = 'block';
          dlBtn.disabled = false;
        }

        root.querySelector('#crFile').addEventListener('change', async (e) => {
          const f = e.target.files[0];
          if (!f) return;
          const { img } = await loadImageFile(f);
          srcImg = img;
          drawCrop();
        });

        root.querySelectorAll('#crRatios .pill-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            root.querySelectorAll('#crRatios .pill-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentRatio = btn.dataset.ratio.split(':').map(Number);
            drawCrop();
          });
        });

        [zoomIn, offXIn, offYIn].forEach(inp => inp.addEventListener('input', () => {
          root.querySelector('#crZoomVal').textContent = zoomIn.value;
          drawCrop();
        }));

        dlBtn.addEventListener('click', () => {
          triggerDownload(canvas.toDataURL('image/png'), 'cropped.png');
        });
      },

          </div>

        `;
        let pdfBytes = null;
        let totalPages = 0;
        const runBtn = root.querySelector('#spRun');
        const infoEl = root.querySelector('#spInfo');
        const statusEl = root.querySelector('#spStatus');

        root.querySelector('#spFile').addEventListener('change', async (e) => {
          const f = e.target.files[0];
          if (!f) return;
          pdfBytes = await f.arrayBuffer();
          const doc = await PDFLib.PDFDocument.load(pdfBytes);
          totalPages = doc.getPageCount();
          infoEl.textContent = `${f.name} — ทั้งหมด ${totalPages} หน้า`;
          runBtn.disabled = false;
        });

        runBtn.addEventListener('click', async () => {
          if (!pdfBytes) return;
          const srcDoc = await PDFLib.PDFDocument.load(pdfBytes);
          const raw = root.querySelector('#spRange').value.trim();
          const indices = [];
          if (!raw) {
            for (let i = 0; i < totalPages; i++) indices.push(i);
          } else {
            raw.split(',').forEach(part => {
              const p = part.trim();
              if (p.includes('-')) {
                const [a, b] = p.split('-').map(n => parseInt(n, 10));
                for (let k = a; k <= b; k++) {
                  if (k >= 1 && k <= totalPages) indices.push(k - 1);
                }
              } else {
                const n = parseInt(p, 10);
                if (n >= 1 && n <= totalPages) indices.push(n - 1);
              }
            });
          }
          if (indices.length === 0) {
            statusEl.textContent = 'กรุณาระบุเลขหน้าให้อยู่ในช่วง 1 ถึง ' + totalPages;
            return;
          }
          const outDoc = await PDFLib.PDFDocument.create();
          const pages = await outDoc.copyPages(srcDoc, indices);
          pages.forEach(p => outDoc.addPage(p));
          const outBytes = await outDoc.save();
          triggerDownload(URL.createObjectURL(new Blob([outBytes], { type: 'application/pdf' })), 'extracted-pages.pdf');
          statusEl.textContent = `ดึงหน้าสำเร็จ (${indices.length} หน้า)`;
        });
      },

      /* 10. จัดหน้า PDF */
      'pdf-organize': (root) => {
        root.innerHTML = `
          <label class="dropzone">
            <input type="file" id="orgFile" accept="application/pdf">
            <div class="dropzone-title">คลิกเพื่อเลือกไฟล์ PDF เพื่อดูตัวอย่างและจัดเรียงหน้า</div>
            <div class="dropzone-sub">สามารถสลับหน้า หมุนทีละหน้า หรือลบหน้าที่ไม่ต้องการได้</div>
          </label>
          <button type="button" class="btn btn-primary" id="orgSave" disabled>บันทึก PDF ที่จัดหน้าแล้ว</button>
          <div class="page-grid" id="orgGrid"></div>
        `;
        let rawBytes = null;
        let pageStates = []; // [{ origIndex, rot }]
        const gridEl = root.querySelector('#orgGrid');
        const saveBtn = root.querySelector('#orgSave');

        async function renderPages() {
          gridEl.innerHTML = '';
          if (!rawBytes) return;
          const pdf = await window.pdfjsLib.getDocument({ data: rawBytes.slice(0) }).promise;

          for (let i = 0; i < pageStates.length; i++) {
            const st = pageStates[i];
            const page = await pdf.getPage(st.origIndex + 1);
            const vp = page.getViewport({ scale: 0.35, rotation: st.rot });
            const card = document.createElement('div');
            card.className = 'page-card';
            const c = document.createElement('canvas');
            c.width = vp.width;
            c.height = vp.height;
            await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;

            const lbl = document.createElement('div');
            lbl.style.fontSize = '12px';
            lbl.style.marginTop = '4px';
            lbl.textContent = `หน้า ${i + 1} (เดิม ${st.origIndex + 1})`;

            const acts = document.createElement('div');
            acts.className = 'page-actions';
            acts.innerHTML = `
              <button type="button" class="icon-btn" title="เลื่อนซ้าย">←</button>
              <button type="button" class="icon-btn" title="เลื่อนขวา">→</button>
              <button type="button" class="icon-btn" title="หมุน 90°">↻</button>
              <button type="button" class="icon-btn" title="ลบหน้า">✕</button>
            `;
            const [bLeft, bRight, bRot, bDel] = acts.querySelectorAll('button');
            bLeft.disabled = i === 0;
            bRight.disabled = i === pageStates.length - 1;
            bLeft.addEventListener('click', () => {
              [pageStates[i - 1], pageStates[i]] = [pageStates[i], pageStates[i - 1]];
              renderPages();
            });
            bRight.addEventListener('click', () => {
              [pageStates[i + 1], pageStates[i]] = [pageStates[i], pageStates[i + 1]];
              renderPages();
            });
            bRot.addEventListener('click', () => {
              st.rot = (st.rot + 90) % 360;
              renderPages();
            });
            bDel.addEventListener('click', () => {
              if (pageStates.length > 1) {
                pageStates.splice(i, 1);
                renderPages();
              }
            });

            card.append(c, lbl, acts);
            gridEl.appendChild(card);
          }
          saveBtn.disabled = pageStates.length === 0;
        }

        root.querySelector('#orgFile').addEventListener('change', async (e) => {
          const f = e.target.files[0];
          if (!f) return;
          rawBytes = await f.arrayBuffer();
          const doc = await PDFLib.PDFDocument.load(rawBytes);
          pageStates = doc.getPageIndices().map(idx => ({ origIndex: idx, rot: 0 }));
          renderPages();
        });

        saveBtn.addEventListener('click', async () => {
          const src = await PDFLib.PDFDocument.load(rawBytes);
          const out = await PDFLib.PDFDocument.create();
          for (const st of pageStates) {
            const [p] = await out.copyPages(src, [st.origIndex]);
            const cur = p.getRotation().angle;
            p.setRotation(PDFLib.degrees((cur + st.rot) % 360));
            out.addPage(p);
          }
          const bytes = await out.save();
          triggerDownload(URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' })), 'organized.pdf');
        });
      },

      'short-link': (root) => {
        // Check if current URL has #u= redirect hash
        root.innerHTML = `
          <div class="controls-row">
            <div class="field" style="flex:2;">
              <label for="slUrl">วางลิงก์ยาวที่ต้องการย่อ (URL)</label>

              <input type="text" id="slAlias" class="input" placeholder="เช่น promo25">
            </div>
            <button type="button" class="btn btn-primary" id="slCreate">ย่อลิงก์</button>
          </div>
          <div id="slError" style="color:var(--danger);font-size:13px;margin-bottom:8px;"></div>
          <div class="file-list" id="slList"></div>
        `;
        const urlIn = root.querySelector('#slUrl');
        const aliasIn = root.querySelector('#slAlias');
        const errEl = root.querySelector('#slError');
        const listEl = root.querySelector('#slList');
        const links = [];

        function hashCode(str) {
          let h = 2166136261;
          for (let i = 0; i < str.length; i++) {
            h ^= str.charCodeAt(i);
            h = Math.imul(h, 16777619);
          }
          return (h >>> 0).toString(36).slice(0, 6);
        }

        function renderLinks() {
          listEl.innerHTML = '';
          links.forEach(item => {
            const row = document.createElement('div');
            row.className = 'file-item';
            row.innerHTML = `
              <div style="min-width:0;flex:1;">
                <div style="font-weight:700;color:var(--brand);font-size:14px;">${item.shortText}</div>
                <div style="font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.longUrl}</div>
              </div>
              <div style="display:flex;gap:6px;">
                <button type="button" class="btn btn-secondary" data-copy="short" style="padding:6px 10px;font-size:12px;">คัดลอกลิงก์สั้น</button>
              </div>
            `;
            row.querySelector('[data-copy="short"]').addEventListener('click', (e) => {
              navigator.clipboard?.writeText(item.shortText);
              e.target.textContent = 'คัดลอกแล้ว!';
              setTimeout(() => { e.target.textContent = 'คัดลอกลิงก์สั้น'; }, 1200);
            });
            listEl.appendChild(row);
          });
        }

        root.querySelector('#slCreate').addEventListener('click', () => {
          errEl.textContent = '';
          let raw = urlIn.value.trim();
          if (!raw) {
            errEl.textContent = 'กรุณากรอกลิงก์ที่ต้องการย่อ';
            return;
          }
          if (!/^https?:\/\//i.test(raw)) raw = 'https://' + raw;
          try {
            new URL(raw);
          } catch {
            errEl.textContent = 'รูปแบบลิงก์ไม่ถูกต้อง';
            return;
          }
          const code = (aliasIn.value.trim().replace(/[^a-zA-Z0-9_-]/g, '') || hashCode(raw));
          const shortText = `utl.to/${code}`;
          links.unshift({ code, shortText, longUrl: raw });
          urlIn.value = '';
          aliasIn.value = '';
          renderLinks();
        });
      },

        root.innerHTML = `

          </div>

            <canvas id="qrCanvas" width="280" height="280"></canvas>
          </div>
        `;
        let logoImg = null;
        let svgMarkup = '';
        const textIn = root.querySelector('#qrText');
        const fgIn = root.querySelector('#qrFg');
        const bgIn = root.querySelector('#qrBg');
        const canvas = root.querySelector('#qrCanvas');
        const ctx = canvas.getContext('2d');

        function renderQr() {
          const val = textIn.value.trim() || 'about:invalid#zPythonSafez';
          const fg = fgIn.value;
          const bg = bgIn.value;
          const qr = window.qrcode(0, 'H');
          qr.addData(val);
          qr.make();
          const count = qr.getModuleCount();
          const size = 280;
          const margin = 16;
          const cell = (size - margin * 2) / count;

          ctx.fillStyle = bg;
          ctx.fillRect(0, 0, size, size);
          ctx.fillStyle = fg;

          let svgRects = `<rect width="${size}" height="${size}" fill="${bg}"/>`;
          for (let r = 0; r < count; r++) {
            for (let c = 0; c < count; c++) {
              if (qr.isDark(r, c)) {
                const x = margin + c * cell;
                const y = margin + r * cell;
                ctx.fillRect(x, y, Math.ceil(cell), Math.ceil(cell));
                svgRects += `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${cell.toFixed(2)}" height="${cell.toFixed(2)}" fill="${fg}"/>`;
              }
            }
          }

          if (logoImg) {
            const ls = 60;
            const lx = (size - ls) / 2;
            const ly = (size - ls) / 2;
            ctx.fillStyle = bg;
            ctx.fillRect(lx - 4, ly - 4, ls + 8, ls + 8);
            ctx.drawImage(logoImg, lx, ly, ls, ls);
          }

          svgMarkup = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${svgRects}</svg>`;
        }

        [textIn, fgIn, bgIn].forEach(el => el.addEventListener('input', renderQr));

        root.querySelector('#qrLogo').addEventListener('change', async (e) => {
          const f = e.target.files[0];
          if (!f) { logoImg = null; renderQr(); return; }
          const { img } = await loadImageFile(f);
          logoImg = img;
          renderQr();
        });

        root.querySelector('#qrDlPng').addEventListener('click', () => {
          triggerDownload(canvas.toDataURL('image/png'), 'qrcode.png');
        });

        root.querySelector('#qrDlSvg').addEventListener('click', () => {
          const blob = new Blob([svgMarkup], { type: 'image/svg+xml' });
          triggerDownload(URL.createObjectURL(blob), 'qrcode.svg');
        });

        renderQr();
      },

          const chars = Array.from(text).length;
          const noSpace = Array.from(text.replace(/\s+/g, '')).length;
          const lines = text.length === 0 ? 0 : text.split(/\r\n|\r|\n/).length;
          let words = 0;
          if (text.trim().length > 0) {
            if (segmenter) {
              for (const seg of segmenter.segment(text)) {
                if (seg.isWordLike) words++;
              }
            } else {
              words = text.trim().split(/\s+/).length;
            }
          }
          root.querySelector('#wcWords').textContent = words.toLocaleString();
          root.querySelector('#wcChars').textContent = chars.toLocaleString();
          root.querySelector('#wcNoSpace').textContent = noSpace.toLocaleString();
          root.querySelector('#wcLines').textContent = lines.toLocaleString();
        }

        ta.addEventListener('input', updateCounts);
      },

          let pool = '';
          if (root.querySelector('#pwUpper').checked) pool += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

          const arr = new Uint32Array(len);
          crypto.getRandomValues(arr);

          }

              </div>
            </div>
            
            <div style="border-top: 1px solid var(--border); padding-top: 16px;">
              <div style="font-weight: 600; font-size: 14px; margin-bottom: 8px;">(ทางเลือก) แปะลายเซ็นลงบนไฟล์ PDF:</div>
              <label class="dropzone" id="sigDropzone">
                <input type="file" id="sigPdfFile" accept="application/pdf">
                <div class="dropzone-title">คลิกเพื่ออัปโหลดไฟล์ PDF</div>
                <div class="dropzone-sub">อัปโหลด PDF จากนั้นคลิกบนหน้าเอกสารเพื่อแปะลายเซ็นด้านบน</div>
              </label>
              
              <div id="sigPdfWrap" style="display:none; text-align: center; margin-top: 12px;">
                <div style="font-size: 13px; color: var(--muted); margin-bottom: 8px;">คลิกตำแหน่งบนเอกสารด้านล่างเพื่อเซ็นลายเซ็นของคุณลงไป</div>
                <div style="display: flex; gap: 8px; justify-content: center; margin-bottom: 10px;">
                  <button type="button" class="btn btn-secondary" id="sigPrevPage">หน้าก่อนหน้า</button>
                  <span id="sigPageNum" style="font-weight: 600; display: inline-flex; align-items: center; font-size: 13px;">หน้า 1 / 1</span>
                  <button type="button" class="btn btn-secondary" id="sigNextPage">หน้าถัดไป</button>
                </div>
                <div style="position: relative; display: inline-block; border: 1px solid var(--border); border-radius: 8px; max-width: 100%;">
                  <canvas id="sigPdfCanvas" style="display: block; max-width: 100%;"></canvas>
                  <div id="sigFloating" style="position: absolute; border: 2px dashed var(--brand); cursor: move; width: 100px; height: 40px; display: none; background: rgba(88, 72, 229, 0.1);">
                    <div style="position: absolute; right: -6px; bottom: -6px; width: 12px; height: 12px; background: var(--brand); border-radius: 50%; cursor: se-resize;" id="sigResize"></div>
                  </div>
                </div>
                <div style="margin-top: 14px;">
                  <button type="button" class="btn btn-primary" id="sigPdfSave">ลงนามและดาวน์โหลด PDF</button>
                </div>
              </div>
            </div>
          </div>
        `;

        const canvas = root.querySelector('#sigCanvas');
        const ctx = canvas.getContext('2d');
        const colorIn = root.querySelector('#sigColor');
        const weightIn = root.querySelector('#sigWeight');
        const weightVal = root.querySelector('#sigWeightVal');
        const clearBtn = root.querySelector('#sigClear');
        const dlPngBtn = root.querySelector('#sigDlPng');

        let drawing = false;
        
        function resizeCanvas() {
          const rect = canvas.parentNode.getBoundingClientRect();
          canvas.width = rect.width;
          canvas.height = rect.height;
          ctx.strokeStyle = colorIn.value;
          ctx.lineWidth = Number(weightIn.value);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
        }
        
        setTimeout(resizeCanvas, 50);

        function getPos(e) {
          const rect = canvas.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height)
          };
        }

        function startDrawing(e) {
          drawing = true;
          const pos = getPos(e);
          ctx.beginPath();
          ctx.moveTo(pos.x, pos.y);
          e.preventDefault();
        }

        function draw(e) {
          if (!drawing) return;
          const pos = getPos(e);
          ctx.lineTo(pos.x, pos.y);
          ctx.stroke();
          e.preventDefault();
        }

        function stopDrawing() {
          drawing = false;
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        colorIn.addEventListener('change', () => { ctx.strokeStyle = colorIn.value; });
        weightIn.addEventListener('input', () => {
          weightVal.textContent = weightIn.value;
          ctx.lineWidth = Number(weightIn.value);
        });

        clearBtn.addEventListener('click', () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        dlPngBtn.addEventListener('click', () => {
          const temp = document.createElement('canvas');
          temp.width = canvas.width;
          temp.height = canvas.height;
          const tctx = temp.getContext('2d');
          tctx.drawImage(canvas, 0, 0);
          triggerDownload(temp.toDataURL('image/png'), 'signature.png');
        });

        let pdfBytes = null;
        let pdfjsDoc = null;
        let currentPage = 1;
        let totalPages = 1;
        const pdfFileIn = root.querySelector('#sigPdfFile');
        const pdfWrap = root.querySelector('#sigPdfWrap');
        const pdfCanvas = root.querySelector('#sigPdfCanvas');
        const pdfCtx = pdfCanvas.getContext('2d');
        const pageNumSpan = root.querySelector('#sigPageNum');
        const prevBtn = root.querySelector('#sigPrevPage');
        const nextBtn = root.querySelector('#sigNextPage');
        const saveBtn = root.querySelector('#sigPdfSave');
        const floatingSig = root.querySelector('#sigFloating');
        const resizeHandle = root.querySelector('#sigResize');

        let sigPos = { x: 50, y: 50, w: 120, h: 50 };
        let isDraggingSig = false;
        let isResizingSig = false;
        let dragOffset = { x: 0, y: 0 };

        async function renderPdfPage() {
          if (!pdfjsDoc) return;
          const page = await pdfjsDoc.getPage(currentPage);
          const vp = page.getViewport({ scale: 1.2 });
          pdfCanvas.width = vp.width;
          pdfCanvas.height = vp.height;
          await page.render({ canvasContext: pdfCtx, viewport: vp }).promise;
          pageNumSpan.textContent = `หน้า ${currentPage} / ${totalPages}`;
          
          prevBtn.disabled = currentPage === 1;
          nextBtn.disabled = currentPage === totalPages;
          
          updateFloatingSigPos();
          floatingSig.style.display = 'block';
        }

        function updateFloatingSigPos() {
          floatingSig.style.left = sigPos.x + 'px';
          floatingSig.style.top = sigPos.y + 'px';
          floatingSig.style.width = sigPos.w + 'px';
          floatingSig.style.height = sigPos.h + 'px';
          
          floatingSig.style.backgroundImage = `url(${canvas.toDataURL()})`;
          floatingSig.style.backgroundSize = '100% 100%';
          floatingSig.style.backgroundRepeat = 'no-repeat';
        }

        pdfFileIn.addEventListener('change', async (e) => {
          const f = e.target.files[0];
          if (!f) return;
          pdfBytes = await f.arrayBuffer();
          pdfjsDoc = await window.pdfjsLib.getDocument({ data: pdfBytes.slice(0) }).promise;
          totalPages = pdfjsDoc.numPages;
          currentPage = 1;
          pdfWrap.style.display = 'block';
          renderPdfPage();
        });

        prevBtn.addEventListener('click', () => {
          if (currentPage > 1) {
            currentPage--;
            renderPdfPage();
          }
        });

        nextBtn.addEventListener('click', () => {
          if (currentPage < totalPages) {
            currentPage++;
            renderPdfPage();
          }
        });

        floatingSig.addEventListener('mousedown', (e) => {
          if (e.target === resizeHandle) return;
          isDraggingSig = true;
          dragOffset.x = e.clientX - floatingSig.offsetLeft;
          dragOffset.y = e.clientY - floatingSig.offsetTop;
        });

        resizeHandle.addEventListener('mousedown', (e) => {
          isResizingSig = true;
          dragOffset.x = e.clientX;
          dragOffset.y = e.clientY;
          dragOffset.w = sigPos.w;
          dragOffset.h = sigPos.h;
          e.stopPropagation();
          e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
          if (isDraggingSig) {
            const x = e.clientX - dragOffset.x;
            const y = e.clientY - dragOffset.y;
            sigPos.x = Math.max(0, Math.min(pdfCanvas.width - sigPos.w, x));
            sigPos.y = Math.max(0, Math.min(pdfCanvas.height - sigPos.h, y));
            floatingSig.style.left = sigPos.x + 'px';
            floatingSig.style.top = sigPos.y + 'px';
          } else if (isResizingSig) {
            const dw = e.clientX - dragOffset.x;
            const dh = dw * (sigPos.h / sigPos.w);
            sigPos.w = Math.max(40, Math.min(pdfCanvas.width - sigPos.x, dragOffset.w + dw));
            sigPos.h = Math.max(20, Math.min(pdfCanvas.height - sigPos.y, dragOffset.h + dh));
            floatingSig.style.width = sigPos.w + 'px';
            floatingSig.style.height = sigPos.h + 'px';
          }
        });

        window.addEventListener('mouseup', () => {
          isDraggingSig = false;
          isResizingSig = false;
        });

        floatingSig.addEventListener('touchstart', (e) => {
          if (e.target === resizeHandle) {
            isResizingSig = true;
            dragOffset.x = e.touches[0].clientX;
            dragOffset.y = e.touches[0].clientY;
            dragOffset.w = sigPos.w;
            dragOffset.h = sigPos.h;
            e.stopPropagation();
          } else {
            isDraggingSig = true;
            dragOffset.x = e.touches[0].clientX - floatingSig.offsetLeft;
            dragOffset.y = e.touches[0].clientY - floatingSig.offsetTop;
          }
        });

        window.addEventListener('touchmove', (e) => {
          if (isDraggingSig) {
            const x = e.touches[0].clientX - dragOffset.x;
            const y = e.touches[0].clientY - dragOffset.y;
            sigPos.x = Math.max(0, Math.min(pdfCanvas.width - sigPos.w, x));
            sigPos.y = Math.max(0, Math.min(pdfCanvas.height - sigPos.h, y));
            floatingSig.style.left = sigPos.x + 'px';
            floatingSig.style.top = sigPos.y + 'px';
          } else if (isResizingSig) {
            const dw = e.touches[0].clientX - dragOffset.x;
            const dh = dw * (sigPos.h / sigPos.w);
            sigPos.w = Math.max(40, Math.min(pdfCanvas.width - sigPos.x, dragOffset.w + dw));
            sigPos.h = Math.max(20, Math.min(pdfCanvas.height - sigPos.y, dragOffset.h + dh));
            floatingSig.style.width = sigPos.w + 'px';
            floatingSig.style.height = sigPos.h + 'px';
          }
        });

        window.addEventListener('touchend', () => {
          isDraggingSig = false;
          isResizingSig = false;
        });

        saveBtn.addEventListener('click', async () => {
          if (!pdfBytes) return;
          const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
          const page = pdfDoc.getPage(currentPage - 1);
          const { width, height } = page.getSize();
          const sigDataUrl = canvas.toDataURL('image/png');
          const sigImage = await pdfDoc.embedPng(sigDataUrl);
          
          const scaleX = width / pdfCanvas.width;
          const scaleY = height / pdfCanvas.height;
          
          const realW = sigPos.w * scaleX;
          const realH = sigPos.h * scaleY;
          const realX = sigPos.x * scaleX;
          const realY = height - (sigPos.y * scaleY) - realH;

          page.drawImage(sigImage, {
            x: realX,
            y: realY,
            width: realW,
            height: realH
          });

          const signedBytes = await pdfDoc.save();
          const blob = new Blob([signedBytes], { type: 'application/pdf' });
          triggerDownload(URL.createObjectURL(blob), 'signed_document.pdf');
        });
      },

      /* 23. แปลง JSON เป็นตาราง/CSV */
      'json-csv': (root) => {
        root.innerHTML = `
          <div class="field" style="margin-bottom: 12px;">
            <label for="jcInput">กรอกหรือวางข้อมูล JSON</label>
            <textarea id="jcInput" class="textarea" placeholder='[
  {"ชื่อ": "สมชาย", "อายุ": 28, "แผนก": "ไอที"},
  {"ชื่อ": "สมหญิง", "อายุ": 25, "แผนก": "การตลาด"}
]'></textarea>
          </div>
          <div class="controls-row">
            <button type="button" class="btn btn-primary" id="jcRun">แปลงข้อมูล</button>
            <button type="button" class="btn btn-secondary" id="jcDlCsv" disabled>ดาวน์โหลด CSV</button>
          </div>
          <div id="jcError" style="color:var(--danger); font-size:13px; margin-top:6px;"></div>
          
          <div id="jcResultWrap" style="display:none; margin-top:16px;">
            <div style="font-weight:700; margin-bottom:8px; color:var(--brand); font-size:14px;">ผลการแปลงตารางข้อมูล:</div>
            <div style="overflow-x:auto; border:1px solid var(--border); border-radius:10px; background:#fff;">
              <table id="jcTable" style="width:100%; border-collapse:collapse; font-size:13px; text-align:left;">
                <thead></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        `;

        const input = root.querySelector('#jcInput');
        const runBtn = root.querySelector('#jcRun');
        const dlBtn = root.querySelector('#jcDlCsv');
        const errEl = root.querySelector('#jcError');
        const wrap = root.querySelector('#jcResultWrap');
        const table = root.querySelector('#jcTable');

        let csvContent = '';

        runBtn.addEventListener('click', () => {
          errEl.textContent = '';
          wrap.style.display = 'none';
          dlBtn.disabled = true;
          csvContent = '';

          const val = input.value.trim();
          if (!val) {
            errEl.textContent = 'กรุณากรอกข้อมูล JSON';
            return;
          }

          try {
            let data = JSON.parse(val);
            if (!Array.isArray(data)) {
              if (typeof data === 'object') {
                data = [data];
              } else {
                errEl.textContent = 'JSON ต้องเป็นอาร์เรย์ (Array) ของออบเจกต์';
                return;
              }
            }

            if (data.length === 0) {
              errEl.textContent = 'ไม่พบข้อมูลในอาร์เรย์ JSON';
              return;
            }

            const headers = Array.from(new Set(data.flatMap(obj => Object.keys(obj))));
            
            const thead = table.querySelector('thead');
            thead.innerHTML = `<tr>${headers.map(h => `<th style="padding:10px 12px; border-bottom:2px solid var(--border); font-weight:700; background:#fafbfe;">${h}</th>`).join('')}</tr>`;

            const tbody = table.querySelector('tbody');
            tbody.innerHTML = data.map(row => {
              return `<tr>${headers.map(h => {
                const cell = row[h] !== undefined ? row[h] : '';
                return `<style>#jcTable td{padding:8px 12px; border-bottom:1px solid var(--border);}</style><td>${typeof cell === 'object' ? JSON.stringify(cell) : cell}</td>`;
              }).join('')}</tr>`;
            }).join('');

            const csvRows = [];
            csvRows.push(headers.join(','));
            data.forEach(row => {
              const values = headers.map(h => {
                const cell = row[h] !== undefined ? String(row[h]) : '';
                const escaped = cell.replace(/"/g, '""');
                return `"${escaped}"`;
              });
              csvRows.push(values.join(','));
            });

            csvContent = '\uFEFF' + csvRows.join('\n');
            wrap.style.display = 'block';
            dlBtn.disabled = false;
          } catch (e) {
            errEl.textContent = 'รูปแบบ JSON ไม่ถูกต้อง: ' + e.message;
          }
        });

        dlBtn.addEventListener('click', () => {
          if (!csvContent) return;
          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          triggerDownload(URL.createObjectURL(blob), 'converted_data.csv');
        });
      },

      /* 24. ตัวแปลง Base64 */
      'base64-tool': (root) => {
        root.innerHTML = `
          <div class="pill-group" id="b64Type">
            <button type="button" class="pill-btn active" data-mode="text">แปลงข้อความ (Text)</button>
            <button type="button" class="pill-btn" data-mode="image">แปลงรูปภาพ (Image)</button>
          </div>

          <div id="b64TextSection">
            <div class="field" style="margin-bottom:12px;">
              <label for="b64InputText">กรอกข้อความที่ต้องการเข้ารหัส (Encode) หรือ ถอดรหัส (Decode)</label>
              <textarea id="b64InputText" class="textarea" placeholder="พิมพ์ข้อความที่นี่..."></textarea>
            </div>
            <div class="controls-row">
              <button type="button" class="btn btn-primary" id="b64Encode">เข้ารหัส (Encode)</button>
              <button type="button" class="btn btn-secondary" id="b64Decode">ถอดรหัส (Decode)</button>
            </div>
            <div class="field" style="margin-top:14px;">
              <label for="b64OutputText">ผลลัพธ์</label>
              <textarea id="b64OutputText" class="textarea" readonly placeholder="ผลลัพธ์จะปรากฏตรงนี้..."></textarea>
            </div>
            <div class="controls-row" style="margin-top:10px;">
              <button type="button" class="btn btn-secondary" id="b64Copy">คัดลอกผลลัพธ์</button>
            </div>
          </div>

          <div id="b64ImageSection" style="display:none;">
            <label class="dropzone">
              <input type="file" id="b64File" accept="image/*">
              <div class="dropzone-title">คลิกเพื่อเลือกไฟล์รูปภาพที่ต้องการแปลงเป็น Base64</div>
              <div class="dropzone-sub">ระบบจะสร้างรหัส Data URI Base64 สำหรับแท็ก &lt;img&gt; ทันที</div>
            </label>
            <div class="field" style="margin-top:14px;">
              <label for="b64OutputImg">รหัส Base64 (Data URI)</label>
              <textarea id="b64OutputImg" class="textarea" readonly style="min-height:100px; font-size:11px;"></textarea>
            </div>
            <div class="controls-row" style="margin-top:10px;">
              <button type="button" class="btn btn-secondary" id="b64CopyImg">คัดลอกรหัส</button>
            </div>
          </div>
        `;

        const tabs = root.querySelectorAll('#b64Type .pill-btn');
        const textSection = root.querySelector('#b64TextSection');
        const imageSection = root.querySelector('#b64ImageSection');

        tabs.forEach(btn => {
          btn.addEventListener('click', () => {
            tabs.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (btn.dataset.mode === 'text') {
              textSection.style.display = 'block';
              imageSection.style.display = 'none';
            } else {
              textSection.style.display = 'none';
              imageSection.style.display = 'block';
            }
          });
        });

        const inputText = root.querySelector('#b64InputText');
        const outputText = root.querySelector('#b64OutputText');
        const encodeBtn = root.querySelector('#b64Encode');
        const decodeBtn = root.querySelector('#b64Decode');
        const copyBtn = root.querySelector('#b64Copy');

        encodeBtn.addEventListener('click', () => {
          try {
            const raw = inputText.value;
            const bytes = new TextEncoder().encode(raw);
            const binary = String.fromCharCode(...bytes);
            outputText.value = btoa(binary);
          } catch (e) {
            outputText.value = 'เกิดข้อผิดพลาดในการเข้ารหัส';
          }
        });

        decodeBtn.addEventListener('click', () => {
          try {
            const raw = inputText.value.trim();
            const binary = atob(raw);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
              bytes[i] = binary.charCodeAt(i);
            }
            outputText.value = new TextDecoder().decode(bytes);
          } catch (e) {
            outputText.value = 'รหัส Base64 ไม่ถูกต้อง หรือเกิดข้อผิดพลาดในการถอดรหัส';
          }
        });

        copyBtn.addEventListener('click', (e) => {
          if (!outputText.value) return;
          navigator.clipboard?.writeText(outputText.value);
          e.target.textContent = 'คัดลอกแล้ว!';
          setTimeout(() => { e.target.textContent = 'คัดลอกผลลัพธ์'; }, 1200);
        });

        const fileIn = root.querySelector('#b64File');
        const outputImg = root.querySelector('#b64OutputImg');
        const copyImgBtn = root.querySelector('#b64CopyImg');

        fileIn.addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            outputImg.value = reader.result;
          };
          reader.readAsDataURL(file);
        });

        copyImgBtn.addEventListener('click', (e) => {
          if (!outputImg.value) return;
          navigator.clipboard?.writeText(outputImg.value);
          e.target.textContent = 'คัดลอกแล้ว!';
          setTimeout(() => { e.target.textContent = 'คัดลอกรหัส'; }, 1200);
        });
      },

            <div class="stat-grid" id="dcAgeResult" style="display:none; margin-top:20px;">

              <div class="stat-card"><div class="stat-val" id="dcAgeMonths">0</div><div class="stat-lbl">เดือน</div></div>
              <div class="stat-card"><div class="stat-val" id="dcAgeDays">0</div><div class="stat-lbl">วัน</div></div>
            </div>
            <div style="text-align:center; margin-top:12px; font-weight:600; font-size:14px; color:var(--brand);" id="dcAgeText"></div>
          </div>

          <div id="dcWorkSection" style="display:none;">
            <div class="controls-row">
              <div class="field">
                <label for="dcWorkStart">วันที่เริ่มต้นทำงาน</label>
                <input type="date" id="dcWorkStart" class="input">
              </div>
              <div class="field">
                <label for="dcWorkEnd">วันที่สิ้นสุดทำงาน</label>
                <input type="date" id="dcWorkEnd" class="input">
              </div>
            </div>
            <div class="controls-row" style="margin-top:10px; gap:16px;">
              <label><input type="checkbox" id="dcSkipSat" checked> ยกเว้นวันเสาร์</label>
              <label><input type="checkbox" id="dcSkipSun" checked> ยกเว้นวันอาทิตย์</label>
            </div>
            <button type="button" class="btn btn-primary" id="dcWorkRun" style="margin-top:14px;">คำนวณจำนวนวันทำงาน</button>
            
            <div class="stat-grid" id="dcWorkResult" style="display:none; margin-top:20px;">
              <div class="stat-card"><div class="stat-val" id="dcTotalDays">0</div><div class="stat-lbl">วันทั้งหมด</div></div>
              <div class="stat-card"><div class="stat-val" id="dcWorkDays">0</div><div class="stat-lbl">วันทำงานจริง</div></div>
              <div class="stat-card"><div class="stat-val" id="dcWeekendDays">0</div><div class="stat-lbl">วันหยุดสุดสัปดาห์</div></div>
            </div>
          </div>
        `;

        const todayStr = new Date().toISOString().split('T')[0];
        root.querySelector('#dcTarget').value = todayStr;
        root.querySelector('#dcWorkStart').value = todayStr;
        root.querySelector('#dcWorkEnd').value = todayStr;

        const tabs = root.querySelectorAll('#dcTabs .pill-btn');
        const ageSec = root.querySelector('#dcAgeSection');
        const workSec = root.querySelector('#dcWorkSection');

        tabs.forEach(btn => {
          btn.addEventListener('click', () => {
            tabs.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (btn.dataset.mode === 'age') {
              ageSec.style.display = 'block';
              workSec.style.display = 'none';
            } else {
              ageSec.style.display = 'none';
              workSec.style.display = 'block';
            }
          });
        });

        const birthIn = root.querySelector('#dcBirth');
        const targetIn = root.querySelector('#dcTarget');
        const ageRun = root.querySelector('#dcAgeRun');
        const ageRes = root.querySelector('#dcAgeResult');

        const monthsVal = root.querySelector('#dcAgeMonths');
        const daysVal = root.querySelector('#dcAgeDays');
        const ageText = root.querySelector('#dcAgeText');

        ageRun.addEventListener('click', () => {
          const d1 = new Date(birthIn.value);
          const d2 = new Date(targetIn.value);
          if (isNaN(d1) || isNaN(d2)) return;

          let y = d2.getFullYear() - d1.getFullYear();
          let m = d2.getMonth() - d1.getMonth();
          let d = d2.getDate() - d1.getDate();

          if (d < 0) {
            m--;
            const prevMonth = new Date(d2.getFullYear(), d2.getMonth(), 0);
            d += prevMonth.getDate();
          }
          if (m < 0) {
            y--;
            m += 12;
          }

          yearsVal.textContent = y;
          monthsVal.textContent = m;
          daysVal.textContent = d;
          ageRes.style.display = 'grid';
          ageText.textContent = `อายุรวมทั้งหมด: ${y} ปี ${m} เดือน ${d} วัน`;
        });

        const wStartIn = root.querySelector('#dcWorkStart');
        const wEndIn = root.querySelector('#dcWorkEnd');
        const skipSat = root.querySelector('#dcSkipSat');
        const skipSun = root.querySelector('#dcSkipSun');
        const workRun = root.querySelector('#dcWorkRun');
        const workRes = root.querySelector('#dcWorkResult');
        
        const totalDaysVal = root.querySelector('#dcTotalDays');
        const workDaysVal = root.querySelector('#dcWorkDays');
        const weekendVal = root.querySelector('#dcWeekendDays');

        workRun.addEventListener('click', () => {
          const sDate = new Date(wStartIn.value);
          const eDate = new Date(wEndIn.value);
          if (isNaN(sDate) || isNaN(eDate) || sDate > eDate) {
            alert('กรุณาใส่วันที่ให้ถูกต้องและวันเริ่มต้นต้องไม่มากกว่าวันสิ้นสุด');
            return;
          }

          let totalDays = 0;
          let workDays = 0;
          let weekendDays = 0;

          const cur = new Date(sDate);
          while (cur <= eDate) {
            totalDays++;
            const day = cur.getDay();
            const isWeekend = (day === 0 && skipSun.checked) || (day === 6 && skipSat.checked);
            if (isWeekend) {
              weekendDays++;
            } else {
              workDays++;
            }
            cur.setDate(cur.getDate() + 1);
          }

          totalDaysVal.textContent = totalDays;
          workDaysVal.textContent = workDays;
          weekendVal.textContent = weekendDays;
          workRes.style.display = 'grid';
        });
      }
