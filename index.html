        let currentCorrectWord = '';
        let currentCorrectTranslation = '';

        function initGameHub() {
          highScoreValEl.textContent = gameHighScore;
          scoreValEl.textContent = gameScore;
          setupActiveGameMode();
        }

        gameModeSel.addEventListener('change', setupActiveGameMode);

        function setupActiveGameMode() {
          const mode = gameModeSel.value;
          cQuiz.style.display = mode === 'quiz' ? 'block' : 'none';
          cScramble.style.display = mode === 'scramble' ? 'block' : 'none';
          cMemory.style.display = mode === 'memory' ? 'block' : 'none';
          cDictation.style.display = mode === 'dictation' ? 'block' : 'none';
          
          gameStatusEl.textContent = '';
          gameNextWrap.style.display = 'none';
          
          if (mode === 'quiz') startQuizQuestion();
          if (mode === 'scramble') startScrambleQuestion();
          if (mode === 'memory') startMemoryGame();
          if (mode === 'dictation') startDictationQuestion();
        }

        // Sound Effects Synth with custom Pitch, Volume and Waveform
        const sfxVolIn = root.querySelector('#lpSfxVol');
        const sfxVolVal = root.querySelector('#lpSfxVolVal');
        const sfxKeySel = root.querySelector('#lpSfxKey');
        const sfxWaveSel = root.querySelector('#lpSfxWave');

        sfxVolIn.addEventListener('input', () => {
          sfxVolVal.textContent = sfxVolIn.value;
        });

        function playSfx(isCorrect) {
          try {
            const vol = parseFloat(sfxVolIn.value) / 100;
            if (vol === 0) return; // muted

            const keyFactor = parseFloat(sfxKeySel.value) || 1;
            const waveType = sfxWaveSel.value || 'sine';

            const actx = new (window.AudioContext || window.webkitAudioContext)();
            const now = actx.currentTime;

            if (isCorrect) {
              const notes = [330, 440, 554, 660].map(f => f * keyFactor);
              notes.forEach((freq, i) => {
                const osc = actx.createOscillator();
                const gain = actx.createGain();
                osc.type = waveType;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.16 * vol, now + i * 0.07);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.12);
                osc.connect(gain); gain.connect(actx.destination);
                osc.start(now + i * 0.07); osc.stop(now + i * 0.07 + 0.14);
              });
            } else {
              const osc = actx.createOscillator();
              const gain = actx.createGain();
              osc.type = waveType;
              osc.frequency.value = 120 * keyFactor;
              gain.gain.setValueAtTime(0.25 * vol, now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
              osc.connect(gain); gain.connect(actx.destination);
              osc.start(now); osc.stop(now + 0.36);
            }
          } catch (e) {}
        }

        function triggerCorrect() {
          gameScore++;
          scoreValEl.textContent = gameScore;
          if (gameScore > gameHighScore) {
            gameHighScore = gameScore;
            highScoreValEl.textContent = gameHighScore;
            try { localStorage.setItem('ut_game_highscore', gameHighScore); } catch(e){}
          }
          gameStatusEl.style.color = 'var(--success)';
          gameStatusEl.textContent = '🎉 ถูกต้อง! เก่งมาก ๆ ค่ะ';
          playSfx(true);
          gameNextWrap.style.display = 'block';
        }

        function triggerIncorrect() {
          gameScore = 0; // reset streak
          scoreValEl.textContent = gameScore;
          gameStatusEl.style.color = 'var(--danger)';
          gameStatusEl.textContent = `❌ ยังไม่ถูกนะคะ (คำตอบที่ถูกคือ: ${currentCorrectWord} = ${currentCorrectTranslation})`;
          playSfx(false);
          gameNextWrap.style.display = 'block';
        }

        // --- 1) Quiz Mode ---
        function startQuizQuestion() {
          gameNextWrap.style.display = 'none';
          gameStatusEl.textContent = '';
          const lang = langSel.value;
          const correctItem = VOCABS[Math.floor(Math.random() * VOCABS.length)];
          
          currentCorrectWord = correctItem[lang] || correctItem.en;
          currentCorrectTranslation = correctItem.th;

          root.querySelector('#lpGameWord').textContent = currentCorrectWord;

          const incorrects = VOCABS.filter(v => v !== correctItem).map(v => v.th);
          const shuffledIncs = incorrects.sort(() => 0.5 - Math.random()).slice(0, 3);
          const choices = [correctItem.th, ...shuffledIncs].sort(() => 0.5 - Math.random());

          const choicesContainer = root.querySelector('#lpGameChoices');
          choicesContainer.innerHTML = '';

          choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn btn-secondary';
            btn.style.width = '100%';
            btn.style.padding = '10px';
            btn.style.textAlign = 'left';
            btn.textContent = choice;
            btn.addEventListener('click', () => {
              Array.from(choicesContainer.querySelectorAll('button')).forEach(b => b.disabled = true);
              if (choice === correctItem.th) {
                btn.style.background = 'var(--success)';
                btn.style.color = '#fff';
                triggerCorrect();
              } else {
                btn.style.background = 'var(--danger)';
                btn.style.color = '#fff';
                triggerIncorrect();
              }
            });
            choicesContainer.appendChild(btn);
          });
        }

        // --- 2) Scramble Mode ---
        function startScrambleQuestion() {
          gameNextWrap.style.display = 'none';
          gameStatusEl.textContent = '';
          const lang = langSel.value;
          const correctItem = VOCABS[Math.floor(Math.random() * VOCABS.length)];
          
          const origWord = (correctItem[lang] || correctItem.en).toLowerCase().replace(/[^a-z]/gi, '');
          currentCorrectWord = correctItem[lang] || correctItem.en;
          currentCorrectTranslation = correctItem.th;

          root.querySelector('#lpgScrambleHint').textContent = `คำแปลภาษาไทย: ${correctItem.th}`;
          
          // Shuffle characters
          let shuffled = origWord;
          while (shuffled === origWord && origWord.length > 1) {
            shuffled = origWord.split('').sort(() => 0.5 - Math.random()).join('');
          }
          root.querySelector('#lpgScrambleMixed').textContent = shuffled.toUpperCase();

          const scrambleIn = root.querySelector('#lpgScrambleInput');
          scrambleIn.value = '';
          scrambleIn.disabled = false;
          scrambleIn.focus();

          const checkBtn = root.querySelector('#lpgScrambleCheck');
          checkBtn.onclick = () => {
            scrambleIn.disabled = true;
            if (scrambleIn.value.trim().toLowerCase() === origWord) {
              triggerCorrect();
            } else {
              triggerIncorrect();
            }
          };
        }

        // --- 3) Memory Match Mode ---
        let selectedCards = [];
        function startMemoryGame() {
          gameNextWrap.style.display = 'none';
          gameStatusEl.textContent = '';
          const lang = langSel.value;
          
          // Pick 3 random words for a 6-card matching deck
          const subset = VOCABS.sort(() => 0.5 - Math.random()).slice(0, 4);
          const deck = [];
          subset.forEach((item, idx) => {
            deck.push({ id: idx, type: 'word', text: item[lang] || item.en, matchId: idx });
            deck.push({ id: idx, type: 'th', text: item.th, matchId: idx });
          });

          // Shuffle deck
          deck.sort(() => 0.5 - Math.random());

          const grid = root.querySelector('#lpgMemoryGrid');
          grid.innerHTML = '';
          selectedCards = [];

          deck.forEach((card, index) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn btn-secondary';
            btn.style.height = '70px';
            btn.style.fontSize = '12px';
            btn.style.padding = '4px';
            btn.textContent = '❓';
            btn.dataset.index = index;

            btn.addEventListener('click', () => {
              if (selectedCards.length >= 2 || btn.classList.contains('matched') || selectedCards.includes(btn)) return;

              btn.textContent = card.text;
              btn.style.background = 'var(--brand-soft)';
              btn.style.color = 'var(--brand)';
              selectedCards.push({ btn, card });

              if (selectedCards.length === 2) {
                const [first, second] = selectedCards;
                if (first.card.matchId === second.card.matchId && first.card.type !== second.card.type) {
                  // Matched!
                  setTimeout(() => {
                    first.btn.style.background = 'var(--success)';
                    first.btn.style.color = '#ffffff';
                    second.btn.style.background = 'var(--success)';
                    second.btn.style.color = '#ffffff';
                    first.btn.classList.add('matched');
                    second.btn.classList.add('matched');
                    selectedCards = [];

                    // Check win
                    const allMatched = Array.from(grid.querySelectorAll('button')).every(b => b.classList.contains('matched'));
                    if (allMatched) {
                      triggerCorrect();
                    }
                  }, 400);
                } else {
                  // Mismatch
                  setTimeout(() => {
                    first.btn.textContent = '❓';
                    first.btn.style.background = '';
                    first.btn.style.color = '';
                    second.btn.textContent = '❓';
                    second.btn.style.background = '';
                    second.btn.style.color = '';
                    selectedCards = [];
                  }, 1000);
                }
              }
            });

            grid.appendChild(btn);
          });
        }

        // --- 4) Dictation Mode ---
        function startDictationQuestion() {
          gameNextWrap.style.display = 'none';
          gameStatusEl.textContent = '';
          const lang = langSel.value;
          const correctItem = VOCABS[Math.floor(Math.random() * VOCABS.length)];
          
          currentCorrectWord = correctItem[lang] || correctItem.en;
          currentCorrectTranslation = correctItem.th;

          root.querySelector('#lpgDictationHint').textContent = `คำแปลภาษาไทย: ${correctItem.th}`;

          const speakBtn = root.querySelector('#lpgDictationSpeakBtn');
          speakBtn.onclick = () => {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(currentCorrectWord);
            const locales = { en: 'en-US', ja: 'ja-JP', zh: 'zh-CN' };
            u.lang = locales[lang] || 'en-US';
            window.speechSynthesis.speak(u);
          };
          speakBtn.click(); // auto play on start

          const dictIn = root.querySelector('#lpgDictationInput');
          dictIn.value = '';
          dictIn.disabled = false;
          dictIn.focus();

          const checkBtn = root.querySelector('#lpgDictationCheck');
          checkBtn.onclick = () => {
            dictIn.disabled = true;
            if (dictIn.value.trim().toLowerCase() === currentCorrectWord.toLowerCase()) {
              triggerCorrect();
            } else {
              triggerIncorrect();
            }
          };
        }

        // Next Question click
        gameNextBtn.onclick = () => {
          const mode = gameModeSel.value;
          if (mode === 'quiz') startQuizQuestion();
          if (mode === 'scramble') startScrambleQuestion();
          if (mode === 'memory') startMemoryGame();
          if (mode === 'dictation') startDictationQuestion();
        };

        // Speaking Lab Logic
        const langSel = root.querySelector('#lpLang');
        const phraseSel = root.querySelector('#lpPhrase');
        const thaiTrans = root.querySelector('#lpThaiTranslation');
        const targetText = root.querySelector('#lpTargetText');
        const listenBtn = root.querySelector('#lpListenBtn');
        const recordBtn = root.querySelector('#lpRecordBtn');
        const recStatus = root.querySelector('#lpRecStatus');
        
        const scoreWrap = root.querySelector('#lpScoreWrap');
        const userText = root.querySelector('#lpUserText');
        const scoreVal = root.querySelector('#lpScoreVal');
        const scoreLbl = root.querySelector('#lpScoreLbl');

        function populatePhrases() {
          const lang = langSel.value;
          const list = PHRASES[lang] || PHRASES.en;
          phraseSel.innerHTML = list.map((p, idx) => `<option value="${idx}">${p.text}</option>`).join('');
          updateActivePhrase();
        }

        function updateActivePhrase() {
          const lang = langSel.value;
          const list = PHRASES[lang] || PHRASES.en;
          const active = list[parseInt(phraseSel.value, 10) || 0] || list[0];
          targetText.textContent = active.text;
          thaiTrans.textContent = active.th;
          scoreWrap.style.display = 'none';
          recStatus.textContent = '';
        }

        langSel.addEventListener('change', populatePhrases);
        phraseSel.addEventListener('change', updateActivePhrase);
        populatePhrases();

        // TTS Pronunciation
        listenBtn.addEventListener('click', () => {
          if (!('speechSynthesis' in window)) return;
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(targetText.textContent);
          const locales = { en: 'en-US', ja: 'ja-JP', zh: 'zh-CN' };
          u.lang = locales[langSel.value] || 'en-US';
          window.speechSynthesis.speak(u);
        });

        // STT Recognition & Real-time Evaluation
        let recognition = null;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
          const SpeechRecObj = window.SpeechRecognition || window.webkitSpeechRecognition;
          recognition = new SpeechRecObj();
          recognition.continuous = false;
          recognition.interimResults = false;

          recognition.onstart = () => {
            recStatus.textContent = '🎤 กำลังฟังเสียงพูดของคุณ... กรุณาออกเสียงประโยคข้างต้นเสียงดังฟังชัด';
            recordBtn.disabled = true;
            scoreWrap.style.display = 'none';
          };

          recognition.onerror = () => {
            recStatus.textContent = '❌ ไม่สามารถจับเสียงได้หรือสิทธิ์ไมโครโฟนถูกบล็อก';
            recordBtn.disabled = false;
          };

          recognition.onend = () => {
            recordBtn.disabled = false;
          };

          recognition.onresult = (e) => {
            const result = e.results[0][0].transcript || '';
            const target = targetText.textContent;
            
            // Clean text comparison scoring (fuzzy scoring)
            const cleanT = s => s.toLowerCase().replace(/[^a-z0-9]/gi, '');
            const targetClean = cleanT(target);
            const resultClean = cleanT(result);

            let score = 0;
            if (targetClean === resultClean) {
              score = 100;
            } else {
              // Simple similarity scoring based on overlapping characters
              let matches = 0;
              const maxL = Math.max(targetClean.length, resultClean.length, 1);
              for (let i = 0; i < Math.min(targetClean.length, resultClean.length); i++) {
                if (targetClean[i] === resultClean[i]) matches++;
              }
              score = Math.round((matches / maxL) * 100);
            }

            userText.textContent = `"${result}"`;
            scoreVal.textContent = score + '%';
            if (score === 100) {
              scoreVal.style.color = 'var(--success)';
              scoreLbl.textContent = 'สมบูรณ์แบบ! ถูกต้อง 100%';
              recStatus.textContent = '🎉 ยอดเยี่ยมมาก! คุณออกเสียงได้อย่างสมบูรณ์แบบ';
            } else if (score > 60) {
              scoreVal.style.color = 'var(--brand)';
              scoreLbl.textContent = 'ดีมาก! ถูกต้องชัดเจน';
              recStatus.textContent = '👍 ดีมากเลยค่ะ! ลองฝึกพูดอีกนิดให้คล่องขึ้นนะคะ';
            } else {
              scoreVal.style.color = 'var(--danger)';
              scoreLbl.textContent = 'ต้องปรับปรุง';
              recStatus.textContent = '✏️ ลองกดฟังเสียงต้นฉบับแล้วลองพูดใหม่อีกรอบนะคะ';
            }

            scoreWrap.style.display = 'block';
          };
        } else {
          recordBtn.style.display = 'none';
        }

        recordBtn.addEventListener('click', () => {
          if (recognition) {
            const locales = { en: 'en-US', ja: 'ja-JP', zh: 'zh-CN' };
            recognition.lang = locales[langSel.value] || 'en-US';
            recognition.start();
          }
        });

        // Flashcards Logic
        const cardWrap = root.querySelector('#lpCardWrap');
        const cardInner = root.querySelector('#lpCardInner');
        const cardLang = root.querySelector('#lpCardLang');
        const cardFront = root.querySelector('#lpCardFront');
        const cardBack = root.querySelector('#lpCardBack');
        const prevCardBtn = root.querySelector('#lpPrevCardBtn');
        const nextCardBtn = root.querySelector('#lpNextCardBtn');

        function renderCard() {
          const item = VOCABS[curCardIdx] || VOCABS[0];
          const lang = langSel.value;
          
          cardLang.textContent = lang === 'ja' ? 'Japanese' : lang === 'zh' ? 'Chinese' : 'English';
          cardFront.textContent = item[lang] || item.en;
          cardBack.textContent = item.th;
          
          // Reset flip
          cardFlipped = false;
          cardInner.style.transform = 'rotateY(0deg)';
        }

        cardWrap.addEventListener('click', () => {
          cardFlipped = !cardFlipped;
          cardInner.style.transform = cardFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
          
          // Pronounce word when flipping to back
          if (cardFlipped && ('speechSynthesis' in window)) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(cardFront.textContent);
            const locales = { en: 'en-US', ja: 'ja-JP', zh: 'zh-CN' };
            u.lang = locales[langSel.value] || 'en-US';
            window.speechSynthesis.speak(u);
          }
        });

        prevCardBtn.addEventListener('click', () => {
          if (curCardIdx > 0) {
            curCardIdx--;
            renderCard();
          }
        });

        nextCardBtn.addEventListener('click', () => {
          if (curCardIdx < VOCABS.length - 1) {
            curCardIdx++;
            renderCard();
          }
        });
      },

          speakNow(text);

        genBtn.addEventListener('click', () => {

          speakNow(text);
          const sr = 22050, n = sr * 2, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
          const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
          ws(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); ws(8, 'WAVE'); ws(12, 'fmt ');
          v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
          v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true);

          const f0 = 220 * (Number(pitchIn.value) || 1);
          for (let i = 0; i < n; i++) {

            v.setInt16(44 + i * 2, s * 32767, true);
          }

          resultWrap.style.display = 'block';
          dlBtn.onclick = () => triggerDownload(url, 'tts_audio.wav');

                  rctx.fillRect(0, 0, W, H);
                }
              } else if (transMode === 'wipe-right' && clipProg < tSpan) {
                const wipeW = (1 - clipProg / tSpan) * W;
                rctx.fillStyle = '#000';
                rctx.fillRect(W - wipeW, 0, wipeW, H);
              }

              const eff = effectSel.value;
              if (eff === 'aura-glow') {
                const aura = rctx.createRadialGradient(W / 2, H / 2, 30, W / 2, H / 2, W * 0.7);
                aura.addColorStop(0, 'rgba(255, 180, 240, 0.25)');
                aura.addColorStop(0.5, 'rgba(160, 210, 255, 0.18)');
                aura.addColorStop(1, 'rgba(0, 0, 0, 0)');

                const sh = 18, sy = Math.floor(Math.random() * (H - sh));
                rctx.drawImage(renderCanvas, 0, sy, W, sh, (Math.random() - 0.5) * 28, sy, W, sh);
              } else if (eff === 'retro-vhs') {
                rctx.fillStyle = 'rgba(10, 15, 30, 0.15)';
                for (let y = 0; y < H; y += 4) rctx.fillRect(0, y, W, 1.5);
                rctx.font = '700 13px monospace';

                rctx.fillStyle = grad;
                rctx.fillRect(0, 0, W, H);
              } else if (eff === 'vignette') {
                const grad = rctx.createRadialGradient(W / 2, H / 2, W * 0.25, W / 2, H / 2, W * 0.65);
                grad.addColorStop(0, 'rgba(0,0,0,0)');
                grad.addColorStop(1, 'rgba(0,0,0,0.55)');
                rctx.fillStyle = grad;
                rctx.fillRect(0, 0, W, H);

                rctx.textAlign = 'center';
                rctx.fillStyle = '#ffffff';
                rctx.fillText(cap, W / 2, boxY + 28);
              }

              requestAnimationFrame(drawLoop);
            }
            requestAnimationFrame(drawLoop);

                const gain = audioCtx.createGain();
                osc.type = bgmChoice === 'upbeat' ? 'triangle' : 'sine';
                osc.frequency.value = seq[idx % seq.length];
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.42);
                osc.connect(gain);
                gain.connect(dest);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.45);
                idx++;
              };
              playBeat();
              synthTimer = setInterval(playBeat, bgmChoice === 'upbeat' ? 300 : 480);
            }

            const combined = new MediaStream();
            stream.getVideoTracks().forEach(t => combined.addTrack(t));
            if (bgmChoice !== 'none') dest.stream.getAudioTracks().forEach(t => combined.addTrack(t));

            const recorder = new MediaRecorder(combined, { mimeType: 'video/webm;codecs=vp9' });
            const chunks = [];
            recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
            recorder.onstop = () => {
              if (synthTimer) clearInterval(synthTimer);
              const blob = new Blob(chunks, { type: 'video/webm' });
              const url = URL.createObjectURL(blob);
              outVideo.src = url;
              previewWrap.style.display = 'block';
              triggerDownload(url, 'slideshow_video.webm');
              statusEl.textContent = `สร้างคลิปสไลด์โชว์จากรูปภาพ ${imgs.length} รูปเรียบร้อยแล้ว!`;
              runBtn.disabled = false;
            };
            recorder.start();

            let startT = null;
            function drawFrame(ts) {
              if (!startT) startT = ts;
              const elapsed = (ts - startT) / 1000;
              if (elapsed >= totalDur) { recorder.stop(); return; }
              const idx = Math.min(Math.floor(elapsed / dur), loaded.length - 1);
              const prog = (elapsed % dur) / dur;
              const img = loaded[idx];
              const trans = root.querySelector('#vsTransition').value;
              const W = canvas.width, H = canvas.height;

              ctx.fillStyle = '#14151a';
              ctx.fillRect(0, 0, W, H);

              if (trans === 'cross-dissolve' && idx > 0 && prog < 0.28) {
                const prevImg = loaded[idx - 1];
                const pRatio = Math.min(W / prevImg.width, H / prevImg.height);
                const pw = prevImg.width * pRatio, ph = prevImg.height * pRatio;
                ctx.save();
                ctx.filter = root.querySelector('#vsFilter').value;
                ctx.globalAlpha = 1 - (prog / 0.28);
                ctx.drawImage(prevImg, (W - pw) / 2, (H - ph) / 2, pw, ph);
                ctx.restore();
              }

              ctx.save();
              ctx.filter = root.querySelector('#vsFilter').value;
              const ratio = Math.min(W / img.width, H / img.height);
              const scale = trans === 'zoom' ? (1 + prog * 0.14) : 1;
              const offX = (trans === 'slide' && prog < 0.22) ? (1 - prog / 0.22) * W : 0;
              ctx.globalAlpha = ((trans === 'fade' || trans === 'cross-dissolve') && prog < 0.28) ? (prog / 0.28) : 1;
              const w = img.width * ratio * scale, h = img.height * ratio * scale;
              if (trans === 'wipe' && prog < 0.25) {
                ctx.beginPath();
                ctx.rect(0, 0, W * (prog / 0.25), H);
                ctx.clip();
              }
              ctx.drawImage(img, (W - w) / 2 + offX, (H - h) / 2, w, h);
              ctx.restore();

              if (trans === 'flash-white' && prog < 0.16) {
                ctx.fillStyle = `rgba(255, 255, 255, ${(1 - prog / 0.16).toFixed(2)})`;
                ctx.fillRect(0, 0, W, H);
              }

              const cap = root.querySelector('#vsCaption').value.trim();
              if (cap) {
                ctx.fillStyle = 'rgba(0,0,0,0.58)';
                ctx.fillRect(0, H - 54, W, 38);
                ctx.font = '700 18px "Noto Sans Thai", sans-serif';
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.fillText(cap, W / 2, H - 29);
              }
              requestAnimationFrame(drawFrame);
            }
            requestAnimationFrame(drawFrame);
          } catch (err) {
            statusEl.textContent = `สร้างคลิปสไลด์โชว์จากรูปภาพ ${imgs.length} รูปเรียบร้อยแล้ว!`;
            runBtn.disabled = false;
          }
        });
      },

        const statusEl = root.querySelector('#wtpStatus');
        const expBtn = root.querySelector('#wtpExportPdf');

        // Minimal in-browser .docx (ZIP) XML text extractor
        async function extractDocxText(arrayBuffer) {
          const bytes = new Uint8Array(arrayBuffer);
          const rawStr = new TextDecoder('utf-8', { fatal: false }).decode(bytes);
          // If it's HTML/DOC or plain text
          if (rawStr.includes('<body') || rawStr.includes('<p')) {
            const tmp = document.createElement('div');
            tmp.innerHTML = rawStr;
            const txt = (tmp.innerText || tmp.textContent || '').trim();
            if (txt) return txt;
          }
          // Try DecompressionStream for .docx word/document.xml entries if uncompressed or parse XML tags
          const xmlMatches = rawStr.match(/<w:t[^>]*>([^<]+)<\/w:t>/g);
          if (xmlMatches && xmlMatches.length > 0) {
            return xmlMatches.map(m => m.replace(/<[^>]+>/g, '')).join(' ');
          }
          // Clean printable UTF-8 lines fallback
          const clean = rawStr.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, ' ').replace(/\s{3,}/g, '\n').trim();
          return clean.slice(0, 8000);
        }

        fileIn.addEventListener('change', async (e) => {
          const f = e.target.files[0];
          if (!f) return;
          docBaseName = f.name.replace(/\.(docx?|txt|html?)$/i, '') || 'word-document';
          if (!titleIn.value) titleIn.value = docBaseName;
          infoEl.textContent = `ไฟล์ที่เลือก: ${f.name} (${formatBytes(f.size)})`;
          statusEl.textContent = 'กำลังอ่านเนื้อหาจากไฟล์เอกสาร...';

          try {
            if (f.name.toLowerCase().endsWith('.txt') || f.name.toLowerCase().endsWith('.doc') || f.name.toLowerCase().endsWith('.html')) {
              const text = await f.text();
              if (text.includes('<body') || text.includes('<p')) {
                const d = document.createElement('div');
                d.innerHTML = text;
                editor.value = (d.innerText || d.textContent || text).trim();
              } else {
                editor.value = text;
              }
            } else {
              const buf = await f.arrayBuffer();
              const extracted = await extractDocxText(buf);
              editor.value = extracted || `[โหลดไฟล์ ${f.name} เรียบร้อยแล้ว]\nคุณสามารถตรวจสอบหรือวางข้อความเอกสารที่นี่เพื่อเรนเดอร์เป็นไฟล์ PDF มาตรฐาน A4`;
            }
            statusEl.textContent = 'โหลดเนื้อหาเอกสารเรียบร้อยแล้ว พร้อมแปลงเป็น PDF!';
          } catch (err) {
            statusEl.textContent = 'พร้อมแปลงเนื้อหาด้านล่างเป็นไฟล์ PDF';
          }
        });

        expBtn.addEventListener('click', async () => {
          const bodyText = editor.value.trim();
          if (!bodyText) {
            statusEl.style.color = 'var(--danger)';
            statusEl.textContent = 'กรุณาอัปโหลดไฟล์หรือพิมพ์เนื้อหาเอกสารก่อนแปลงเป็น PDF';
            return;
          }
          statusEl.style.color = 'var(--brand)';
          statusEl.textContent = 'กำลังจัดหน้ากระดาษ A4 และสร้างไฟล์ PDF...';

          const cw = 794, ch = 1123, pad = 68;
          const fSize = Number(fontSzSel.value) || 22;
          const lineH = Math.round(fSize * 1.75);
          const docTitle = titleIn.value.trim();

          const mCanvas = document.createElement('canvas');
          const mctx = mCanvas.getContext('2d');
          mctx.font = `400 ${fSize}px "Noto Sans Thai", sans-serif`;
          const maxW = cw - pad * 2;

          const allLines = [];
          bodyText.split(/\r?\n/).forEach(para => {
            if (!para) { allLines.push(''); return; }
            let cur = '';
            for (const chChar of para.split('')) {
              if (mctx.measureText(cur + chChar).width > maxW) {
                allLines.push(cur);
                cur = chChar;
              } else {
                cur += chChar;
              }
            }
            if (cur) allLines.push(cur);
          });
          if (allLines.length === 0) allLines.push('');

          const linesPerPage = Math.max(8, Math.floor((ch - pad * 2 - 80) / lineH));
          const totalPages = Math.ceil(allLines.length / linesPerPage);
          const pdfDoc = await PDFLib.PDFDocument.create();

          for (let pIdx = 0; pIdx < totalPages; pIdx++) {
            const c = document.createElement('canvas');
            c.width = cw;
            c.height = ch;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, cw, ch);

            let startY = pad + 24;
            if (pIdx === 0 && docTitle) {
              ctx.fillStyle = '#1f2229';
              ctx.font = `700 ${Math.round(fSize * 1.35)}px "Noto Sans Thai", sans-serif`;
              ctx.fillText(docTitle, pad, startY);
              startY += lineH * 1.4;
            }

            ctx.fillStyle = '#222530';
            ctx.font = `400 ${fSize}px "Noto Sans Thai", sans-serif`;
            const slice = allLines.slice(pIdx * linesPerPage, (pIdx + 1) * linesPerPage);
            slice.forEach((ln, i) => {
              ctx.fillText(ln, pad, startY + i * lineH);
            });

            ctx.fillStyle = '#727c94';
            ctx.font = '500 15px "Noto Sans Thai", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`หน้า ${pIdx + 1} / ${totalPages}`, cw / 2, ch - 36);

            const jpgUrl = c.toDataURL('image/jpeg', 0.92);
            const emb = await pdfDoc.embedJpg(jpgUrl);
            const page = pdfDoc.addPage([595.28, 841.89]);
            page.drawImage(emb, { x: 0, y: 0, width: 595.28, height: 841.89 });
          }

          const pdfBytes = await pdfDoc.save();
          triggerDownload(URL.createObjectURL(new Blob([pdfBytes], { type: 'application/pdf' })), `${docBaseName}.pdf`);
          statusEl.textContent = `แปลงเอกสารเป็นไฟล์ PDF (${totalPages} หน้า) และดาวน์โหลดเรียบร้อยแล้ว!`;
        });
      },

          infoEl.textContent = `กำลังอ่านตารางจากไฟล์: ${f.name} (${formatBytes(f.size)})...`;
          statusEl.textContent = 'กำลังวิเคราะห์พิกัดแถวและคอลัมน์จากหน้า PDF...';
          extractedRows = [];

          try {
            const buf = await f.arrayBuffer();
            const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;

            for (let p = 1; p <= pdf.numPages; p++) {
              const page = await pdf.getPage(p);
              const content = await page.getTextContent();
              const rowMap = new Map();

              content.items.forEach(item => {
                const txt = (item.str || '').trim();
                if (!txt) return;
                const x = Math.round(item.transform[4]);
                const y = Math.round(item.transform[5] / 6) * 6;
                if (!rowMap.has(y)) rowMap.set(y, []);
                rowMap.get(y).push({ x, txt });
              });

              const sortedYs = Array.from(rowMap.keys()).sort((a, b) => b - a);
              sortedYs.forEach(y => {
                const cells = rowMap.get(y).sort((a, b) => a.x - b.x).map(c => c.txt);
                if (cells.length === 1 && cells[0].includes('  ')) {
                  extractedRows.push(cells[0].split(/\s{2,}/));
                } else {
                  extractedRows.push(cells);
                }

            dlCsvBtn.disabled = false;

            statusEl.textContent = `สกัดข้อมูลตารางจาก PDF สำเร็จทั้งหมด ${extractedRows.length} แถว!`;

            statusEl.textContent = 'เกิดข้อผิดพลาดในการอ่านไฟล์ PDF';

        dlCsvBtn.addEventListener('click', () => {
          const csv = '\uFEFF' + extractedRows.map(r => r.map(c => `"${String(c || '').replace(/"/g, '""')}"`).join(',')).join('\n');
          triggerDownload(URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })), `${excelBaseName}.csv`);
          statusEl.textContent = 'ดาวน์โหลดไฟล์ .CSV เรียบร้อยแล้ว!';
        });

        dlXlsBtn.addEventListener('click', () => {
          const rowsHtml = extractedRows.map(r => '<tr>' + r.map(c => `<td style="border:1px solid #ccc;padding:6px;">${String(c || '').replace(/&/g, '&amp;').replace(/</g, '&lt;')}</td>`).join('') + '</tr>').join('');
          const xlsHtml = makeDocFile(excelBaseName, `<table border="1" style="border-collapse:collapse;">${rowsHtml}</table>`);

          setTimeout(() => { e.target.textContent = '📋 คัดลอกตารางวางใน Excel'; }, 1200);
        });
      },

        // Helper to draw wrapped Thai text onto a canvas page and embed into PDFLib
        async function buildThaiPdfFromPages(pageDrawers) {
          const pdfDoc = await PDFLib.PDFDocument.create();
          for (const drawFn of pageDrawers) {
            const c = document.createElement('canvas');
            c.width = 794;  // A4 @ 96dpi scaled
            c.height = 1123;
            const ctx = c.getContext('2d');
            await drawFn(ctx, c.width, c.height);
            const jpgUrl = c.toDataURL('image/jpeg', 0.92);
            const embedded = await pdfDoc.embedJpg(jpgUrl);
            const page = pdfDoc.addPage([595.28, 841.89]);
            page.drawImage(embedded, { x: 0, y: 0, width: 595.28, height: 841.89 });

          return await pdfDoc.save();

          const bookAuthor = authorIn.value.trim() || 'ผู้แต่ง';
          const bookSub = subIn.value.trim() || '';

          const drawers = [];
          // 1. Cover page
          drawers.push(async (ctx, W, H) => {
            ctx.fillStyle = '#f3efff';
            ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = '#7966eb';
            ctx.lineWidth = 4;
            ctx.strokeRect(40, 40, W - 80, H - 80);
            ctx.fillStyle = '#7966eb';
            ctx.font = '800 42px "Noto Sans Thai", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(bookTitle, W / 2, H / 2 - 40);
            ctx.fillStyle = '#454b57';
            ctx.font = '500 24px "Noto Sans Thai", sans-serif';
            ctx.fillText(bookSub, W / 2, H / 2 + 15);

          });

          // 2. TOC Page
          drawers.push(async (ctx, W, H) => {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#7966eb';
            ctx.font = '700 32px "Noto Sans Thai", sans-serif';
            ctx.fillText('สารบัญ (Table of Contents)', 70, 95);
            ctx.fillStyle = '#222530';
            ctx.font = '500 22px "Noto Sans Thai", sans-serif';
            chapters.forEach((c, i) => {
              const y = 155 + i * 42;
              if (y < H - 80) {
                ctx.fillText(`${i + 1}. ${c.title || 'บทที่ ' + (i + 1)}`, 70, y);
                ctx.fillText(`หน้า ${i + 3}`, W - 140, y);
              }
            });
          });

          // 3. Chapter pages
          chapters.forEach((c, idx) => {
            drawers.push(async (ctx, W, H) => {
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, W, H);
              ctx.fillStyle = '#7966eb';
              ctx.font = '700 28px "Noto Sans Thai", sans-serif';
              ctx.fillText(c.title || `บทที่ ${idx + 1}`, 70, 90);
              ctx.fillStyle = '#222530';
              ctx.font = '400 20px "Noto Sans Thai", sans-serif';
              const lines = (c.body || '').split(/\r?\n/);
              let y = 140;
              lines.forEach(line => {
                const words = line.split('');
                let cur = '';
                for (const ch of words) {
                  if (ctx.measureText(cur + ch).width > W - 140) {
                    if (y < H - 80) ctx.fillText(cur, 70, y);
                    y += 32;
                    cur = ch;
                  } else {
                    cur += ch;

        function updatePreview() {

        }

        [sizeSel, marginSel, fontIn, headerIn, alignSel, pageNumChk, bodyIn].forEach(el => {

        });

        root.querySelector('#lyExpPdf').addEventListener('click', async () => {
          statusEl.textContent = 'กำลังจัดหน้ากระดาษและสร้างไฟล์ PDF...';
          const d = dims[sizeSel.value] || dims.A5;
          const pad = Number(marginSel.value) * 1.6;
          const fSize = Number(fontIn.value) * 1.45;
          const lineH = fSize * 1.75;
          const rawText = bodyIn.value || '';
          const paragraphs = rawText.split(/\r?\n/);

          const measureCanvas = document.createElement('canvas');
          const mctx = measureCanvas.getContext('2d');
          const cw = Math.round(d.pdfW * 1.5);
          const ch = Math.round(d.pdfH * 1.5);
          mctx.font = `400 ${fSize}px "Noto Sans Thai", sans-serif`;

          const maxLineW = cw - pad * 2;
          const allLines = [];
          paragraphs.forEach(p => {
            if (!p) { allLines.push(''); return; }
            let cur = '';
            for (const chChar of p.split('')) {
              if (mctx.measureText(cur + chChar).width > maxLineW) {
                allLines.push(cur);
                cur = chChar;
              } else {
                cur += chChar;
              }
            }
            if (cur) allLines.push(cur);
          });
          if (allLines.length === 0) allLines.push('');

          const linesPerPage = Math.max(5, Math.floor((ch - pad * 2 - 70) / lineH));
          const totalPages = Math.ceil(allLines.length / linesPerPage);
          const pdfDoc = await PDFLib.PDFDocument.create();

          for (let pIdx = 0; pIdx < totalPages; pIdx++) {
            const c = document.createElement('canvas');
            c.width = cw;
            c.height = ch;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, cw, ch);

            if (headerIn.value.trim()) {
              ctx.fillStyle = '#7c8494';
              ctx.font = `500 ${Math.round(fSize * 0.78)}px "Noto Sans Thai", sans-serif`;
              ctx.fillText(headerIn.value.trim(), pad, pad * 0.75);
            }

            ctx.fillStyle = '#1f2229';
            ctx.font = `400 ${fSize}px "Noto Sans Thai", sans-serif`;
            const slice = allLines.slice(pIdx * linesPerPage, (pIdx + 1) * linesPerPage);
            slice.forEach((ln, i) => {
              const y = pad + 30 + i * lineH;
              if (alignSel.value === 'center') {
                ctx.textAlign = 'center';
                ctx.fillText(ln, cw / 2, y);
              } else {
                ctx.textAlign = 'left';
                ctx.fillText(ln, pad, y);
              }
            });

            if (pageNumChk.checked) {
              ctx.fillStyle = '#7c8494';
              ctx.textAlign = 'center';
              ctx.font = `500 ${Math.round(fSize * 0.8)}px "Noto Sans Thai", sans-serif`;
              ctx.fillText(`— ${pIdx + 1} / ${totalPages} —`, cw / 2, ch - pad * 0.6);
            }

            const jpg = c.toDataURL('image/jpeg', 0.92);
            const emb = await pdfDoc.embedJpg(jpg);
            const page = pdfDoc.addPage([d.pdfW, d.pdfH]);
            page.drawImage(emb, { x: 0, y: 0, width: d.pdfW, height: d.pdfH });
          }

          const pdfBytes = await pdfDoc.save();
          triggerDownload(URL.createObjectURL(new Blob([pdfBytes], { type: 'application/pdf' })), `layout-${sizeSel.value}.pdf`);
          statusEl.textContent = `ส่งออกไฟล์ PDF ขนาด ${sizeSel.value} (${totalPages} หน้า) เรียบร้อยแล้ว!`;
        });

        });

          const bodyHtml = '<div class="sheet">' + bodyIn.value + '</div>';
          const html = makeHtmlDoc(title, css, bodyHtml);
          triggerDownload(URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' })), `layout-${sizeSel.value}.html`);

        });

      /* 41. แปลงตัวเลขเป็นเงินบาทไทย */
      'baht-text': (root) => {
        root.innerHTML = `
          <div class="controls-row">
            <div class="field" style="flex:2;">
              <label for="btNum">กรอกจำนวนเงิน (ตัวเลข เช่น 1250.50)</label>
              <input type="number" id="btNum" class="input" value="1250.50" step="0.01" placeholder="ระบุจำนวนเงิน...">
            </div>
            <button type="button" class="btn btn-primary" id="btRun">แปลงเป็นคำอ่าน</button>
          </div>
          <div class="preview-box" style="text-align:left;">
            <div style="font-size:12.5px; color:var(--muted); margin-bottom:4px;">คำอ่านเงินบาทภาษาไทย (สำหรับใบเสนอราคา / ใบเสร็จ):</div>
            <div id="btThOut" style="font-size:18px; font-weight:800; color:var(--brand); margin-bottom:14px;">-</div>
            <div style="font-size:12.5px; color:var(--muted); margin-bottom:4px;">คำอ่านภาษาอังกฤษ (English Baht Text):</div>
            <div id="btEnOut" style="font-size:15px; font-weight:600; color:var(--ink); margin-bottom:14px;">-</div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button type="button" class="btn btn-secondary" id="btCopyTh">คัดลอกภาษาไทย</button>
              <button type="button" class="btn btn-secondary" id="btCopyEn">คัดลอกภาษาอังกฤษ</button>
            </div>
          </div>
        `;
        const numIn = root.querySelector('#btNum');
        const thOut = root.querySelector('#btThOut');
        const enOut = root.querySelector('#btEnOut');

        function toThaiBahtText(num) {
          if (isNaN(num) || num < 0) return 'กรุณาระบุจำนวนเงินที่ถูกต้อง';
          if (num === 0) return 'ศูนย์บาทถ้วน';
          const numTxt = ['ศูนย์', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'];
          const unitTxt = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน', 'ล้าน'];
          const [intPart, decPart] = num.toFixed(2).split('.');

          function readGroup(s) {
            let res = '';
            const len = s.length;
            for (let i = 0; i < len; i++) {
              const d = parseInt(s[i], 10);
              const pos = len - i - 1;
              if (d === 0) continue;
              if (pos === 1 && d === 1) res += 'สิบ';
              else if (pos === 1 && d === 2) res += 'ยี่สิบ';
              else if (pos === 0 && d === 1 && len > 1 && s[len - 2] !== '0') res += 'เอ็ด';
              else res += numTxt[d] + unitTxt[pos];
            }
            return res;
          }

          let bahtStr = '';
          let rem = intPart;
          let groupIdx = 0;
          while (rem.length > 0) {
            const chunk = rem.slice(-6);
            rem = rem.slice(0, -6);
            const gText = readGroup(chunk);
            if (gText) {
              bahtStr = gText + (groupIdx > 0 ? 'ล้าน'.repeat(groupIdx) : '') + bahtStr;
            }
            groupIdx++;
          }
          bahtStr = (bahtStr || 'ศูนย์') + 'บาท';
          if (decPart === '00') {
            bahtStr += 'ถ้วน';
          } else {
            bahtStr += readGroup(String(parseInt(decPart, 10))) + 'สตางค์';
          }
          return bahtStr;
        }

        function toEngBahtText(num) {
          if (isNaN(num) || num < 0) return '-';
          const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
          const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
          function convBelow1000(n) {
            if (n === 0) return '';
            if (n < 20) return ones[n];
            if (n < 100) return tens[Math.floor(n / 10)] + (n % 10 ? ' ' + ones[n % 10] : '');
            return ones[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' ' + convBelow1000(n % 100) : '');
          }
          const [intStr, decStr] = num.toFixed(2).split('.');
          let n = parseInt(intStr, 10);
          const st = parseInt(decStr, 10);
          let words = '';
          if (n === 0) words = 'Zero';
          else {
            const scales = ['', ' Thousand', ' Million', ' Billion'];
            let sc = 0;
            while (n > 0) {
              const c = n % 1000;
              if (c > 0) words = convBelow1000(c) + scales[sc] + (words ? ' ' + words : '');
              n = Math.floor(n / 1000);
              sc++;
            }
          }
          return words + ' Baht' + (st > 0 ? ' and ' + convBelow1000(st) + ' Satang' : ' Only');
        }

        function update() {
          const v = parseFloat(numIn.value);
          thOut.textContent = toThaiBahtText(v);
          enOut.textContent = toEngBahtText(v);
        }
        numIn.addEventListener('input', update);
        root.querySelector('#btRun').addEventListener('click', update);
        root.querySelector('#btCopyTh').addEventListener('click', e => {
          navigator.clipboard?.writeText(thOut.textContent);
          e.target.textContent = 'คัดลอกแล้ว!';
          setTimeout(() => { e.target.textContent = 'คัดลอกภาษาไทย'; }, 1200);
        });
        root.querySelector('#btCopyEn').addEventListener('click', e => {
          navigator.clipboard?.writeText(enOut.textContent);
          e.target.textContent = 'คัดลอกแล้ว!';
          setTimeout(() => { e.target.textContent = 'คัดลอกภาษาอังกฤษ'; }, 1200);
        });
        update();
      },

      'vat-withholding': (root) => {
        root.innerHTML = `
          <div class="controls-row">

            </div>
            <div class="field">
              <label for="vwMode">รูปแบบการคำนวณ VAT 7%</label>
              <select id="vwMode" class="select">
                <option value="ex">ราคายังไม่รวม VAT (บวก VAT 7% เพิ่ม)</option>
                <option value="inc">ราคารวม VAT 7% แล้ว (ถอด VAT ออก)</option>
                <option value="none">ไม่คิด VAT (เฉพาะหัก ณ ที่จ่าย)</option>
              </select>
            </div>
            <div class="field">
              <label for="vwWht">อัตราภาษีหัก ณ ที่จ่าย (WHT)</label>
              <select id="vwWht" class="select">
                <option value="3" selected>3% (ค่าบริการ / ฟรีแลนซ์ / จ้างทำของ)</option>
                <option value="1">1% (ค่าขนส่ง)</option>
                <option value="2">2% (ค่าโฆษณา)</option>
                <option value="5">5% (ค่าเช่า / รางวัล)</option>
                <option value="0">0% (ไม่หัก ณ ที่จ่าย)</option>
              </select>
            </div>
          </div>
          <div class="stat-grid">
            <div class="stat-card"><div class="stat-val" id="vwBase">0.00</div><div class="stat-lbl">ราคาก่อน VAT</div></div>
            <div class="stat-card"><div class="stat-val" id="vwVat">0.00</div><div class="stat-lbl">ภาษีมูลค่าเพิ่ม (VAT 7%)</div></div>
            <div class="stat-card"><div class="stat-val" id="vwWhtVal">0.00</div><div class="stat-lbl">หัก ณ ที่จ่าย</div></div>
            <div class="stat-card"><div class="stat-val" id="vwNet" style="color:var(--success);">0.00</div><div class="stat-lbl">ยอดรับ/โอนสุทธิ (บาท)</div></div>
          </div>
        `;
        const amtIn = root.querySelector('#vwAmount');
        const modeSel = root.querySelector('#vwMode');
        const whtSel = root.querySelector('#vwWht');

        function calc() {
          const amt = parseFloat(amtIn.value) || 0;
          const mode = modeSel.value;
          const whtRate = (parseFloat(whtSel.value) || 0) / 100;
          let base = amt, vat = 0;
          if (mode === 'ex') {
            base = amt;
            vat = base * 0.07;
          } else if (mode === 'inc') {
            base = amt / 1.07;
            vat = amt - base;
          }
          const wht = base * whtRate;
          const net = base + vat - wht;
          const fmt = n => n.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
          root.querySelector('#vwBase').textContent = fmt(base);
          root.querySelector('#vwVat').textContent = fmt(vat);
          root.querySelector('#vwWhtVal').textContent = fmt(wht);
          root.querySelector('#vwNet').textContent = fmt(net);
        }

        calc();
      },

        function getActivePalette() {
          if (paletteSel.value === 'custom') {
            const base = customColorIn.value || '#7966eb';
            return [base, '#3ecf8e', '#4fc3f7', '#ff8a65', '#f06292', '#ffd54f', '#9575cd', '#4db6ac'];

          renderDashboard();

        function parseCsvLine(line) {
          const out = [];
          let cur = '';
          let inQuotes = false;
          for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (ch === '"') {
              inQuotes = !inQuotes;
            } else if (ch === ',' && !inQuotes) {
              out.push(cur.trim());
              cur = '';
            } else {
              cur += ch;
            }
          }
          out.push(cur.trim());
          return out;
        }

        function parseData(rawText) {
          const trimmed = rawText.trim();
          if (!trimmed) throw new Error('กรุณาอัปโหลดไฟล์หรือวางข้อมูล CSV / JSON ก่อนวิเคราะห์');

          if (trimmed.startsWith('[') || trimmed.startsWith('{')) {
            let data = JSON.parse(trimmed);
            if (!Array.isArray(data)) data = [data];
            if (data.length === 0) throw new Error('ไม่พบรายการข้อมูลใน JSON');
            const cols = Array.from(new Set(data.flatMap(o => Object.keys(o || {}))));
            return { headers: cols, rows: data };
          }

          const lines = trimmed.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
          if (lines.length < 2) throw new Error('ข้อมูล CSV ต้องมีอย่างน้อย 1 แถวหัวตาราง และ 1 แถวข้อมูล');
          const cols = parseCsvLine(lines[0]);
          const rows = lines.slice(1).map(ln => {
            const vals = parseCsvLine(ln);
            const obj = {};
            cols.forEach((c, idx) => { obj[c] = vals[idx] !== undefined ? vals[idx] : ''; });
            return obj;
          });
          return { headers: cols, rows };
        }

        function toNum(v) {
          if (typeof v === 'number') return v;
          const cleaned = String(v || '').replace(/,/g, '').trim();
          const n = parseFloat(cleaned);
          return isNaN(n) ? null : n;
        }

        function renderDashboard() {
          if (parsedRows.length === 0) return;
          const PALETTE = getActivePalette();
          const primaryColor = PALETTE[0];
          const catCol = catSel.value;
          const valCol = valSel.value;
          const agg = aggSel.value;
          const chartType = chartSel.value;

          ['#dbKpiSum', '#dbKpiAvg', '#dbKpiMax', '#dbKpiCount'].forEach(sel => {
            root.querySelector(sel).style.color = primaryColor;
          });

          const groups = new Map();
          const allNums = [];

          parsedRows.forEach(r => {
            const key = String(r[catCol] !== undefined && r[catCol] !== '' ? r[catCol] : 'ไม่ระบุ');
            const num = toNum(r[valCol]);
            if (!groups.has(key)) groups.set(key, []);
            if (num !== null) {
              groups.get(key).push(num);
              allNums.push(num);
            } else if (agg === 'count') {
              groups.get(key).push(1);
            }
          });

          const totalSum = allNums.reduce((a, b) => a + b, 0);
          const totalAvg = allNums.length ? totalSum / allNums.length : 0;
          const totalMax = allNums.length ? Math.max(...allNums) : 0;

          const fmt = n => n.toLocaleString('th-TH', { maximumFractionDigits: 2 });
          root.querySelector('#dbKpiSum').textContent = fmt(totalSum);
          root.querySelector('#dbKpiAvg').textContent = fmt(totalAvg);
          root.querySelector('#dbKpiMax').textContent = fmt(totalMax);
          root.querySelector('#dbKpiCount').textContent = parsedRows.length.toLocaleString();

          const series = [];
          groups.forEach((vals, key) => {
            let val = 0;
            if (agg === 'count') val = vals.length;
            else if (vals.length > 0) {
              const s = vals.reduce((a, b) => a + b, 0);
              if (agg === 'sum') val = s;
              else if (agg === 'avg') val = s / vals.length;
              else if (agg === 'max') val = Math.max(...vals);
            }
            series.push({ label: key, value: val });
          });

          const sortMode = root.querySelector('#dbSort').value;
          if (sortMode === 'desc') series.sort((a, b) => b.value - a.value);
          else if (sortMode === 'asc') series.sort((a, b) => a.value - b.value);

          const limitN = parseInt(root.querySelector('#dbLimit').value, 10) || 12;
          const topSeries = series.slice(0, limitN);
          const sumSeries = topSeries.reduce((a, b) => a + Math.max(0, b.value), 0) || 1;
          const showLabels = root.querySelector('#dbShowLabels').checked;
          const isDark = root.querySelector('#dbBgMode').value === 'dark';
          const customTitle = root.querySelector('#dbChartTitle').value.trim();

          // Render table
          tbody.innerHTML = topSeries.map(item => {
            const pct = ((Math.max(0, item.value) / sumSeries) * 100).toFixed(1);
            return `<tr>
              <td style="font-weight:600;">${item.label}</td>
              <td style="text-align:right; font-weight:700; color:${primaryColor};">${fmt(item.value)}</td>
              <td style="text-align:right; color:var(--muted);">${pct}%</td>
            </tr>`;
          }).join('');

          // Draw Chart on Canvas
          const W = canvas.width;
          const H = canvas.height;
          ctx.clearRect(0, 0, W, H);
          ctx.fillStyle = isDark ? '#1e2132' : '#ffffff';
          ctx.fillRect(0, 0, W, H);

          const textMain = isDark ? '#f2f4fa' : '#222530';
          const textSub = isDark ? '#a8b0c6' : '#454b57';
          const gridLine = isDark ? '#2f344d' : '#ebeff9';

          ctx.fillStyle = textMain;
          ctx.font = '700 15px "Noto Sans Thai", sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(customTitle || `กราฟสรุป ${valCol} แยกตาม ${catCol} (${agg.toUpperCase()})`, 24, 28);

          if (topSeries.length === 0) return;
          const maxVal = Math.max(...topSeries.map(s => s.value), 1);

          if (chartType === 'bar') {
            const padL = 64, padR = 24, padT = 52, padB = 54;
            const plotW = W - padL - padR;
            const plotH = H - padT - padB;
            const barW = Math.min(54, (plotW / topSeries.length) * 0.62);
            const step = plotW / topSeries.length;

            ctx.strokeStyle = gridLine;
            ctx.lineWidth = 1;
            for (let g = 0; g <= 4; g++) {
              const gy = padT + (plotH * g) / 4;
              ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(W - padR, gy); ctx.stroke();
              ctx.fillStyle = textSub;
              ctx.font = '500 11px "Noto Sans Thai", sans-serif';
              ctx.textAlign = 'right';
              ctx.fillText(fmt(maxVal * (1 - g / 4)), padL - 8, gy + 4);
            }

            topSeries.forEach((item, i) => {
              const bh = Math.max(2, (item.value / maxVal) * plotH);
              const bx = padL + i * step + (step - barW) / 2;
              const by = padT + plotH - bh;
              ctx.fillStyle = PALETTE[i % PALETTE.length];
              ctx.beginPath();
              ctx.roundRect ? ctx.roundRect(bx, by, barW, bh, 6) : ctx.rect(bx, by, barW, bh);
              ctx.fill();

              if (showLabels) {
                ctx.fillStyle = textMain;
                ctx.font = '600 11px "Noto Sans Thai", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(fmt(item.value), bx + barW / 2, by - 6);
              }

              ctx.fillStyle = textSub;
              ctx.textAlign = 'center';
              ctx.fillText(item.label.slice(0, 10), bx + barW / 2, padT + plotH + 20);
            });
          } else if (chartType === 'line') {
            const padL = 64, padR = 32, padT = 52, padB = 54;
            const plotW = W - padL - padR;
            const plotH = H - padT - padB;
            const step = topSeries.length > 1 ? plotW / (topSeries.length - 1) : plotW / 2;

            ctx.strokeStyle = gridLine;
            for (let g = 0; g <= 4; g++) {
              const gy = padT + (plotH * g) / 4;
              ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(W - padR, gy); ctx.stroke();
            }

            ctx.strokeStyle = primaryColor;
            ctx.lineWidth = 3;
            ctx.beginPath();
            topSeries.forEach((item, i) => {
              const px = padL + (topSeries.length > 1 ? i * step : plotW / 2);
              const py = padT + plotH - (item.value / maxVal) * plotH;
              if (i === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            });
            ctx.stroke();

            topSeries.forEach((item, i) => {
              const px = padL + (topSeries.length > 1 ? i * step : plotW / 2);
              const py = padT + plotH - (item.value / maxVal) * plotH;
              ctx.fillStyle = isDark ? '#1e2132' : '#ffffff';
              ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();
              ctx.strokeStyle = primaryColor; ctx.lineWidth = 2.5; ctx.stroke();

              if (showLabels) {
                ctx.fillStyle = textMain;
                ctx.font = '600 11px "Noto Sans Thai", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(fmt(item.value), px, py - 10);
              }
              ctx.fillStyle = textSub;
              ctx.textAlign = 'center';
              ctx.fillText(item.label.slice(0, 10), px, padT + plotH + 20);
            });
          } else if (chartType === 'donut') {
            const cx = W * 0.36, cy = H * 0.54, radius = 105;
            let startAng = -Math.PI / 2;
            topSeries.forEach((item, i) => {
              const slice = (Math.max(0, item.value) / sumSeries) * Math.PI * 2;
              ctx.beginPath();
              ctx.moveTo(cx, cy);
              ctx.arc(cx, cy, radius, startAng, startAng + slice);
              ctx.closePath();
              ctx.fillStyle = PALETTE[i % PALETTE.length];
              ctx.fill();
              startAng += slice;
            });
            ctx.beginPath();
            ctx.arc(cx, cy, 55, 0, Math.PI * 2);
            ctx.fillStyle = isDark ? '#1e2132' : '#ffffff';
            ctx.fill();

            topSeries.slice(0, 8).forEach((item, i) => {
              const ly = 64 + i * 30;
              const lx = W * 0.64;
              ctx.fillStyle = PALETTE[i % PALETTE.length];
              ctx.fillRect(lx, ly - 10, 14, 14);
              ctx.fillStyle = textMain;
              ctx.font = '600 12px "Noto Sans Thai", sans-serif';
              ctx.textAlign = 'left';
              const pct = ((Math.max(0, item.value) / sumSeries) * 100).toFixed(1);
              ctx.fillText(showLabels ? `${item.label.slice(0, 14)} (${pct}%)` : item.label.slice(0, 16), lx + 22, ly + 1);
            });
          } else if (chartType === 'hbar') {
            const padL = 120, padR = 60, padT = 48, padB = 24;
            const plotW = W - padL - padR;
            const plotH = H - padT - padB;
            const items = topSeries.slice(0, 8);
            const rowH = plotH / items.length;
            const barH = Math.min(24, rowH * 0.62);

            items.forEach((item, i) => {
              const bw = Math.max(4, (item.value / maxVal) * plotW);
              const by = padT + i * rowH + (rowH - barH) / 2;
              ctx.fillStyle = PALETTE[i % PALETTE.length];
              ctx.fillRect(padL, by, bw, barH);

              ctx.fillStyle = textSub;
              ctx.font = '600 12px "Noto Sans Thai", sans-serif';
              ctx.textAlign = 'right';
              ctx.fillText(item.label.slice(0, 14), padL - 10, by + barH / 2 + 4);

              if (showLabels) {
                ctx.fillStyle = textMain;
                ctx.textAlign = 'left';
                ctx.fillText(fmt(item.value), padL + bw + 8, by + barH / 2 + 4);
              }
            });
          }
        }

            reader.onload = (evt) => {
              try {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const csv = XLSX.utils.sheet_to_csv(worksheet);
                rawIn.value = csv;
                loadAndRender(csv);

      'loan-calc': (root) => {
        root.innerHTML = `

                <option value="flat">ดอกเบี้ยคงที่ Flat Rate (รถยนต์)</option>
              </select>
            </div>
          </div>
          <div class="stat-grid">
            <div class="stat-card"><div class="stat-val" id="lnMonthly">0.00</div><div class="stat-lbl">ค่างวดต่อเดือน (บาท)</div></div>
            <div class="stat-card"><div class="stat-val" id="lnTotalInt">0.00</div><div class="stat-lbl">ดอกเบี้ยรวมตลอดสัญญา</div></div>
            <div class="stat-card"><div class="stat-val" id="lnTotalPay" style="color:var(--brand);">0.00</div><div class="stat-lbl">ยอดชำระรวมทั้งหมด</div></div>
            <div class="stat-card"><div class="stat-val" id="lnMonths">60</div><div class="stat-lbl">จำนวนงวดทั้งหมด (เดือน)</div></div>
          </div>
        `;
        const pIn = root.querySelector('#lnPrincipal');
        const rIn = root.querySelector('#lnRate');
        const yIn = root.querySelector('#lnYears');
        const tSel = root.querySelector('#lnType');

        function calcLoan() {
          const P = parseFloat(pIn.value) || 0;
          const annualRate = parseFloat(rIn.value) || 0;
          const years = Math.max(1, parseFloat(yIn.value) || 1);
          const n = Math.round(years * 12);
          let monthly = 0, totalPay = 0, totalInt = 0;

          if (tSel.value === 'flat') {
            totalInt = P * (annualRate / 100) * years;
            totalPay = P + totalInt;
            monthly = totalPay / n;
          } else {
            const r = (annualRate / 100) / 12;
            if (r === 0) {
              monthly = P / n;
            } else {
              monthly = (P * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
            }
            totalPay = monthly * n;
            totalInt = totalPay - P;
          }
          const fmt = v => v.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
          root.querySelector('#lnMonthly').textContent = fmt(monthly);
          root.querySelector('#lnTotalInt').textContent = fmt(totalInt);
          root.querySelector('#lnTotalPay').textContent = fmt(totalPay);
          root.querySelector('#lnMonths').textContent = n.toLocaleString();
        }
        [pIn, rIn, yIn, tSel].forEach(el => el.addEventListener('input', calcLoan));
        calcLoan();
      },

      'salary-tax': (root) => {
        root.innerHTML = `
          <div class="controls-row">
            <div class="field">
              <label for="slBase">เงินเดือนรับรวม (บาท/เดือน)</label>
              <input type="number" id="slBase" class="input" value="35000" min="0" step="500">
            </div>
            <div class="field">
              <label for="slSso">หักประกันสังคม (SSO 5%)</label>
              <select id="slSso" class="select">
                <option value="yes">หักประกันสังคม 5% (เพดานสูงสุด 750 บาท)</option>
                <option value="no">ไม่หักประกันสังคม</option>
              </select>
            </div>
            <div class="field">
              <label for="slPvd">หักกองทุนสำรองเลี้ยงชีพ (PVD %)</label>
              <input type="number" id="slPvd" class="input" value="3" min="0" max="15" step="1">
            </div>
          </div>
          <div class="stat-grid">
            <div class="stat-card"><div class="stat-val" id="slSsoVal">0.00</div><div class="stat-lbl">หักประกันสังคม/เดือน</div></div>
            <div class="stat-card"><div class="stat-val" id="slPvdVal">0.00</div><div class="stat-lbl">หักกองทุน PVD/เดือน</div></div>
            <div class="stat-card"><div class="stat-val" id="slTaxVal">0.00</div><div class="stat-lbl">ภาษีหัก ณ ที่จ่าย (ประมาณการ/เดือน)</div></div>
            <div class="stat-card"><div class="stat-val" id="slNetVal" style="color:var(--success);">0.00</div><div class="stat-lbl">เงินเดือนรับสุทธิ (บาท/เดือน)</div></div>
          </div>
        `;
        const baseIn = root.querySelector('#slBase');
        const ssoSel = root.querySelector('#slSso');
        const pvdIn = root.querySelector('#slPvd');

        function calcSalary() {
          const salary = parseFloat(baseIn.value) || 0;
          const sso = ssoSel.value === 'yes' ? Math.min(750, salary * 0.05) : 0;
          const pvdPct = Math.max(0, Math.min(15, parseFloat(pvdIn.value) || 0));
          const pvd = salary * (pvdPct / 100);

          const annualIncome = salary * 12;
          const expenseDed = Math.min(100000, annualIncome * 0.5);
          const personalAllow = 60000;
          const annualSso = sso * 12;
          const annualPvd = pvd * 12;
          let netTaxable = Math.max(0, annualIncome - expenseDed - personalAllow - annualSso - annualPvd);

          // Progressive Thai Personal Income Tax brackets
          let annualTax = 0;
          const brackets = [
            { limit: 150000, rate: 0 },
            { limit: 300000, rate: 0.05 },
            { limit: 500000, rate: 0.10 },
            { limit: 750000, rate: 0.15 },
            { limit: 1000000, rate: 0.20 },
            { limit: 2000000, rate: 0.25 },
            { limit: 5000000, rate: 0.30 },
            { limit: Infinity, rate: 0.35 }
          ];
          let prev = 0;
          for (const b of brackets) {
            if (netTaxable > prev) {
              const taxableInBracket = Math.min(netTaxable, b.limit) - prev;
              annualTax += taxableInBracket * b.rate;
              prev = b.limit;
            } else break;
          }

          const monthlyTax = annualTax / 12;
          const netMonthly = Math.max(0, salary - sso - pvd - monthlyTax);
          const fmt = v => v.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

          root.querySelector('#slSsoVal').textContent = fmt(sso);
          root.querySelector('#slPvdVal').textContent = fmt(pvd);
          root.querySelector('#slTaxVal').textContent = fmt(monthlyTax);
          root.querySelector('#slNetVal').textContent = fmt(netMonthly);
        }
        [baseIn, ssoSel, pvdIn].forEach(el => el.addEventListener('input', calcSalary));
        calcSalary();
      },

            y: canvas.height / 2
          });
          activeElementIdx = elements.length - 1;
          renderDesign();
        });

        function getMousePos(e) {
          const rect = canvas.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height)
          };
        }

        function findElementAt(pos) {
          for (let i = elements.length - 1; i >= 0; i--) {
            const el = elements[i];
            const dist = Math.sqrt(Math.pow(el.x - pos.x, 2) + Math.pow(el.y - pos.y, 2));
            if (dist < 80) return i;
          }
          return -1;
        }

        canvas.addEventListener('mousedown', (e) => {
          const pos = getMousePos(e);
          const idx = findElementAt(pos);
          if (idx !== -1) {
            activeElementIdx = idx;
            isDragging = true;
            dragOffset.x = pos.x - elements[idx].x;
            dragOffset.y = pos.y - elements[idx].y;
            renderDesign();
          } else {
            activeElementIdx = -1;
            renderDesign();
          }
        });

        canvas.addEventListener('mousemove', (e) => {
          if (!isDragging || activeElementIdx === -1) return;
          const pos = getMousePos(e);
          elements[activeElementIdx].x = pos.x - dragOffset.x;
          elements[activeElementIdx].y = pos.y - dragOffset.y;
          renderDesign();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        canvas.addEventListener('dblclick', (e) => {
          const pos = getMousePos(e);
          const idx = findElementAt(pos);
          if (idx !== -1) {
            elements.splice(idx, 1);
            activeElementIdx = -1;
            renderDesign();
          }
        });

        dlBtn.addEventListener('click', () => {
          const prevActive = activeElementIdx;
          activeElementIdx = -1;
          renderDesign();
          triggerDownload(canvas.toDataURL('image/png'), 'designed-card.png');
          activeElementIdx = prevActive;
          renderDesign();
        });

        setCanvasDims();
      },

            <div id="pcReportText" style="font-size:14px; line-height:1.8; background:#fff; border:1px solid var(--border); border-radius:12px; padding:16px; white-space:pre-wrap; max-height:240px; overflow-y:auto;"></div>
          </div>

        const origIn = root.querySelector('#pcOrig');
        const newIn = root.querySelector('#pcNew');
        const checkBtn = root.querySelector('#pcBtn');
        const statusEl = root.querySelector('#pcStatus');
        const wrapEl = root.querySelector('#pcResultWrap');
        const indexVal = root.querySelector('#pcIndex');
        const totalVal = root.querySelector('#pcTotalWords');
        const dupeVal = root.querySelector('#pcDupeWords');
        const reportText = root.querySelector('#pcReportText');

        const segmenter = (typeof Intl !== 'undefined' && Intl.Segmenter)
          ? new Intl.Segmenter('th', { granularity: 'word' })
          : null;

        function tokenize(text) {
          if (segmenter) {
            const out = [];
            for (const seg of segmenter.segment(text.toLowerCase())) {
              if (seg.isWordLike && seg.segment.trim()) out.push(seg.segment.trim());
            }
            if (out.length > 0) return out;
          }
          return text.toLowerCase()
            .split(/[\s,.;!?()\-+*/\r\n\t]+/)
            .map(s => s.trim())
            .filter(Boolean);
        }

        checkBtn.addEventListener('click', () => {
          const origText = origIn.value.trim();
          const newText = newIn.value.trim();
          statusEl.textContent = '';
          wrapEl.style.display = 'none';

          if (!origText || !newText) {
            statusEl.textContent = 'กรุณากรอกข้อความให้ครบทั้งสองช่องเพื่อตรวจสอบ';
            return;
          }

          const origTokens = tokenize(origText);
          const newTokens = tokenize(newText);

          if (newTokens.length === 0) {
            statusEl.textContent = 'ไม่พบคำที่สามารถวิเคราะห์ได้ในช่องเปรียบเทียบ';
            return;
          }

          const origSet = new Set(origTokens);
          let matchCount = 0;
          newTokens.forEach(token => {
            if (origSet.has(token)) matchCount++;
          });

          const origLines = origText.split(/[\r\n.?!]+/).map(s => s.trim()).filter(s => s.length > 6);
          let highlightedHTML = newText
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');

          origLines.forEach(line => {
            const safeLine = line
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;');
            if (safeLine && highlightedHTML.includes(safeLine)) {
              highlightedHTML = highlightedHTML
                .split(safeLine)
                .join('<mark style="background-color:#ffe3b3; color:#1a1d21; border-radius:4px; padding:2px 4px;">' + safeLine + '</mark>');
            }
          });

          const pct = Math.round((matchCount / newTokens.length) * 100);
          indexVal.textContent = pct + '%';
          indexVal.style.color = pct > 40 ? 'var(--danger)' : 'var(--success)';
          totalVal.textContent = newTokens.length.toLocaleString();
          dupeVal.textContent = matchCount.toLocaleString();
          reportText.innerHTML = highlightedHTML;

          wrapEl.style.display = 'block';
        });
      },

        function populateCustomTemplates() {
          const existingGroups = templateSel.querySelectorAll('.custom-group');

          const options = Array.from(templateSel.querySelectorAll('option'));
          options.forEach(opt => {

          });
          
          if (savedTemplates.length > 0) {

            grp.label = '📁 เทมเพลตส่วนตัวของคุณ';
            grp.className = 'custom-group';

        function renderPoster() {
          const thMode = themeSel.value;
          customColors.style.display = thMode === 'custom' ? 'flex' : 'none';

          let bg = bgColorIn.value;
          let txtColor = textColorIn.value;
          let accentColor = '#7966eb';

          if (thMode !== 'custom') {
            const th = THEMES[thMode];
            bg = th.bg;
            txtColor = th.subText;
            accentColor = th.text;
          }

          ctx.fillStyle = bg;
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          elements.forEach((el, idx) => {
            ctx.save();
            if (el.type === 'text' || el.isHeadline) {
              ctx.font = `700 ${el.size}px "Noto Sans Thai", sans-serif`;
              ctx.fillStyle = el.isHeadline ? accentColor : txtColor;
              ctx.textBaseline = 'middle';
              ctx.textAlign = 'center';
              ctx.fillText(el.val, el.x, el.y);
            } else if (el.type === 'image' && el.img) {
              const maxW = 200;
              const r = maxW / el.img.width;
              const w = el.img.width * r;
              const h = el.img.height * r;
              ctx.drawImage(el.img, el.x - w / 2, el.y - h / 2, w, h);
            }

            if (idx === activeElementIdx) {
              ctx.strokeStyle = accentColor;
              ctx.lineWidth = 2;
              ctx.setLineDash([4, 4]);
              ctx.strokeRect(el.x - 130, el.y - 30, 260, 60);
            }
            ctx.restore();
          });
        }

        sizeSel.addEventListener('change', setCanvasDims);
        themeSel.addEventListener('change', renderPoster);
        [bgColorIn, textColorIn].forEach(el => el.addEventListener('input', renderPoster));

        addTextBtn.addEventListener('click', () => {
          const val = addTextVal.value.trim();
          if (!val) return;
          elements.push({
            type: 'text',
            val: val,
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: parseInt(addTextSize.value, 10)
          });

        applyBtn.addEventListener('click', () => {

          elements.push({
            type: 'image',
            img: img,
            x: canvas.width / 2,
            y: canvas.height / 2
          });
          activeElementIdx = elements.length - 1;
          renderPoster();
        });

        function getMousePos(e) {
          const rect = canvas.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height)
          };
        }

        function findElementAt(pos) {
          for (let i = elements.length - 1; i >= 0; i--) {
            const el = elements[i];
            const dist = Math.sqrt(Math.pow(el.x - pos.x, 2) + Math.pow(el.y - pos.y, 2));
            if (dist < 80) return i;
          }
          return -1;
        }

        canvas.addEventListener('mousedown', (e) => {
          const pos = getMousePos(e);
          const idx = findElementAt(pos);
          if (idx !== -1) {
            activeElementIdx = idx;
            isDragging = true;
            dragOffset.x = pos.x - elements[idx].x;
            dragOffset.y = pos.y - elements[idx].y;
            renderPoster();
          } else {
            activeElementIdx = -1;
            renderPoster();
          }
        });

        canvas.addEventListener('mousemove', (e) => {
          if (!isDragging || activeElementIdx === -1) return;
          const pos = getMousePos(e);
          elements[activeElementIdx].x = pos.x - dragOffset.x;
          elements[activeElementIdx].y = pos.y - dragOffset.y;
          renderPoster();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        canvas.addEventListener('dblclick', (e) => {
          const pos = getMousePos(e);
          const idx = findElementAt(pos);
          if (idx !== -1) {
            elements.splice(idx, 1);
            activeElementIdx = -1;
            renderPoster();
          }
        });

        dlPosterBtn.addEventListener('click', () => {
          const prevActive = activeElementIdx;
          activeElementIdx = -1;
          renderPoster();
          triggerDownload(canvas.toDataURL('image/png'), 'pr-poster.png');
          activeElementIdx = prevActive;
          renderPoster();
        });

        generatePRText();
        setCanvasDims();
      },

      /* 55. สร้างวิดีโอจากรูป & คลิป */
