        const numIn = root.querySelector('#btNum');
        const thOut = root.querySelector('#btThOut');
        const enOut = root.querySelector('#btEnOut');

        function toThaiBahtText(num) {
          if (isNaN(num) || num < 0) return 'กรุณาระบุจำนวนเงินที่ถูกต้อง';
          if (num === 0) return 'ศูนย์บาทถ้วน';
          const numTxt = ['ศูนย์', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'];
          const unitTxt = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน', 'ล้าน'];
          const [intPart, decPart] = num.toFixed(2).split('.');

          function readGroup(s) {
            let res = '';
            const len = s.length;
            for (let i = 0; i < len; i++) {
              const d = parseInt(s[i], 10);
              const pos = len - i - 1;
              if (d === 0) continue;
              if (pos === 1 && d === 1) res += 'สิบ';
              else if (pos === 1 && d === 2) res += 'ยี่สิบ';
              else if (pos === 0 && d === 1 && len > 1 && s[len - 2] !== '0') res += 'เอ็ด';
              else res += numTxt[d] + unitTxt[pos];
            }
            return res;
          }

          let bahtStr = '';
          let rem = intPart;
          let groupIdx = 0;
          while (rem.length > 0) {
            const chunk = rem.slice(-6);
            rem = rem.slice(0, -6);
            const gText = readGroup(chunk);
            if (gText) {
              bahtStr = gText + (groupIdx > 0 ? 'ล้าน'.repeat(groupIdx) : '') + bahtStr;
            }
            groupIdx++;
          }
          bahtStr = (bahtStr || 'ศูนย์') + 'บาท';
          if (decPart === '00') {
            bahtStr += 'ถ้วน';
          } else {
            bahtStr += readGroup(String(parseInt(decPart, 10))) + 'สตางค์';
          }
          return bahtStr;
        }

        function toEngBahtText(num) {
          if (isNaN(num) || num < 0) return '-';
          const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
          const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
          function convBelow1000(n) {
            if (n === 0) return '';
            if (n < 20) return ones[n];
            if (n < 100) return tens[Math.floor(n / 10)] + (n % 10 ? ' ' + ones[n % 10] : '');
            return ones[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' ' + convBelow1000(n % 100) : '');
          }
          const [intStr, decStr] = num.toFixed(2).split('.');
          let n = parseInt(intStr, 10);
          const st = parseInt(decStr, 10);
          let words = '';
          if (n === 0) words = 'Zero';
          else {
            const scales = ['', ' Thousand', ' Million', ' Billion'];
            let sc = 0;
            while (n > 0) {
              const c = n % 1000;
              if (c > 0) words = convBelow1000(c) + scales[sc] + (words ? ' ' + words : '');
              n = Math.floor(n / 1000);
              sc++;
            }
          }
          return words + ' Baht' + (st > 0 ? ' and ' + convBelow1000(st) + ' Satang' : ' Only');
        }

        function update() {
          const v = parseFloat(numIn.value);
          thOut.textContent = toThaiBahtText(v);
          enOut.textContent = toEngBahtText(v);
        }
        numIn.addEventListener('input', update);
        root.querySelector('#btRun').addEventListener('click', update);
        root.querySelector('#btCopyTh').addEventListener('click', e => {
          navigator.clipboard?.writeText(thOut.textContent);
          e.target.textContent = 'คัดลอกแล้ว!';
          setTimeout(() => { e.target.textContent = 'คัดลอกภาษาไทย'; }, 1200);
        });
        root.querySelector('#btCopyEn').addEventListener('click', e => {
          navigator.clipboard?.writeText(enOut.textContent);
          e.target.textContent = 'คัดลอกแล้ว!';
          setTimeout(() => { e.target.textContent = 'คัดลอกภาษาอังกฤษ'; }, 1200);
        });
        update();
      },

      'vat-withholding': (root) => {
        root.innerHTML = `
          <div class="controls-row">

            </div>
            <div class="field">
              <label for="vwMode">รูปแบบการคำนวณ VAT 7%</label>
              <select id="vwMode" class="select">
                <option value="ex">ราคายังไม่รวม VAT (บวก VAT 7% เพิ่ม)</option>
                <option value="inc">ราคารวม VAT 7% แล้ว (ถอด VAT ออก)</option>
                <option value="none">ไม่คิด VAT (เฉพาะหัก ณ ที่จ่าย)</option>
              </select>
            </div>
            <div class="field">
              <label for="vwWht">อัตราภาษีหัก ณ ที่จ่าย (WHT)</label>
              <select id="vwWht" class="select">
                <option value="3" selected>3% (ค่าบริการ / ฟรีแลนซ์ / จ้างทำของ)</option>
                <option value="1">1% (ค่าขนส่ง)</option>
                <option value="2">2% (ค่าโฆษณา)</option>
                <option value="5">5% (ค่าเช่า / รางวัล)</option>
                <option value="0">0% (ไม่หัก ณ ที่จ่าย)</option>
              </select>
            </div>
          </div>
          <div class="stat-grid">
            <div class="stat-card"><div class="stat-val" id="vwBase">0.00</div><div class="stat-lbl">ราคาก่อน VAT</div></div>
            <div class="stat-card"><div class="stat-val" id="vwVat">0.00</div><div class="stat-lbl">ภาษีมูลค่าเพิ่ม (VAT 7%)</div></div>
            <div class="stat-card"><div class="stat-val" id="vwWhtVal">0.00</div><div class="stat-lbl">หัก ณ ที่จ่าย</div></div>
            <div class="stat-card"><div class="stat-val" id="vwNet" style="color:var(--success);">0.00</div><div class="stat-lbl">ยอดรับ/โอนสุทธิ (บาท)</div></div>
          </div>
        `;
        const amtIn = root.querySelector('#vwAmount');
        const modeSel = root.querySelector('#vwMode');
        const whtSel = root.querySelector('#vwWht');

        function calc() {
          const amt = parseFloat(amtIn.value) || 0;
          const mode = modeSel.value;
          const whtRate = (parseFloat(whtSel.value) || 0) / 100;
          let base = amt, vat = 0;
          if (mode === 'ex') {
            base = amt;
            vat = base * 0.07;
          } else if (mode === 'inc') {
            base = amt / 1.07;
            vat = amt - base;
          }
          const wht = base * whtRate;
          const net = base + vat - wht;
          const fmt = n => n.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
          root.querySelector('#vwBase').textContent = fmt(base);
          root.querySelector('#vwVat').textContent = fmt(vat);
          root.querySelector('#vwWhtVal').textContent = fmt(wht);
          root.querySelector('#vwNet').textContent = fmt(net);
        }
        [amtIn, modeSel, whtSel].forEach(el => el.addEventListener('input', calc));
        calc();
      },

      'pomodoro-timer': (root) => {
        root.innerHTML = `
          <div class="pill-group" id="pmModes">
            <button type="button" class="pill-btn active" data-min="25">🍅 โฟกัสงาน (25 นาที)</button>
            <button type="button" class="pill-btn" data-min="5">☕ พักสั้น (5 นาที)</button>

          </div>
          <div class="preview-box" style="margin-top:0; margin-bottom:18px;">
            <div id="pmClock" style="font-size:48px; font-weight:800; color:var(--brand); letter-spacing:0.04em;">25:00</div>
            <div style="display:flex; justify-content:center; gap:10px; margin-top:12px;">
              <button type="button" class="btn btn-primary" id="pmStart">▶ เริ่มจับเวลา</button>
              <button type="button" class="btn btn-secondary" id="pmReset">↺ รีเซ็ต</button>
            </div>
          </div>
          <div style="font-weight:700; font-size:14px; margin-bottom:8px;">รายการงานที่ต้องทำวันนี้ (Quick Checklist):</div>
          <div class="controls-row">
            <div class="field"><input type="text" id="pmTaskIn" class="input" placeholder="พิมพ์งานที่ต้องทำแล้วกด + เพิ่มงาน..."></div>
            <button type="button" class="btn btn-secondary" id="pmAddTask">+ เพิ่มงาน</button>
          </div>
          <div class="file-list" id="pmTaskList"></div>
        `;
        let totalSec = 25 * 60;
        let remainSec = totalSec;
        let timerId = null;
        const clockEl = root.querySelector('#pmClock');
        const startBtn = root.querySelector('#pmStart');
        const taskIn = root.querySelector('#pmTaskIn');
        const taskListEl = root.querySelector('#pmTaskList');
        const tasks = [];

        function fmtClock(s) {
          const m = String(Math.floor(s / 60)).padStart(2, '0');
          const sec = String(s % 60).padStart(2, '0');
          return `${m}:${sec}`;
        }

        function stopTimer() {
          if (timerId) { clearInterval(timerId); timerId = null; }
          startBtn.textContent = '▶ เริ่มจับเวลา';
        }

        root.querySelectorAll('#pmModes .pill-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            root.querySelectorAll('#pmModes .pill-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            stopTimer();
            totalSec = parseInt(btn.dataset.min, 10) * 60;
            remainSec = totalSec;
            clockEl.textContent = fmtClock(remainSec);
          });
        });

        startBtn.addEventListener('click', () => {
          if (timerId) {
            stopTimer();
          } else {
            startBtn.textContent = '⏸ หยุดชั่วคราว';
            timerId = setInterval(() => {
              if (remainSec > 0) {
                remainSec--;
                clockEl.textContent = fmtClock(remainSec);
              } else {
                stopTimer();
              }
            }, 1000);
          }
        });

        root.querySelector('#pmReset').addEventListener('click', () => {
          stopTimer();
          remainSec = totalSec;
          clockEl.textContent = fmtClock(remainSec);
        });

        function renderTasks() {
          taskListEl.innerHTML = '';
          tasks.forEach((t, i) => {
            const row = document.createElement('div');
            row.className = 'file-item';
            row.innerHTML = `
              <label style="display:flex; align-items:center; gap:8px; cursor:pointer; flex:1; text-decoration:${t.done ? 'line-through' : 'none'}; opacity:${t.done ? '0.6' : '1'};">
                <input type="checkbox" ${t.done ? 'checked' : ''}>
                <span>${t.text}</span>
              </label>
              <button type="button" class="icon-btn">ลบ</button>
            `;
            row.querySelector('input').addEventListener('change', e => {
              t.done = e.target.checked;
              renderTasks();
            });
            row.querySelector('button').addEventListener('click', () => {
              tasks.splice(i, 1);
              renderTasks();
            });
            taskListEl.appendChild(row);
          });
        }

        root.querySelector('#pmAddTask').addEventListener('click', () => {
          const val = taskIn.value.trim();
          if (!val) return;
          tasks.push({ text: val, done: false });
          taskIn.value = '';
          renderTasks();
        });
      },

                <input type="text" id="dbPdfFooter" class="input" value="จัดทำโดย Utility Analytics • APW.Gasie 2026" placeholder="ระบุชื่อผู้จัดทำหรือหมายเหตุท้ายรายงาน...">
              </div>
              <div class="field" style="flex:2; justify-content:center;">
                <label style="font-size:12px; margin-bottom:4px;">ส่วนประกอบในไฟล์ PDF:</label>
                <div style="display:flex; gap:12px; flex-wrap:wrap; font-size:12.5px;">
                  <label style="cursor:pointer;"><input type="checkbox" id="dbPdfIncKpi" checked> สรุป KPI</label>
                  <label style="cursor:pointer;"><input type="checkbox" id="dbPdfIncChart" checked> ภาพกราฟ</label>
                  <label style="cursor:pointer;"><input type="checkbox" id="dbPdfIncTable" checked> ตารางข้อมูล</label>
                </div>
              </div>
            </div>

            <div class="stat-grid" style="margin-top:14px;">
              <div class="stat-card"><div class="stat-val" id="dbKpiSum">0</div><div class="stat-lbl">ผลรวมทั้งหมด (Total)</div></div>
              <div class="stat-card"><div class="stat-val" id="dbKpiAvg">0</div><div class="stat-lbl">ค่าเฉลี่ย (Average)</div></div>
              <div class="stat-card"><div class="stat-val" id="dbKpiMax">0</div><div class="stat-lbl">ค่าสูงสุด (Max)</div></div>
              <div class="stat-card"><div class="stat-val" id="dbKpiCount">0</div><div class="stat-lbl">จำนวนรายการ (Rows)</div></div>
            </div>

            <div class="preview-box" style="background:#ffffff; margin-top:16px;">
              <canvas id="dbCanvas" width="680" height="340"></canvas>
            </div>

            <div style="margin-top:16px; overflow-x:auto; border:1px solid var(--border); border-radius:12px; background:#fff;">
              <table id="jcTable" style="width:100%; border-collapse:collapse; font-size:13px; text-align:left;">
                <thead>
                  <tr>
                    <th>หมวดหมู่</th>
                    <th style="text-align:right;">ค่าที่คำนวณได้</th>
                    <th style="text-align:right;">สัดส่วน (%)</th>
                  </tr>
                </thead>
                <tbody id="dbTableBody"></tbody>
              </table>
            </div>
          </div>
        `;

        let parsedRows = [];
        let headers = [];
        const fileIn = root.querySelector('#dbFile');
        const rawIn = root.querySelector('#dbRawInput');
        const analyzeBtn = root.querySelector('#dbAnalyzeBtn');
        const dlImgBtn = root.querySelector('#dbDlImgBtn');
        const errEl = root.querySelector('#dbError');
        const wrap = root.querySelector('#dbDashboardWrap');
        const catSel = root.querySelector('#dbCatCol');
        const valSel = root.querySelector('#dbValCol');
        const aggSel = root.querySelector('#dbAgg');
        const chartSel = root.querySelector('#dbChartType');
        const paletteSel = root.querySelector('#dbPalette');
        const customColorWrap = root.querySelector('#dbCustomColorWrap');
        const customColorIn = root.querySelector('#dbCustomColor');
        const canvas = root.querySelector('#dbCanvas');
        const ctx = canvas.getContext('2d');
        const tbody = root.querySelector('#dbTableBody');

        const PALETTES = {
          pastel: ['#7966eb', '#3ecf8e', '#ff8a65', '#4fc3f7', '#f06292', '#ffd54f', '#9575cd', '#4db6ac'],
          ocean: ['#2563eb', '#0ea5e9', '#38bdf8', '#6366f1', '#1d4ed8', '#0284c7', '#818cf8', '#60a5fa'],
          emerald: ['#10b981', '#14b8a6', '#34d399', '#059669', '#2dd4bf', '#6ee7b7', '#0d9488', '#a7f3d0'],
          sunset: ['#f97316', '#f43f5e', '#eab308', '#ec4899', '#fb923c', '#fb7185', '#facc15', '#f472b6']
        };

        function getActivePalette() {
          if (paletteSel.value === 'custom') {
            const base = customColorIn.value || '#7966eb';
            return [base, '#3ecf8e', '#4fc3f7', '#ff8a65', '#f06292', '#ffd54f', '#9575cd', '#4db6ac'];
          }
          return PALETTES[paletteSel.value] || PALETTES.pastel;
        }

        paletteSel.addEventListener('change', () => {
          customColorWrap.style.display = paletteSel.value === 'custom' ? 'flex' : 'none';
          renderDashboard();
        });
        customColorIn.addEventListener('input', renderDashboard);

        function parseCsvLine(line) {
          const out = [];
          let cur = '';
          let inQuotes = false;
          for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (ch === '"') {
              inQuotes = !inQuotes;
            } else if (ch === ',' && !inQuotes) {
              out.push(cur.trim());
              cur = '';
            } else {
              cur += ch;
            }
          }
          out.push(cur.trim());
          return out;
        }

        function parseData(rawText) {
          const trimmed = rawText.trim();
          if (!trimmed) throw new Error('กรุณาอัปโหลดไฟล์หรือวางข้อมูล CSV / JSON ก่อนวิเคราะห์');

          if (trimmed.startsWith('[') || trimmed.startsWith('{')) {
            let data = JSON.parse(trimmed);
            if (!Array.isArray(data)) data = [data];
            if (data.length === 0) throw new Error('ไม่พบรายการข้อมูลใน JSON');
            const cols = Array.from(new Set(data.flatMap(o => Object.keys(o || {}))));
            return { headers: cols, rows: data };
          }

          const lines = trimmed.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
          if (lines.length < 2) throw new Error('ข้อมูล CSV ต้องมีอย่างน้อย 1 แถวหัวตาราง และ 1 แถวข้อมูล');
          const cols = parseCsvLine(lines[0]);
          const rows = lines.slice(1).map(ln => {
            const vals = parseCsvLine(ln);
            const obj = {};
            cols.forEach((c, idx) => { obj[c] = vals[idx] !== undefined ? vals[idx] : ''; });
            return obj;
          });
          return { headers: cols, rows };
        }

        function toNum(v) {
          if (typeof v === 'number') return v;
          const cleaned = String(v || '').replace(/,/g, '').trim();
          const n = parseFloat(cleaned);
          return isNaN(n) ? null : n;
        }

        function renderDashboard() {
          if (parsedRows.length === 0) return;
          const PALETTE = getActivePalette();
          const primaryColor = PALETTE[0];
          const catCol = catSel.value;
          const valCol = valSel.value;
          const agg = aggSel.value;
          const chartType = chartSel.value;

          ['#dbKpiSum', '#dbKpiAvg', '#dbKpiMax', '#dbKpiCount'].forEach(sel => {
            root.querySelector(sel).style.color = primaryColor;
          });

          const groups = new Map();
          const allNums = [];

          parsedRows.forEach(r => {
            const key = String(r[catCol] !== undefined && r[catCol] !== '' ? r[catCol] : 'ไม่ระบุ');
            const num = toNum(r[valCol]);
            if (!groups.has(key)) groups.set(key, []);
            if (num !== null) {
              groups.get(key).push(num);
              allNums.push(num);
            } else if (agg === 'count') {
              groups.get(key).push(1);
            }
          });

          const totalSum = allNums.reduce((a, b) => a + b, 0);
          const totalAvg = allNums.length ? totalSum / allNums.length : 0;
          const totalMax = allNums.length ? Math.max(...allNums) : 0;

          const fmt = n => n.toLocaleString('th-TH', { maximumFractionDigits: 2 });
          root.querySelector('#dbKpiSum').textContent = fmt(totalSum);
          root.querySelector('#dbKpiAvg').textContent = fmt(totalAvg);
          root.querySelector('#dbKpiMax').textContent = fmt(totalMax);
          root.querySelector('#dbKpiCount').textContent = parsedRows.length.toLocaleString();

          const series = [];
          groups.forEach((vals, key) => {
            let val = 0;
            if (agg === 'count') val = vals.length;
            else if (vals.length > 0) {
              const s = vals.reduce((a, b) => a + b, 0);
              if (agg === 'sum') val = s;
              else if (agg === 'avg') val = s / vals.length;
              else if (agg === 'max') val = Math.max(...vals);
            }
            series.push({ label: key, value: val });
          });

          const sortMode = root.querySelector('#dbSort').value;
          if (sortMode === 'desc') series.sort((a, b) => b.value - a.value);
          else if (sortMode === 'asc') series.sort((a, b) => a.value - b.value);

          const limitN = parseInt(root.querySelector('#dbLimit').value, 10) || 12;
          const topSeries = series.slice(0, limitN);
          const sumSeries = topSeries.reduce((a, b) => a + Math.max(0, b.value), 0) || 1;
          const showLabels = root.querySelector('#dbShowLabels').checked;
          const isDark = root.querySelector('#dbBgMode').value === 'dark';
          const customTitle = root.querySelector('#dbChartTitle').value.trim();

          // Render table
          tbody.innerHTML = topSeries.map(item => {
            const pct = ((Math.max(0, item.value) / sumSeries) * 100).toFixed(1);
            return `<tr>
              <td style="font-weight:600;">${item.label}</td>
              <td style="text-align:right; font-weight:700; color:${primaryColor};">${fmt(item.value)}</td>
              <td style="text-align:right; color:var(--muted);">${pct}%</td>
            </tr>`;
          }).join('');

          // Draw Chart on Canvas
          const W = canvas.width;
          const H = canvas.height;
          ctx.clearRect(0, 0, W, H);
          ctx.fillStyle = isDark ? '#1e2132' : '#ffffff';
          ctx.fillRect(0, 0, W, H);

          const textMain = isDark ? '#f2f4fa' : '#222530';
          const textSub = isDark ? '#a8b0c6' : '#454b57';
          const gridLine = isDark ? '#2f344d' : '#ebeff9';

          ctx.fillStyle = textMain;
          ctx.font = '700 15px "Noto Sans Thai", sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(customTitle || `กราฟสรุป ${valCol} แยกตาม ${catCol} (${agg.toUpperCase()})`, 24, 28);

          if (topSeries.length === 0) return;
          const maxVal = Math.max(...topSeries.map(s => s.value), 1);

          if (chartType === 'bar') {
            const padL = 64, padR = 24, padT = 52, padB = 54;
            const plotW = W - padL - padR;
            const plotH = H - padT - padB;
            const barW = Math.min(54, (plotW / topSeries.length) * 0.62);
            const step = plotW / topSeries.length;

            ctx.strokeStyle = gridLine;
            ctx.lineWidth = 1;
            for (let g = 0; g <= 4; g++) {
              const gy = padT + (plotH * g) / 4;
              ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(W - padR, gy); ctx.stroke();
              ctx.fillStyle = textSub;
              ctx.font = '500 11px "Noto Sans Thai", sans-serif';
              ctx.textAlign = 'right';
              ctx.fillText(fmt(maxVal * (1 - g / 4)), padL - 8, gy + 4);
            }

            topSeries.forEach((item, i) => {
              const bh = Math.max(2, (item.value / maxVal) * plotH);
              const bx = padL + i * step + (step - barW) / 2;
              const by = padT + plotH - bh;
              ctx.fillStyle = PALETTE[i % PALETTE.length];
              ctx.beginPath();
              ctx.roundRect ? ctx.roundRect(bx, by, barW, bh, 6) : ctx.rect(bx, by, barW, bh);
              ctx.fill();

              if (showLabels) {
                ctx.fillStyle = textMain;
                ctx.font = '600 11px "Noto Sans Thai", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(fmt(item.value), bx + barW / 2, by - 6);
              }

              ctx.fillStyle = textSub;
              ctx.textAlign = 'center';
              ctx.fillText(item.label.slice(0, 10), bx + barW / 2, padT + plotH + 20);
            });
          } else if (chartType === 'line') {
            const padL = 64, padR = 32, padT = 52, padB = 54;
            const plotW = W - padL - padR;
            const plotH = H - padT - padB;
            const step = topSeries.length > 1 ? plotW / (topSeries.length - 1) : plotW / 2;

            ctx.strokeStyle = gridLine;
            for (let g = 0; g <= 4; g++) {
              const gy = padT + (plotH * g) / 4;
              ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(W - padR, gy); ctx.stroke();
            }

            ctx.strokeStyle = primaryColor;
            ctx.lineWidth = 3;
            ctx.beginPath();
            topSeries.forEach((item, i) => {
              const px = padL + (topSeries.length > 1 ? i * step : plotW / 2);
              const py = padT + plotH - (item.value / maxVal) * plotH;
              if (i === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            });
            ctx.stroke();

            topSeries.forEach((item, i) => {
              const px = padL + (topSeries.length > 1 ? i * step : plotW / 2);
              const py = padT + plotH - (item.value / maxVal) * plotH;
              ctx.fillStyle = isDark ? '#1e2132' : '#ffffff';
              ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();
              ctx.strokeStyle = primaryColor; ctx.lineWidth = 2.5; ctx.stroke();

              if (showLabels) {
                ctx.fillStyle = textMain;
                ctx.font = '600 11px "Noto Sans Thai", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(fmt(item.value), px, py - 10);
              }
              ctx.fillStyle = textSub;
              ctx.textAlign = 'center';
              ctx.fillText(item.label.slice(0, 10), px, padT + plotH + 20);
            });
          } else if (chartType === 'donut') {
            const cx = W * 0.36, cy = H * 0.54, radius = 105;
            let startAng = -Math.PI / 2;
            topSeries.forEach((item, i) => {
              const slice = (Math.max(0, item.value) / sumSeries) * Math.PI * 2;
              ctx.beginPath();
              ctx.moveTo(cx, cy);
              ctx.arc(cx, cy, radius, startAng, startAng + slice);
              ctx.closePath();
              ctx.fillStyle = PALETTE[i % PALETTE.length];
              ctx.fill();
              startAng += slice;
            });
            ctx.beginPath();
            ctx.arc(cx, cy, 55, 0, Math.PI * 2);
            ctx.fillStyle = isDark ? '#1e2132' : '#ffffff';
            ctx.fill();

            topSeries.slice(0, 8).forEach((item, i) => {
              const ly = 64 + i * 30;
              const lx = W * 0.64;
              ctx.fillStyle = PALETTE[i % PALETTE.length];
              ctx.fillRect(lx, ly - 10, 14, 14);
              ctx.fillStyle = textMain;
              ctx.font = '600 12px "Noto Sans Thai", sans-serif';
              ctx.textAlign = 'left';
              const pct = ((Math.max(0, item.value) / sumSeries) * 100).toFixed(1);
              ctx.fillText(showLabels ? `${item.label.slice(0, 14)} (${pct}%)` : item.label.slice(0, 16), lx + 22, ly + 1);
            });
          } else if (chartType === 'hbar') {
            const padL = 120, padR = 60, padT = 48, padB = 24;
            const plotW = W - padL - padR;
            const plotH = H - padT - padB;
            const items = topSeries.slice(0, 8);
            const rowH = plotH / items.length;
            const barH = Math.min(24, rowH * 0.62);

            items.forEach((item, i) => {
              const bw = Math.max(4, (item.value / maxVal) * plotW);
              const by = padT + i * rowH + (rowH - barH) / 2;
              ctx.fillStyle = PALETTE[i % PALETTE.length];
              ctx.fillRect(padL, by, bw, barH);

              ctx.fillStyle = textSub;
              ctx.font = '600 12px "Noto Sans Thai", sans-serif';
              ctx.textAlign = 'right';
              ctx.fillText(item.label.slice(0, 14), padL - 10, by + barH / 2 + 4);

              if (showLabels) {
                ctx.fillStyle = textMain;
                ctx.textAlign = 'left';
                ctx.fillText(fmt(item.value), padL + bw + 8, by + barH / 2 + 4);
              }
            });
          }
        }

        function loadAndRender(rawText) {
          errEl.textContent = '';
          try {
            const res = parseData(rawText);
            headers = res.headers;
            parsedRows = res.rows;

            catSel.innerHTML = headers.map(h => `<option value="${h}">${h}</option>`).join('');
            valSel.innerHTML = headers.map(h => `<option value="${h}">${h}</option>`).join('');

            // Auto-detect first numeric column for Y axis
            const numCol = headers.find(h => parsedRows.some(r => toNum(r[h]) !== null)) || headers[headers.length - 1];
            const catCol = headers.find(h => h !== numCol) || headers[0];
            catSel.value = catCol;
            valSel.value = numCol;

            wrap.style.display = 'block';
            dlImgBtn.disabled = false;
            root.querySelector('#dbDlPdfBtn').disabled = false;
            root.querySelector('#dbDlCsvBtn').disabled = false;
            root.querySelector('#dbDlHtmlBtn').disabled = false;
            renderDashboard();
          } catch (e) {
            errEl.textContent = e.message;
          }
        }

        fileIn.addEventListener('change', (e) => {
          const f = e.target.files[0];
          if (!f) return;
          const reader = new FileReader();
          reader.onload = () => {
            rawIn.value = reader.result;
            loadAndRender(reader.result);
          };
          reader.readAsText(f);
        });

        analyzeBtn.addEventListener('click', () => {
          if (!rawIn.value.trim()) {
            rawIn.value = "แผนก,ยอดขาย\nการตลาด,45000\nฝ่ายขาย,82000\nไอที,38000\nบริการลูกค้า,54000";
          }
          loadAndRender(rawIn.value);
        });

        [catSel, valSel, aggSel, chartSel,
         root.querySelector('#dbSort'),
         root.querySelector('#dbLimit'),
         root.querySelector('#dbBgMode'),
         root.querySelector('#dbShowLabels'),
         root.querySelector('#dbChartTitle')
        ].forEach(el => {
          el.addEventListener('change', renderDashboard);
          el.addEventListener('input', renderDashboard);
        });

        dlImgBtn.addEventListener('click', () => {
          triggerDownload(canvas.toDataURL('image/png'), 'dashboard-chart.png');
        });

        root.querySelector('#dbDlCsvBtn').addEventListener('click', () => {
          const trs = Array.from(tbody.querySelectorAll('tr'));
          const csvLines = ['"หมวดหมู่","ค่าที่คำนวณได้","สัดส่วน (%)"'];
          trs.forEach(tr => {
            const tds = Array.from(tr.querySelectorAll('td')).map(td => `"${td.textContent.replace(/"/g, '""')}"`);
            if (tds.length) csvLines.push(tds.join(','));
          });
          const blob = new Blob(['\uFEFF' + csvLines.join('\n')], { type: 'text/csv;charset=utf-8' });
          triggerDownload(URL.createObjectURL(blob), 'dashboard-summary.csv');
        });

        root.querySelector('#dbDlPdfBtn').addEventListener('click', async () => {
          const isLandscape = root.querySelector('#dbPdfOrient').value === 'landscape';
          const incKpi = root.querySelector('#dbPdfIncKpi').checked;
          const incChart = root.querySelector('#dbPdfIncChart').checked;
          const incTable = root.querySelector('#dbPdfIncTable').checked;
          const footerNote = root.querySelector('#dbPdfFooter').value.trim();

          const pdfW = isLandscape ? 841.89 : 595.28;
          const pdfH = isLandscape ? 595.28 : 841.89;
          const cw = isLandscape ? 1123 : 794;
          const ch = isLandscape ? 794 : 1123;

          const pdfDoc = await PDFLib.PDFDocument.create();
          const page = pdfDoc.addPage([pdfW, pdfH]);
          const reportCanvas = document.createElement('canvas');
          reportCanvas.width = cw;
          reportCanvas.height = ch;
          const rctx = reportCanvas.getContext('2d');
          rctx.fillStyle = '#ffffff';
          rctx.fillRect(0, 0, cw, ch);

          const titleText = root.querySelector('#dbChartTitle').value.trim() || 'รายงานสรุปข้อมูล Dashboard';
          rctx.fillStyle = '#222530';
          rctx.font = '800 28px "Noto Sans Thai", sans-serif';
          rctx.fillText(titleText, 48, 58);

          let curY = 92;
          if (incKpi) {
            rctx.font = '600 16px "Noto Sans Thai", sans-serif';
            rctx.fillStyle = '#727c94';
            rctx.fillText(`ผลรวม: ${root.querySelector('#dbKpiSum').textContent}   |   ค่าเฉลี่ย: ${root.querySelector('#dbKpiAvg').textContent}   |   สูงสุด: ${root.querySelector('#dbKpiMax').textContent}   |   จำนวน: ${root.querySelector('#dbKpiCount').textContent} รายการ`, 48, curY);
            curY += 28;
          }

          if (incChart) {
            const chartW = Math.min(cw - 96, isLandscape ? 640 : 698);
            const chartH = Math.round(chartW * 0.5);
            rctx.drawImage(canvas, 48, curY, chartW, chartH);
            curY += chartH + 36;
          }

          if (incTable) {
            rctx.fillStyle = '#222530';
            rctx.font = '700 18px "Noto Sans Thai", sans-serif';
            rctx.fillText('ตารางสรุปข้อมูลแยกตามหมวดหมู่', 48, curY);
            curY += 32;

            const trs = Array.from(tbody.querySelectorAll('tr'));
            rctx.font = '500 15px "Noto Sans Thai", sans-serif';
            const maxRows = Math.max(3, Math.floor((ch - curY - 60) / 32));
            trs.slice(0, maxRows).forEach((tr, idx) => {
              const tds = Array.from(tr.querySelectorAll('td')).map(td => td.textContent);
              const y = curY + idx * 32;
              rctx.fillStyle = idx % 2 === 0 ? '#f8f9fc' : '#ffffff';
              rctx.fillRect(48, y - 20, cw - 96, 28);
              rctx.fillStyle = '#222530';
              rctx.fillText(tds[0] || '', 60, y);
              rctx.fillText(tds[1] || '', cw - 280, y);
              rctx.fillText(tds[2] || '', cw - 120, y);
            });
          }

          if (footerNote) {
            rctx.fillStyle = '#727c94';
            rctx.font = '500 13px "Noto Sans Thai", sans-serif';
            rctx.fillText(footerNote, 48, ch - 28);
          }

          const jpgUrl = reportCanvas.toDataURL('image/jpeg', 0.92);
          const emb = await pdfDoc.embedJpg(jpgUrl);
          page.drawImage(emb, { x: 0, y: 0, width: pdfW, height: pdfH });
          const pdfBytes = await pdfDoc.save();
          triggerDownload(URL.createObjectURL(new Blob([pdfBytes], { type: 'application/pdf' })), 'dashboard-report.pdf');
        });

        root.querySelector('#dbDlHtmlBtn').addEventListener('click', () => {
          const titleText = root.querySelector('#dbChartTitle').value.trim() || 'Dashboard Report';
          const chartDataUrl = canvas.toDataURL('image/png');
          const bodyHtml = [
            '<div style="max-width:820px;margin:24px auto;background:#fff;padding:32px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.06);">',
            '<h2>' + titleText + '</h2>',
            '<p>ผลรวม: <strong>' + root.querySelector('#dbKpiSum').textContent + '</strong> | ค่าเฉลี่ย: <strong>' + root.querySelector('#dbKpiAvg').textContent + '</strong> | สูงสุด: <strong>' + root.querySelector('#dbKpiMax').textContent + '</strong></p>',
            '<img src="' + chartDataUrl + '" style="max-width:100%;border-radius:12px;border:1px solid #eee;margin:16px 0;" alt="Chart">',
            '<table style="width:100%;border-collapse:collapse;margin-top:16px;"><thead><tr><th style="text-align:left;padding:8px;border-bottom:2px solid #eee;">หมวดหมู่</th><th style="text-align:right;padding:8px;border-bottom:2px solid #eee;">ค่าที่คำนวณได้</th><th style="text-align:right;padding:8px;border-bottom:2px solid #eee;">สัดส่วน (%)</th></tr></thead><tbody>' + tbody.innerHTML + '</tbody></table>',
            '</div>'
          ].join('');
          const htmlDoc = makeHtmlDoc(titleText, 'body{font-family:\'Noto Sans Thai\',sans-serif;background:#f5f7fc;color:#222530;padding:20px}td{padding:8px;border-bottom:1px solid #eee}', bodyHtml);
          triggerDownload(URL.createObjectURL(new Blob([htmlDoc], { type: 'text/html;charset=utf-8' })), 'dashboard-report.html');
        });
      }
    };

    // Initial render
    renderTabs();
    renderDirectory();
  </script>
</body>
</html>
