<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My working Tools — Up-Skill การทำงานง่ายๆ ฟรีทุกฟังก์ชัน ครบจบในที่เดียว</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #f5f7fc;
      --surface: #ffffff;
      --border: #e8ecf7;
      --border-hover: #cbd3ea;
      --ink: #222530;
      --muted: #727c94;
      --brand: #7966eb;
      --brand-soft: #f0eeff;
      --brand-ink: #ffffff;
      --danger: #ff6b6b;
      --success: #3ecf8e;
      --radius: 16px;
      --shadow-sm: 0 2px 6px rgba(121, 102, 235, 0.03);
      --shadow-md: 0 10px 24px rgba(121, 102, 235, 0.07);
      --font: 'Noto Sans Thai', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Header */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .topbar-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--ink);
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      font: inherit;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--brand);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      letter-spacing: -0.02em;
    }

    .brand-name {
      font-weight: 700;
      font-size: 16px;
      color: #2c2f36;
    }

    .version-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 11.5px;
      font-weight: 700;
      border: 1px solid var(--border);
      letter-spacing: 0.01em;
    }

    /* Main Container */
    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px 72px;
    }

    /* Hero */
    .hero {
      text-align: center;
      margin-bottom: 36px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 800;
      color: #1f2229;
      letter-spacing: -0.01em;
    }

    .hero p {
      margin: 0 auto 26px;
      max-width: 480px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .search-wrap {
      max-width: 440px;
      margin: 0 auto;
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #a0a7b5;
      pointer-events: none;
      display: flex;
    }

    .search-input {
      width: 100%;
      padding: 11px 18px 11px 42px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      font: inherit;
      font-size: 13.5px;
      color: var(--ink);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      box-shadow: var(--shadow-sm);
    }

    .search-input::placeholder {
      color: #a5acb8;
    }

    .search-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(88, 72, 229, 0.12);
    }

    /* Category Sections */
    .category-section {
      margin-bottom: 28px;
    }

    .category-title {
      font-size: 12.5px;
      font-weight: 700;
      color: #7c8494;
      margin: 0 0 10px;
      letter-spacing: 0.01em;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    @media (max-width: 600px) {
      .tool-grid {
        grid-template-columns: 1fr;
      }
    }

    .tool-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-align: left;
      font: inherit;
      color: inherit;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease, box-shadow 0.25s ease;
      box-shadow: var(--shadow-sm);
    }

    .tool-card:hover {
      border-color: var(--brand);
      box-shadow: var(--shadow-md);
      transform: translateY(-3px) scale(1.01);
    }

    .tool-card:active {
      transform: translateY(-1px) scale(0.99);
    }

    .tool-card:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }

    .tool-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--brand-soft);
      color: var(--brand);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.25s ease;
    }

    .tool-card:hover .tool-icon {
      transform: rotate(6deg) scale(1.05);
    }

    .tool-icon svg {
      width: 19px;
      height: 19px;
      stroke-width: 1.9;
    }

    .tool-meta {
      min-width: 0;
    }

    .tool-name {
      font-size: 14px;
      font-weight: 700;
      color: #1f2229;
      margin: 0 0 2px;
      line-height: 1.35;
    }

    .tool-desc {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Tool Workspace View */
    .workspace {
      display: none;
    }

    .workspace.active {
      display: block;
    }

    .home-view.hidden {
      display: none;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 14px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #454b57;
      cursor: pointer;
      margin-bottom: 18px;
      transition: border-color 0.2s, background 0.2s, transform 0.2s;
    }

    .back-btn:hover {
      background: #f3f4f8;
      border-color: var(--border-hover);
      transform: translateX(-2px);
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: slideInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .pill-btn, .btn, .select, .input, .textarea, .page-card, .file-item {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .pill-btn:hover {
      transform: translateY(-1px);
    }

    .pill-btn:active {
      transform: translateY(0);
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .panel-header h2 {
      margin: 0 0 2px;
      font-size: 19px;
      font-weight: 700;
    }

    .panel-header p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }

    .dropzone {
      border: 2px dashed #d5d9e4;
      border-radius: 14px;
      padding: 28px 20px;
      text-align: center;
      background: #fafbfe;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      margin-bottom: 18px;
       display: block;
    }

    .dropzone:hover {
      border-color: var(--brand);
      background: #f4f5ff;
    }

    .dropzone input[type="file"] {
      display: none;
    }

    .dropzone-title {
      font-weight: 600;
      font-size: 14px;
      color: #2b2f38;
      margin-bottom: 4px;
    }

    .dropzone-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
      margin-bottom: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      min-width: 140px;
    }

    .field label {
      font-size: 12.5px;
      font-weight: 600;
      color: #434956;
    }

    .input, .select, .textarea {
      width: 100%;
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid var(--border-hover);
      background: #fff;
      font: inherit;
      font-size: 13.5px;
      color: var(--ink);
      outline: none;
    }

    .textarea {
      min-height: 120px;
      resize: vertical;
    }

    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(88, 72, 229, 0.12);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font: inherit;
      font-size: 13.5px;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 9px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
      text-decoration: none;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--brand);
      color: var(--brand-ink);
    }

    .btn-primary:hover:not(:disabled) {
      background: #4737d1;
    }

    .btn-secondary {
      background: #f3f4f8;
      color: #2b2f38;
      border-color: var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #e8eaf2;
    }

    .btn-danger {
      background: #fff0f0;
      color: var(--danger);
      border-color: #ffd6d6;
    }

    .preview-box {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      background: #f8f9fc;
      margin-top: 16px;
      text-align: center;
    }

    .checkerboard {
      background-image:
        linear-gradient(45deg, #e6e8ef 25%, transparent 25%),
        linear-gradient(-45deg, #e6e8ef 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e6e8ef 75%),
        linear-gradient(-45deg, transparent 75%, #e6e8ef 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    }

    canvas, .preview-img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .stat-card {
      background: #f8f9fc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .stat-val {
      font-size: 22px;
      font-weight: 800;
      color: var(--brand);
    }

    .stat-lbl {
      font-size: 12px;
      color: var(--muted);
    }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 12px 0;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fafbfe;
      font-size: 13px;
    }

    .page-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .page-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      background: #fff;
      text-align: center;
      position: relative;
    }

    .page-card canvas {
      width: 100%;
      border: 1px solid #eee;
      border-radius: 6px;
      transition: transform 0.2s;
    }

    .page-actions {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-top: 6px;
    }

    .icon-btn {
      padding: 4px 7px;
      font-size: 11px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #f8f9fc;
      cursor: pointer;
    }

    .icon-btn:hover {
      background: #ebedf5;
    }

    .pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .pill-btn {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-hover);
      background: #fff;
      font: inherit;
      font-size: 12.5px;
      cursor: pointer;
    }

    .pill-btn.active {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }

    .empty-search {
      text-align: center;
      padding: 36px 16px;
      color: var(--muted);
      font-size: 14px;
      display: none;
    }

    .status-msg {
      font-size: 13px;
      margin-top: 10px;
      color: var(--brand);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button type="button" class="brand" id="homeLogoBtn" aria-label="กลับหน้าหลัก My working Tools">
        <span class="brand-logo">M</span>
        <span class="brand-name">My working Tools</span>
        <span class="version-badge">v2.6</span>
      </button>
    </div>
  </header>

  <main class="container">
    <div id="homeView" class="home-view">
      <section class="hero">
        <h1>Up-Skill การทำงานง่ายๆ ฟรีทุกฟังก์ชัน ครบจบในที่เดียว</h1>
        <p>ลบพื้นหลัง จัดการ PDF ทำ QR Code ย่อลิงก์ และอีกมากมาย — ไม่ต้องสมัคร ไม่มีค่าใช้จ่าย</p>
        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input
            type="search"
            id="searchInput"
            class="search-input"
            placeholder="ค้นหาเครื่องมือ เช่น PDF, QR, ย่อลิงก์"
            aria-label="ค้นหาเครื่องมือ"
          >
        </div>
      </section>

      <div class="tabs-outer" style="border-bottom: 1px solid var(--border); margin-bottom: 24px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px;">
        <div class="tabs-list" id="tabsList" style="display: flex; gap: 8px;"></div>
      </div>

      <div id="categoriesContainer"></div>
      <div id="emptySearch" class="empty-search">ไม่พบเครื่องมือที่ตรงกับคำค้นหา</div>
    </div>

    <section id="workspaceView" class="workspace" aria-live="polite">
      <button type="button" class="back-btn" id="backToHomeBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        กลับหน้ารวมเครื่องมือ
      </button>
      <div class="panel">
        <div class="panel-header">
          <div class="tool-icon" id="wsIcon"></div>
          <div>
            <h2 id="wsTitle"></h2>
            <p id="wsDesc"></p>
          </div>
        </div>
        <div id="wsBody"></div>
      </div>
    </section>

    <footer style="text-align: center; margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; font-weight: 500;">
      APW.Gasie &copy; 2026 • My working Tools v2.6 — Up-Skill การทำงานง่ายๆ ฟรีทุกฟังก์ชัน ครบจบในที่เดียว
    </footer>
  </main>

  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    const ICONS = {
      shortLink: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`,
      qrCode: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="3" height="3"/><path d="M21 14h-3v3"/><path d="M18 21h3v-3"/><path d="M14 21v-3"/></svg>`,
      wordCount: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>`
    };

    const CATEGORIES = [
      {
        title: 'ลิงก์ & QR Code',
        tools: [
          { id: 'short-link', name: 'ย่อลิงก์', desc: 'ทำลิงก์ยาวให้สั้น จำง่าย พร้อมเปิดลิงก์และบันทึกประวัติ', icon: 'shortLink' },
          { id: 'qr-code', name: 'สร้าง QR Code', desc: 'ใส่สี ใส่โลโก้ โหลด PNG / SVG', icon: 'qrCode' }
        ]
      },
      {
        title: 'เครื่องมือเล็กๆ',
        tools: [
          { id: 'word-count', name: 'นับคำ / ตัวอักษร', desc: 'นับคำภาษาไทย-อังกฤษ ตัวอักษร บรรทัด', icon: 'wordCount' }
        ]
      }
    ];

    const categoriesContainer = document.getElementById('categoriesContainer');
    const searchInput = document.getElementById('searchInput');
    const emptySearch = document.getElementById('emptySearch');
    const homeView = document.getElementById('homeView');
    const workspaceView = document.getElementById('workspaceView');
    const wsIcon = document.getElementById('wsIcon');
    const wsTitle = document.getElementById('wsTitle');
    const wsDesc = document.getElementById('wsDesc');
    const wsBody = document.getElementById('wsBody');
    const tabsList = document.getElementById('tabsList');

    let activeTab = 'all';

    function renderTabs() {
      tabsList.innerHTML = '';
      const tabs = [
        { id: 'all', title: 'ทั้งหมด' },
        ...CATEGORIES.map(cat => ({ id: cat.title, title: cat.title }))
      ];
      tabs.forEach(t => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `pill-btn ${activeTab === t.id ? 'active' : ''}`;
        btn.style.whiteSpace = 'nowrap';
        btn.textContent = t.title;
        btn.addEventListener('click', () => {
          activeTab = t.id;
          renderTabs();
          renderDirectory(searchInput.value);
        });
        tabsList.appendChild(btn);
      });
    }

    function triggerDownload(url, filename) {
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function renderDirectory(filterText = '') {
      const q = filterText.trim().toLowerCase();
      categoriesContainer.innerHTML = '';
      let totalVisible = 0;

      CATEGORIES.forEach(cat => {
        if (activeTab !== 'all' && cat.title !== activeTab) return;

        const matched = cat.tools.filter(t =>
          !q ||
          t.name.toLowerCase().includes(q) ||
          t.desc.toLowerCase().includes(q) ||
          cat.title.toLowerCase().includes(q)
        );
        if (matched.length === 0) return;
        totalVisible += matched.length;

        const sec = document.createElement('section');
        sec.className = 'category-section animate-fade-in';
        sec.innerHTML = `<h2 class="category-title">${cat.title}</h2>`;

        const grid = document.createElement('div');
        grid.className = 'tool-grid';

        matched.forEach((tool, idx) => {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'tool-card animate-fade-in';
          card.style.animationDelay = `${Math.min(idx * 25, 250)}ms`;
          card.innerHTML = `
            <span class="tool-icon" aria-hidden="true">${ICONS[tool.icon] || ICONS.shortLink}</span>
            <div class="tool-meta">
              <div class="tool-name">${tool.name}</div>
              <p class="tool-desc">${tool.desc}</p>
            </div>
          `;
          card.addEventListener('click', () => openTool(tool));
          grid.appendChild(card);
        });

        sec.appendChild(grid);
        categoriesContainer.appendChild(sec);
      });

      emptySearch.style.display = totalVisible === 0 ? 'block' : 'none';
    }

    searchInput.addEventListener('input', e => renderDirectory(e.target.value));

    function showHome() {
      workspaceView.classList.remove('active');
      homeView.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('homeLogoBtn').addEventListener('click', showHome);
    document.getElementById('backToHomeBtn').addEventListener('click', showHome);

    function openTool(tool) {
      homeView.classList.add('hidden');
      workspaceView.classList.add('active');
      wsIcon.innerHTML = ICONS[tool.icon] || ICONS.shortLink;
      wsTitle.textContent = tool.name;
      wsDesc.textContent = tool.desc;
      wsBody.innerHTML = '';
      if (TOOL_BUILDERS[tool.id]) {
        TOOL_BUILDERS[tool.id](wsBody);
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    const TOOL_BUILDERS = {
      /* 16. ย่อลิงก์ (เวอร์ชันอัปเดตสมบูรณ์: บันทึก LocalStorage, Auto-https, และเปิดลิงก์ได้จริง) */
      'short-link': (root) => {
        root.innerHTML = `
          <div class="controls-row">
            <div class="field" style="flex:2;">
              <label for="slUrl">วางลิงก์ยาวที่ต้องการย่อ (URL)</label>
              <input type="text" id="slUrl" class="input" placeholder="เช่น https://example.com หรือพิมพ์ข้อความ...">
            </div>
            <div class="field">
              <label for="slAlias">ตั้งชื่อสั้นๆ (ไม่บังคับ)</label>
              <input type="text" id="slAlias" class="input" placeholder="เช่น promo26">
            </div>
            <button type="button" class="btn btn-primary" id="slCreate">ย่อลิงก์</button>
          </div>
          <div id="slError" style="color:var(--danger);font-size:13px;margin-bottom:8px;"></div>
          <div class="file-list" id="slList"></div>
        `;
        const urlIn = root.querySelector('#slUrl');
        const aliasIn = root.querySelector('#slAlias');
        const errEl = root.querySelector('#slError');
        const listEl = root.querySelector('#slList');
        
        let links = [];
        try {
          const saved = localStorage.getItem('ut_short_links');
          if (saved) links = JSON.parse(saved);
        } catch (e) {}

        function hashCode(str) {
          let h = 2166136261;
          for (let i = 0; i < str.length; i++) {
            h ^= str.charCodeAt(i);
            h = Math.imul(h, 16777619);
          }
          return (h >>> 0).toString(36).slice(0, 6);
        }

        function renderLinks() {
          listEl.innerHTML = '';
          if (links.length === 0) {
            listEl.innerHTML = '<div style="color:var(--muted); font-size:13px; text-align:center; padding:10px;">ยังไม่มีประวัติการย่อลิงก์</div>';
            return;
          }
          links.forEach((item, index) => {
            const row = document.createElement('div');
            row.className = 'file-item';
            row.innerHTML = `
              <div style="min-width:0;flex:1;">
                <div style="font-weight:700;color:var(--brand);font-size:14px;">${item.shortText}</div>
                <div style="font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                  <a href="${item.longUrl}" target="_blank" rel="noopener noreferrer" style="color:var(--brand); text-decoration:underline;">${item.longUrl}</a>
                </div>
              </div>
              <div style="display:flex;gap:6px;">
                <a href="${item.longUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-primary" style="padding:6px 10px;font-size:12.5px;text-decoration:none;">เปิดลิงก์</a>
                <button type="button" class="btn btn-secondary" data-copy="short" style="padding:6px 10px;font-size:12.5px;">คัดลอก</button>
                <button type="button" class="btn btn-danger" data-del="item" style="padding:6px 8px;font-size:12.5px;">✕</button>
              </div>
            `;
            row.querySelector('[data-copy="short"]').addEventListener('click', (e) => {
              navigator.clipboard?.writeText(item.longUrl);
              e.target.textContent = 'คัดลอกแล้ว!';
              setTimeout(() => { e.target.textContent = 'คัดลอก'; }, 1200);
            });
            row.querySelector('[data-del="item"]').addEventListener('click', () => {
              links.splice(index, 1);
              try { localStorage.setItem('ut_short_links', JSON.stringify(links)); } catch (e) {}
              renderLinks();
            });
            listEl.appendChild(row);
          });
        }

        root.querySelector('#slCreate').addEventListener('click', () => {
          errEl.textContent = '';
          let raw = urlIn.value.trim();
          if (!raw) {
            errEl.textContent = '⚠️ กรุณากรอกลิงก์หรือ URL ที่ต้องการย่อก่อนครับ';
            return;
          }
          let formattedUrl = raw;
          if (!/^https?:\/\//i.test(raw)) {
            formattedUrl = 'https://' + raw;
          }
          const safeAlias = aliasIn.value.trim().replace(/[^a-zA-Z0-9_-]/g, '');
          const code = (safeAlias || hashCode(raw));
          const shortText = `utl.to/${code}`;
          links.unshift({ code, shortText, longUrl: formattedUrl });
          try {
            localStorage.setItem('ut_short_links', JSON.stringify(links));
          } catch (e) {}
          urlIn.value = '';
          aliasIn.value = '';
          renderLinks();
        });

        renderLinks();
      }
    };

    renderTabs();
    renderDirectory();
  </script>
</body>
</html>
