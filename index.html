<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Working Tools Ultimate (65+ Tools) — APW.Gasie © 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Sriracha&family=Chonburi&family=Charm:wght@700&family=Mitr:wght@500&family=Mali:wght@600&family=Noto+Serif+Thai&display=swap" rel="stylesheet">

  <!-- CDNs for core features -->
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <style>
    :root {
      --bg: #f5f7fc;
      --surface: #ffffff;
      --border: #e8ecf7;
      --border-hover: #cbd3ea;
      --ink: #222530;
      --muted: #727c94;
      --brand: #6366f1;
      --brand-soft: #e0e7ff;
      --brand-ink: #ffffff;
      --accent: #ec4899;
      --accent-soft: #fce7f3;
      --danger: #ff6b6b;
      --success: #3ecf8e;
      --radius: 16px;
      --shadow-sm: 0 4px 6px -1px rgba(99, 102, 241, 0.05), 0 2px 4px -2px rgba(99, 102, 241, 0.05);
      --shadow-md: 0 12px 20px -3px rgba(99, 102, 241, 0.08), 0 4px 12px -4px rgba(99, 102, 241, 0.08);
      --font: 'Noto Sans Thai', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.02);
    }

    .topbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--ink);
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      font: inherit;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--brand), var(--accent));
      color: #fff;
      font-weight: 800;
      font-size: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(99, 102, 241, 0.25);
    }

    .brand-name {
      font-weight: 800;
      font-size: 18px;
      background: linear-gradient(135deg, var(--brand), #4f46e5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-badge {
      font-size: 11px;
      font-weight: 700;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 99px;
      margin-left: 6px;
      border: 1px solid rgba(236, 72, 153, 0.15);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .hero {
      text-align: center;
      margin-bottom: 36px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 800;
      color: #1f2229;
      letter-spacing: -0.01em;
    }

    .hero p {
      margin: 0 auto 26px;
      max-width: 650px;
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.6;
    }

    .search-wrap {
      max-width: 520px;
      margin: 0 auto;
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #a0a7b5;
      pointer-events: none;
      display: flex;
    }

    .search-input {
      width: 100%;
      padding: 13px 18px 13px 48px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font: inherit;
      font-size: 14px;
      color: var(--ink);
      outline: none;
      transition: all 0.25s ease;
      box-shadow: var(--shadow-sm);
    }

    .search-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15), var(--shadow-md);
    }

    .tabs-outer {
      border-bottom: 1px solid var(--border);
      margin-bottom: 30px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 6px;
    }

    .tabs-list {
      display: flex;
      gap: 10px;
      padding: 2px;
    }

    .pill-btn {
      padding: 8px 18px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font: inherit;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .pill-btn:hover {
      border-color: var(--brand);
      color: var(--brand);
      background: var(--brand-soft);
      transform: translateY(-1.5px);
    }

    .pill-btn.active {
      background: var(--brand);
      color: var(--brand-ink);
      border-color: var(--brand);
      box-shadow: 0 6px 14px rgba(99, 102, 241, 0.25);
    }

    .category-section {
      margin-bottom: 32px;
    }

    .category-title {
      font-size: 15px;
      font-weight: 800;
      color: #7c8494;
      margin: 0 0 16px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .category-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .tool-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      text-align: left;
      font: inherit;
      color: inherit;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
    }

    .tool-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      background: linear-gradient(to bottom, var(--brand), var(--accent));
      transition: width 0.2s ease;
    }

    .tool-card:hover {
      border-color: var(--brand);
      box-shadow: var(--shadow-md);
      transform: translateY(-4px);
    }

    .tool-card:hover::before { width: 5px; }

    .tool-card-content {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
      flex: 1;
    }

    .tool-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--brand-soft);
      color: var(--brand);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.25s ease;
    }

    .tool-icon svg { width: 22px; height: 22px; stroke-width: 2; }
    .tool-meta { min-width: 0; }
    .tool-name { font-size: 15px; font-weight: 700; color: #0f172a; margin: 0 0 3px; }
    .tool-desc { font-size: 12.5px; color: var(--muted); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .workspace { display: none; }
    .workspace.active { display: block; }
    .home-view.hidden { display: none; }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 10px 20px;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }
    .back-btn:hover {
      background: var(--brand-soft);
      border-color: var(--brand);
      color: var(--brand);
    }

    .panel {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      box-shadow: var(--shadow-md);
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1.5px solid var(--border);
    }

    .dropzone {
      border: 2.5px dashed #cbd5e1;
      border-radius: var(--radius);
      padding: 36px 24px;
      text-align: center;
      background: #f8fafc;
      cursor: pointer;
      display: block;
      margin-bottom: 20px;
      transition: all 0.2s ease;
    }
    .dropzone:hover { border-color: var(--brand); background: var(--brand-soft); }
    .dropzone input[type="file"] { display: none; }
    .dropzone-title { font-weight: 700; font-size: 15px; color: #1e293b; margin-bottom: 6px; }
    .dropzone-sub { font-size: 12.5px; color: var(--muted); }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-end;
      margin-bottom: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 180px;
    }

    .field label { font-size: 13.5px; font-weight: 700; color: #334155; }
    .input, .select, .textarea {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--border-hover);
      background: #ffffff;
      font: inherit;
      font-size: 14px;
      color: var(--ink);
      outline: none;
    }
    .textarea { min-height: 120px; resize: vertical; }
    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      padding: 11px 20px;
      border-radius: 10px;
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #4f46e5; }
    .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--border-hover); }
    .btn-secondary:hover:not(:disabled) { background: #f1f5f9; }

    .preview-box {
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      background: #f8fafc;
      margin-top: 20px;
      text-align: center;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .stat-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .stat-val { font-size: 24px; font-weight: 800; color: var(--brand); }
    .stat-lbl { font-size: 13px; color: var(--muted); font-weight: 600; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button type="button" class="brand" id="homeLogoBtn">
        <span class="brand-logo">U</span>

        <span class="brand-badge">65+ Tools Complete</span>
      </button>
      <div style="font-size: 12.5px; font-weight: 700; color: var(--muted);">
        APW.Gasie &copy; 2026
      </div>

  <main class="container">

          <input type="search" id="searchInput" class="search-input" placeholder="ค้นหาเครื่องมือ เช่น PDF, ตัดวิดีโอ, ลบพื้นหลัง, ตรวจคำผิด, ภาษี...">
        </div>
      </section>

      <div class="tabs-outer">
        <div class="tabs-list" id="tabsList"></div>
      </div>

      <div id="categoriesContainer"></div>
      <div id="emptySearch" style="display:none; text-align:center; padding:40px; color:var(--muted); font-weight:600;">ไม่พบเครื่องมือที่ตรงกับคำค้นหา</div>

            <p id="wsDesc" style="margin:0; font-size:13.5px; color:var(--muted);"></p>
          </div>
        </div>
        <div id="wsBody"></div>
      </div>
    </section>
  </main>

        const salaryIn = root.querySelector('#txSalary');
        const bonusIn = root.querySelector('#txBonus');
        const withheldIn = root.querySelector('#txWithheld');
        const spouseIn = root.querySelector('#txSpouse');
        const childIn = root.querySelector('#txChild');
        const parentsIn = root.querySelector('#txParents');
        const homeLoanIn = root.querySelector('#txHomeLoan');
        const ssoIn = root.querySelector('#txSocialSec');
        const lifeInsIn = root.querySelector('#txLifeIns');
        const provIn = root.querySelector('#txProvident');
        const rmfIn = root.querySelector('#txRmf');
        const donationIn = root.querySelector('#txDonation');

        const calcBtn = root.querySelector('#txCalculateBtn');
        const exportBtn = root.querySelector('#txExportSummary');
        const resContainer = root.querySelector('#txResultContainer');
        const resGross = root.querySelector('#resGrossIncome');
        const resDed = root.querySelector('#resDeductionTotal');

        const resFinal = root.querySelector('#resFinalTaxAmount');

        let summaryTextData = "";

        calcBtn.onclick = () => {
          const salaryYear = (parseFloat(salaryIn.value) || 0) * 12;
          const bonus = parseFloat(bonusIn.value) || 0;
          const grossIncome = salaryYear + bonus;
          const taxWithheld = parseFloat(withheldIn.value) || 0;

          // 1. ค่าใช้จ่าย 50% ไม่เกิน 100,000 บ.
          const standardExpense = Math.min(grossIncome * 0.5, 100000);

          // 2. ค่าลดหย่อนส่วนตัว & ครอบครัว
          const personalAllowance = 60000; // ผู้มีเงินได้
          const spouseAllowance = spouseIn.value === 'no_income' ? 60000 : 0;
          const childAllowance = (parseInt(childIn.value, 10) || 0) * 30000;
          const parentsAllowance = (parseInt(parentsIn.value, 10) || 0) * 30000;

          // 3. ค่าลดหย่อนกลุ่มประกันและกองทุน
          const homeLoanInterest = Math.min(parseFloat(homeLoanIn.value) || 0, 100000);
          const socialSecurity = Math.min(parseFloat(ssoIn.value) || 0, 9000);
          const lifeInsurance = Math.min(parseFloat(lifeInsIn.value) || 0, 100000);
          const providentFund = parseFloat(provIn.value) || 0;
          const rmfSsf = parseFloat(rmfIn.value) || 0;

          const totalDeductionsBeforeDonation = standardExpense + personalAllowance + spouseAllowance + childAllowance + parentsAllowance + homeLoanInterest + socialSecurity + lifeInsurance + providentFund + rmfSsf;
          const incomeBeforeDonation = Math.max(0, grossIncome - totalDeductionsBeforeDonation);

          // 4. เงินบริจาค (ไม่เกิน 10% ของเงินได้หลังหักค่าใช้จ่ายและลดหย่อน)
          const donationMax = incomeBeforeDonation * 0.1;
          const donationActual = Math.min(parseFloat(donationIn.value) || 0, donationMax);

          const totalDeductionsAndExpenses = totalDeductionsBeforeDonation + donationActual;
          const netTaxableIncome = Math.max(0, grossIncome - totalDeductionsAndExpenses);

          // 5. คำนวณภาษีตามขั้นบันไดกรมสรรพากร (ภ.ง.ด.91)
          const taxBrackets = [
            { min: 0, max: 150000, rate: 0, label: '0 - 150,000' },
            { min: 150000, max: 300000, rate: 0.05, label: '150,001 - 300,000' },
            { min: 300000, max: 500000, rate: 0.10, label: '300,001 - 500,000' },
            { min: 500000, max: 750000, rate: 0.15, label: '500,001 - 750,000' },
            { min: 750000, max: 1000000, rate: 0.20, label: '750,001 - 1,000,000' },
            { min: 1000000, max: 2000000, rate: 0.25, label: '1,000,001 - 2,000,000' },
            { min: 2000000, max: 5000000, rate: 0.30, label: '2,000,001 - 5,000,000' },
            { min: 5000000, max: Infinity, rate: 0.35, label: 'เกิน 5,000,000 ขึ้นไป' }
          ];

          let computedTax = 0;
          let bracketRowsHtml = '';

          taxBrackets.forEach(b => {
            if (netTaxableIncome > b.min) {
              const taxableInBracket = Math.min(netTaxableIncome, b.max) - b.min;
              const taxInBracket = taxableInBracket * b.rate;
              computedTax += taxInBracket;

              bracketRowsHtml += `
                <tr style="border-bottom:1px solid var(--border);">
                  <td style="padding:8px 12px;">${b.label}</td>
                  <td style="padding:8px 12px;">${b.rate === 0 ? 'ยกเว้น' : (b.rate * 100) + '%'}</td>
                  <td style="padding:8px 12px;">${taxableInBracket.toLocaleString()}</td>
                  <td style="padding:8px 12px; text-align:right; font-weight:700;">${taxInBracket.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                </tr>
              `;
            }
          });

          // ภาษีที่ต้องชำระสุทธิ (หัก ภาษีหัก ณ ที่จ่าย)
          const finalTaxBalance = computedTax - taxWithheld;

          resGross.textContent = grossIncome.toLocaleString() + ' บ.';
          resDed.textContent = totalDeductionsAndExpenses.toLocaleString() + ' บ.';
          resNet.textContent = netTaxableIncome.toLocaleString() + ' บ.';
          bracketTbody.innerHTML = bracketRowsHtml;

          if (finalTaxBalance > 0) {
            resFinal.textContent = finalTaxBalance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' บ.';
            resFinal.style.color = 'var(--danger)';
            resTaxLabel.textContent = 'ยอดภาษีที่ต้องชำระเพิ่ม';
            statusBadge.innerHTML = `<span style="color:var(--danger); background:#fee2e2; padding:4px 10px; border-radius:99px;">ชำระภาษีเพิ่ม ${finalTaxBalance.toLocaleString()} บาท</span>`;
          } else if (finalTaxBalance < 0) {
            const refund = Math.abs(finalTaxBalance);
            resFinal.textContent = refund.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' บ.';
            resFinal.style.color = 'var(--success)';
            resTaxLabel.textContent = 'ยอดภาษีที่ได้รับคืน';
            statusBadge.innerHTML = `<span style="color:var(--success); background:#d1fae5; padding:4px 10px; border-radius:99px;">ได้รับเงินคืนภาษี ${refund.toLocaleString()} บาท</span>`;
          } else {
            resFinal.textContent = '0.00 บ.';
            resFinal.style.color = 'var(--brand)';
            resTaxLabel.textContent = 'ภาษีพอดี (ไม่ต้องชำระเพิ่ม)';
            statusBadge.innerHTML = `<span style="color:var(--brand); background:var(--brand-soft); padding:4px 10px; border-radius:99px;">ไม่ต้องชำระภาษีเพิ่ม</span>`;
          }

          // จัดเตรียมเนื้อหาสำหรับ Export
          summaryTextData = `================================================
แบบจำลองการคำนวณภาษีเงินได้บุคคลธรรมดา (ภ.ง.ด.91)
APW.Gasie My Working Tools Ultimate
วันที่คำนวณ: ${new Date().toLocaleDateString('th-TH')}
================================================
1. ข้อมูลเงินได้พึงประเมิน
   - เงินเดือนรวมทั้งปี: ${salaryYear.toLocaleString()} บาท
   - โบนัสและเงินพิเศษ: ${bonus.toLocaleString()} บาท
   => รวมเงินได้ทั้งปี: ${grossIncome.toLocaleString()} บาท

2. ค่าใช้จ่ายและค่าลดหย่อน
   - หักค่าใช้จ่าย 50%: ${standardExpense.toLocaleString()} บาท
   - ลดหย่อนส่วนตัว: ${personalAllowance.toLocaleString()} บาท
   - ลดหย่อนคู่สมรส: ${spouseAllowance.toLocaleString()} บาท
   - ลดหย่อนบุตร: ${childAllowance.toLocaleString()} บาท
   - ลดหย่อนบิดามารดา: ${parentsAllowance.toLocaleString()} บาท
   - ดอกเบี้ยกู้บ้าน: ${homeLoanInterest.toLocaleString()} บาท
   - ประกันสังคม: ${socialSecurity.toLocaleString()} บาท
   - เบี้ยประกันชีวิต: ${lifeInsurance.toLocaleString()} บาท
   - กองทุนสำรองเลี้ยงชีพ/กบข.: ${providentFund.toLocaleString()} บาท
   - กองทุน RMF/SSF/ThaiESG: ${rmfSsf.toLocaleString()} บาท
   - เงินบริจาค: ${donationActual.toLocaleString()} บาท
   => รวมค่าใช้จ่ายและลดหย่อน: ${totalDeductionsAndExpenses.toLocaleString()} บาท

3. สรุปภาษีเงินได้สุทธิ
   - เงินได้สุทธิที่ต้องเสียภาษี: ${netTaxableIncome.toLocaleString()} บาท
   - ภาษีคำนวณได้ทั้งสิ้น: ${computedTax.toLocaleString()} บาท
   - ภาษีหัก ณ ที่จ่ายไว้แล้ว: ${taxWithheld.toLocaleString()} บาท
   ---------------------------------------------
   => ผลลัพธ์: ${finalTaxBalance >= 0 ? 'ภาษีที่ต้องชำระเพิ่ม ' + finalTaxBalance.toLocaleString() : 'ได้รับเงินคืนภาษี ' + Math.abs(finalTaxBalance).toLocaleString()} บาท
================================================`;

          resContainer.style.display = 'block';
          exportBtn.disabled = false;
        };

        exportBtn.onclick = () => {
          if (!summaryTextData) return;
          triggerDownload(URL.createObjectURL(new Blob(['\ufeff' + summaryTextData], { type: 'text/plain;charset=utf-8' })), 'Tax_Calculation_PND91.txt');
        };
      },

      /* สตูดิโอช่วยออกแบบ */
      'design-studio': (root) => {
        root.innerHTML = `
          <div class="controls-row">
            <div class="field"><label>ขนาดชิ้นงาน</label><select id="dsPreset" class="select"><option value="1200x630">Facebook Cover (1200x630)</option><option value="1080x1080" selected>Instagram Post (1:1)</option><option value="1080x1920">Story / Reels (9:16)</option></select></div>
            <div class="field"><label>สีพื้นหลัง</label><input type="color" id="dsBgColor" class="input" value="#6366f1" style="height:42px; padding:4px;"></div>
          </div>
          <div class="field"><label>ข้อความพาดหัวหลัก</label><input type="text" id="dsHeading" class="input" value="ยินดีต้อนรับสู่ My Working Tools"></div>
          <div class="controls-row"><button type="button" class="btn btn-primary" id="dsRender">🎨 สร้างภาพออกแบบ</button><button type="button" class="btn btn-secondary" id="dsDownload" disabled>📥 ดาวน์โหลดรูปภาพ PNG</button></div>
          <div class="preview-box" id="dsWrap" style="display:none; overflow:auto;"><canvas id="dsCanvas" style="max-width:100%; border-radius:12px;"></canvas></div>
        `;
        const canvas = root.querySelector('#dsCanvas'), ctx = canvas.getContext('2d');
        root.querySelector('#dsRender').onclick = () => {
          const [w, h] = root.querySelector('#dsPreset').value.split('x').map(Number);
          canvas.width = w; canvas.height = h;
          const grad = ctx.createLinearGradient(0, 0, w, h);
          grad.addColorStop(0, root.querySelector('#dsBgColor').value); grad.addColorStop(1, '#ec4899');
          ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
          ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.font = `800 ${Math.round(w * 0.055)}px sans-serif`;

        root.innerHTML = `<div class="controls-row"><input type="number" id="btNum" class="input" value="150000.50"><button type="button" class="btn btn-primary" id="btRun">💵 แปลงบาทถ้วน</button></div><div class="preview-box" id="btWrap" style="text-align:left; margin-top:12px;"><div id="btThai" style="font-size:18px; font-weight:800; color:var(--brand);">หนึ่งแสนห้าหมื่นบาทห้าสิบสตางค์</div></div>`;
        function thaiBahtText(num) {
          if (isNaN(num)) return "";
          const thaiNums = ["ศูนย์", "หนึ่ง", "สอง", "สาม", "สี่", "ห้า", "หก", "เจ็ด", "แปด", "เก้า"], units = ["", "สิบ", "ร้อย", "พัน", "หมื่น", "แสน", "ล้าน"];
          let [integerPart, decimalPart] = num.toFixed(2).split(".");
          let intVal = parseInt(integerPart, 10);
          if (intVal === 0 && decimalPart === "00") return "ศูนย์บาทถ้วน";
          let res = "", s = intVal.toString(), len = s.length;
          for (let i = 0; i < len; i++) {
            let digit = parseInt(s[i], 10), pos = len - i - 1;
            if (digit !== 0) {
              if (pos % 6 === 1 && digit === 1 && len > 1) res += "";
              else if (pos % 6 === 1 && digit === 2) res += "ยี่";
              else if (pos % 6 === 0 && digit === 1 && i > 0 && s[i - 1] !== '0') res += "เอ็ด";
              else res += thaiNums[digit];
              res += units[pos % 6];
            }
            if (pos === 6) res += "ล้าน";
          }
          res += "บาท" + (decimalPart === "00" ? "ถ้วน" : `${thaiNums[parseInt(decimalPart[0])]||''}สิบ${thaiNums[parseInt(decimalPart[1])]||''}สตางค์`);
          return res;
        }
        root.querySelector('#btRun').onclick = () => { root.querySelector('#btThai').textContent = thaiBahtText(parseFloat(root.querySelector('#btNum').value) || 0); };

      'bg-remove': (root) => {
        root.innerHTML = `
          <label class="dropzone"><input type="file" id="bgFile" accept="image/*"><div class="dropzone-title">คลิกเลือกรูปภาพที่ต้องการตัดพื้นหลัง</div></label>
          <div class="controls-row"><div class="field"><label>Tolerance: <span id="bgTolVal">40</span></label><input type="range" id="bgTol" min="5" max="150" value="40" class="input"></div><button type="button" class="btn btn-primary" id="bgDl" disabled>ดาวน์โหลด PNG พื้นใส</button></div>
          <div class="preview-box" id="bgWrap" style="display:none;"><canvas id="bgCanvas" style="cursor:crosshair;"></canvas></div>
        `;
        let srcImg = null, selColor = null;
        const fileIn = root.querySelector('#bgFile'), tolIn = root.querySelector('#bgTol'), tolVal = root.querySelector('#bgTolVal'), dlBtn = root.querySelector('#bgDl'), wrap = root.querySelector('#bgWrap'), canvas = root.querySelector('#bgCanvas'), ctx = canvas.getContext('2d');
        function proc() {
          if (!srcImg) return;
          canvas.width = srcImg.width; canvas.height = srcImg.height;
          ctx.drawImage(srcImg, 0, 0);
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height), d = imgData.data;
          if (!selColor) selColor = [d[0], d[1], d[2]];
          const tol = parseInt(tolIn.value, 10), [br, bg, bb] = selColor;
          for (let i = 0; i < d.length; i += 4) {

    function loadImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const dataUrl = e.target.result;
          const img = new Image();
          img.onload = () => resolve({ img, dataUrl });
          img.onerror = () => reject(new Error("Cannot load image"));
          img.src = dataUrl;
        };
        reader.onerror = () => reject(new Error("Cannot read file"));
        reader.readAsDataURL(file);
      });
    }

    function formatBytes(bytes) {
      if (!bytes) return '0 B';
      const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function triggerDownload(url, filename) {
      const a = document.createElement('a'); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
    }

    function cleanThaiTextForOutput(text) {
      if (!text) return "";
      return text.replace(/([ิ-ื็ํ])([่-๋])/g, '$1$2').replace(/([ุู])([่-๋])/g, '$1$2').replace(/\s+/g, ' ').trim();
    }

    const wsBody = document.getElementById('wsBody');

    function renderTabs() {
      tabsList.innerHTML = '';
      const tabs = [{ id: 'all', title: 'ทั้งหมด' }, ...CATEGORIES.map(cat => ({ id: cat.title, title: cat.title }))];
      tabs.forEach(t => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `pill-btn ${activeTab === t.id ? 'active' : ''}`;
        btn.textContent = t.title;
        btn.addEventListener('click', () => {
          activeTab = t.id;
          renderTabs();
          renderDirectory(searchInput.value);
        });
        tabsList.appendChild(btn);
      });
    }

    function renderDirectory(filterText = '') {
      const q = filterText.trim().toLowerCase();
      categoriesContainer.innerHTML = '';
      let totalVisible = 0;

      CATEGORIES.forEach(cat => {
        if (activeTab !== 'all' && cat.title !== activeTab) return;
        const matched = cat.tools.filter(t => !q || t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q));
        if (matched.length === 0) return;
        totalVisible += matched.length;

        const sec = document.createElement('section');
        sec.className = 'category-section';
        sec.innerHTML = `<h2 class="category-title">${cat.title}</h2>`;

        const grid = document.createElement('div');
        grid.className = 'tool-grid';

        matched.forEach(tool => {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'tool-card';
          card.innerHTML = `
            <div class="tool-card-content">
              <span class="tool-icon">${ICONS[tool.icon] || ICONS.settings}</span>
              <div class="tool-meta">
                <div class="tool-name">${tool.name}</div>
                <p class="tool-desc">${tool.desc}</p>
              </div>
            </div>
          `;
          card.addEventListener('click', () => openTool(tool));
          grid.appendChild(card);
        });

        sec.appendChild(grid);
        categoriesContainer.appendChild(sec);
      });

      emptySearch.style.display = totalVisible === 0 ? 'block' : 'none';
    }

    searchInput.addEventListener('input', e => renderDirectory(e.target.value));

    function showHome() {
      workspaceView.classList.remove('active');
      homeView.classList.remove('hidden');
      renderDirectory(searchInput.value);
    }

    document.getElementById('homeLogoBtn').addEventListener('click', showHome);
    document.getElementById('backToHomeBtn').addEventListener('click', showHome);

    function openTool(tool) {
      homeView.classList.add('hidden');
      workspaceView.classList.add('active');
      wsIcon.innerHTML = ICONS[tool.icon] || ICONS.settings;
      wsTitle.textContent = tool.name;
      wsDesc.textContent = tool.desc;
      wsBody.innerHTML = '';

      if (TOOL_BUILDERS[tool.id]) {
        TOOL_BUILDERS[tool.id](wsBody);
      } else {
        wsBody.innerHTML = `<div style="padding:24px; text-align:center; color:var(--muted);">เครื่องมือนี้พร้อมใช้งาน</div>`;
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    renderTabs();
    renderDirectory();
  </script>
</body>
</html>
