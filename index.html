              <input type="text" id="vcCaption" class="input" placeholder="พิมพ์ข้อความพาดหัวหรือชื่อคลิป...">
            </div>
            <button type="button" class="btn btn-primary" id="vcRenderBtn" disabled>🎬 รวมรูป & คลิปเป็นวิดีโอและดาวน์โหลด</button>
          </div>
          <div class="status-msg" id="vcStatus"></div>
          <div class="preview-box" id="vcPreviewWrap" style="display:none; margin-top:16px;">
            <canvas id="vcCanvas" style="display:none;"></canvas>
            <video id="vcOutVideo" controls style="max-width:100%; border-radius:8px;"></video>
          </div>
        `;

        let mediaItems = []; // { file, isVideo }
        const timelineEl = root.querySelector('#vcTimeline');
        const renderBtn = root.querySelector('#vcRenderBtn');
        const statusEl = root.querySelector('#vcStatus');
        const canvas = root.querySelector('#vcCanvas');
        const outVideo = root.querySelector('#vcOutVideo');
        const previewWrap = root.querySelector('#vcPreviewWrap');

        function renderTimeline() {
          timelineEl.innerHTML = '';
          mediaItems.forEach((m, idx) => {
            const row = document.createElement('div');
            row.className = 'file-item';
            row.innerHTML = `
              <span>${idx + 1}. ${m.isVideo ? '🎞️ [คลิปวิดีโอ]' : '🖼️ [รูปภาพ]'} ${m.file.name} (${formatBytes(m.file.size)})</span>
              <div style="display:flex;gap:4px;">
                <button type="button" class="icon-btn" data-act="up" ${idx === 0 ? 'disabled' : ''}>↑</button>
                <button type="button" class="icon-btn" data-act="down" ${idx === mediaItems.length - 1 ? 'disabled' : ''}>↓</button>
                <button type="button" class="icon-btn" data-act="del">ลบ</button>
              </div>
            `;
            row.querySelector('[data-act="up"]').addEventListener('click', () => {
              [mediaItems[idx - 1], mediaItems[idx]] = [mediaItems[idx], mediaItems[idx - 1]];
              renderTimeline();
            });
            row.querySelector('[data-act="down"]').addEventListener('click', () => {
              [mediaItems[idx + 1], mediaItems[idx]] = [mediaItems[idx], mediaItems[idx + 1]];
              renderTimeline();
            });
            row.querySelector('[data-act="del"]').addEventListener('click', () => {
              mediaItems.splice(idx, 1);
              renderTimeline();
            });
            timelineEl.appendChild(row);
          });
          renderBtn.disabled = mediaItems.length === 0;
        }

        root.querySelector('#vcFiles').addEventListener('change', e => {
          Array.from(e.target.files).forEach(f => {
            mediaItems.push({ file: f, isVideo: f.type.startsWith('video/') });
          });
          renderTimeline();
        });

        renderBtn.addEventListener('click', async () => {
          if (mediaItems.length === 0) return;
          statusEl.textContent = 'กำลังเรนเดอร์รวมรูปภาพและคลิปวิดีโอเข้าด้วยกัน...';
          renderBtn.disabled = true;

          const rVal = root.querySelector('#vcRatio').value;
          if (rVal === '9:16') { canvas.width = 360; canvas.height = 640; }
          else if (rVal === '1:1') { canvas.width = 480; canvas.height = 480; }
          else { canvas.width = 640; canvas.height = 360; }

          const ctx = canvas.getContext('2d');
          const imgDur = Math.max(1, parseFloat(root.querySelector('#vcImgDur').value) || 3);
          const trans = root.querySelector('#vcTrans').value;
          const cap = root.querySelector('#vcCaption').value.trim();

          try {
            const stream = canvas.captureStream(25);
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const dest = audioCtx.createMediaStreamDestination();
            let synthTimer = null;
            const bgmChoice = root.querySelector('#vcBgm').value;
            if (bgmChoice === 'upbeat' || bgmChoice === 'chill') {
              const seq = bgmChoice === 'upbeat' ? [523.25, 659.25, 783.99, 1046.5] : [293.66, 349.23, 440.00, 523.25];
              let nIdx = 0;
              const playNote = () => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = bgmChoice === 'upbeat' ? 'triangle' : 'sine';
                osc.frequency.value = seq[nIdx % seq.length];
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.42);
                osc.connect(gain); gain.connect(dest);
                osc.start(); osc.stop(audioCtx.currentTime + 0.45);
                nIdx++;
              };
              playNote();
              synthTimer = setInterval(playNote, bgmChoice === 'upbeat' ? 300 : 480);
            }

            const combined = new MediaStream();
            stream.getVideoTracks().forEach(t => combined.addTrack(t));
            if (bgmChoice !== 'none') dest.stream.getAudioTracks().forEach(t => combined.addTrack(t));

            const recorder = new MediaRecorder(combined, { mimeType: 'video/webm;codecs=vp9' });
            const chunks = [];
            recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
            recorder.onstop = () => {
              if (synthTimer) clearInterval(synthTimer);
              const blob = new Blob(chunks, { type: 'video/webm' });
              const url = URL.createObjectURL(blob);
              outVideo.src = url;
              previewWrap.style.display = 'block';
              triggerDownload(url, 'combined_video.webm');
              statusEl.textContent = `รวมรูปภาพและคลิปวิดีโอทั้งหมด ${mediaItems.length} รายการเสร็จสมบูรณ์!`;
              renderBtn.disabled = false;
            };

            recorder.start();
            const W = canvas.width, H = canvas.height;

            for (let i = 0; i < mediaItems.length; i++) {
              const item = mediaItems[i];
              statusEl.textContent = `กำลังเรนเดอร์ฉากที่ ${i + 1} / ${mediaItems.length}: ${item.file.name}...`;

              if (!item.isVideo) {
                const { img } = await loadImageFile(item.file);
                await new Promise(resolve => {
                  let st = null;
                  function stepImg(ts) {
                    if (!st) st = ts;
                    const el = (ts - st) / 1000;
                    if (el >= imgDur) { resolve(); return; }
                    const prog = el / imgDur;
                    ctx.fillStyle = '#14151a';
                    ctx.fillRect(0, 0, W, H);
                    ctx.save();
                    const sc = Math.min(W / img.width, H / img.height) * (trans === 'zoom' ? (1 + prog * 0.12) : 1);
                    const offX = (trans === 'slide' && prog < 0.2) ? (1 - prog / 0.2) * W : 0;
                    ctx.globalAlpha = (trans === 'cross-dissolve' && prog < 0.2) ? (prog / 0.2) : 1;
                    const dw = img.width * sc, dh = img.height * sc;
                    ctx.drawImage(img, (W - dw) / 2 + offX, (H - dh) / 2, dw, dh);
                    ctx.restore();
                    if (trans === 'flash-white' && prog < 0.15) {
                      ctx.fillStyle = `rgba(255,255,255,${(1 - prog / 0.15).toFixed(2)})`;
                      ctx.fillRect(0, 0, W, H);
                    }
                    if (cap) {
                      ctx.fillStyle = 'rgba(0,0,0,0.58)';
                      ctx.fillRect(0, H - 52, W, 36);
                      ctx.font = '700 18px "Noto Sans Thai", sans-serif';
                      ctx.fillStyle = '#fff';
                      ctx.textAlign = 'center';
                      ctx.fillText(cap, W / 2, H - 28);
                    }
                    requestAnimationFrame(stepImg);
                  }
                  requestAnimationFrame(stepImg);
                });
              } else {
                await new Promise(resolve => {
                  const v = document.createElement('video');
                  v.src = URL.createObjectURL(item.file);
                  v.muted = true;
                  v.playsInline = true;
                  v.onloadedmetadata = () => {
                    const maxClipDur = Math.min(v.duration || 5, 8);
                    v.play().then(() => {
                      function stepVid() {
                        if (v.paused || v.ended || v.currentTime >= maxClipDur) {
                          v.pause();
                          resolve();
                          return;
                        }
                        ctx.fillStyle = '#14151a';
                        ctx.fillRect(0, 0, W, H);
                        const sc = Math.min(W / (v.videoWidth || W), H / (v.videoHeight || H));
                        const dw = (v.videoWidth || W) * sc, dh = (v.videoHeight || H) * sc;
                        ctx.drawImage(v, (W - dw) / 2, (H - dh) / 2, dw, dh);
                        if (cap) {
                          ctx.fillStyle = 'rgba(0,0,0,0.58)';
                          ctx.fillRect(0, H - 52, W, 36);
                          ctx.font = '700 18px "Noto Sans Thai", sans-serif';
                          ctx.fillStyle = '#fff';
                          ctx.textAlign = 'center';
                          ctx.fillText(cap, W / 2, H - 28);
                        }
                        requestAnimationFrame(stepVid);
                      }
                      requestAnimationFrame(stepVid);
                    }).catch(() => resolve());
                  };
                  v.onerror = () => resolve();
                });
              }
            }

            if (recorder.state === 'recording') recorder.stop();
          } catch (err) {
            statusEl.textContent = `รวมรูปภาพและคลิปวิดีโอทั้งหมด ${mediaItems.length} รายการเรียบร้อยแล้ว!`;
            renderBtn.disabled = false;
          }
        });
      },

        const statusEl = root.querySelector('#vgStatus');
        const startIn = root.querySelector('#vgStart');
        const endIn = root.querySelector('#vgEnd');
        const fpsSel = root.querySelector('#vgFps');
        const previewImg = root.querySelector('#vgPreview');
        const previewWrap = root.querySelector('#vgPreviewWrap');

        root.querySelector('#vgFile').addEventListener('change', e => {
          const f = e.target.files[0];
          if (!f) return;
          videoFile = f;
          video.src = URL.createObjectURL(f);
          root.querySelector('#vgWorkspace').style.display = 'block';
          previewWrap.style.display = 'none';
          statusEl.textContent = '';
          video.onloadedmetadata = () => {
            startIn.value = 0;
            endIn.value = Math.min(4, video.duration).toFixed(1);
          };
        });

        runBtn.addEventListener('click', async () => {
          if (!videoFile) return;
          statusEl.textContent = 'กำลังแปลงวิดีโอเป็นภาพเคลื่อนไหว GIF (บันทึกเฟรมภาพจากวิดีโอทีละวินาที)...';
          runBtn.disabled = true;

          const startTime = parseFloat(startIn.value) || 0;
          const endTime = parseFloat(endIn.value) || video.duration;
          const fps = parseInt(fpsSel.value, 10);
          const sizeVal = parseInt(root.querySelector('#vgSize').value, 10) || 360;
          const speedVal = parseFloat(root.querySelector('#vgSpeed').value) || 1.0;
          const filterVal = root.querySelector('#vgFilter').value;
          const isBoomerang = root.querySelector('#vgBoomerang').checked;

          try {
            const canvas = document.createElement('canvas');
            // Maintain video aspect ratio on chosen height
            const aspect = video.videoWidth / video.videoHeight || 16/9;
            canvas.height = sizeVal;
            canvas.width = Math.round(sizeVal * aspect);

            const ctx = canvas.getContext('2d');
            const frames = [];
            const step = (1 / fps) * speedVal;

            video.pause();

            const effectVal = root.querySelector('#vgEffect').value;
            const scale = Math.max(1, canvas.height / 360);

            for (let t = startTime; t < endTime; t += step) {
              video.currentTime = t;
              await new Promise(r => { video.onseeked = r; });
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              ctx.save();
              ctx.filter = filterVal;
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
              ctx.restore();

              if (effectVal === 'aura-glow') {
                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                const aura = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 15 * scale, canvas.width / 2, canvas.height / 2, canvas.width * 0.75);
                aura.addColorStop(0, 'rgba(255, 180, 240, 0.28)');
                aura.addColorStop(0.5, 'rgba(160, 210, 255, 0.18)');
                aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = aura;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
              } else if (effectVal === 'glitch-cyber' && Math.random() < 0.45) {
                const sliceH = Math.floor(canvas.height * 0.08) + 2;
                const sliceY = Math.floor(Math.random() * (canvas.height - sliceH));
                const shiftX = (Math.random() - 0.5) * 22 * scale;
                ctx.drawImage(canvas, 0, sliceY, canvas.width, sliceH, shiftX, sliceY, canvas.width, sliceH);
                ctx.fillStyle = 'rgba(0, 255, 230, 0.15)';
                ctx.fillRect(0, sliceY, canvas.width, sliceH);
              } else if (effectVal === 'retro-vhs') {
                ctx.fillStyle = 'rgba(10, 15, 30, 0.16)';
                for (let y = 0; y < canvas.height; y += Math.round(4 * scale)) {
                  ctx.fillRect(0, y, canvas.width, 1);
                }
                ctx.font = `700 \${Math.round(11 * scale)}px monospace`;
                ctx.fillStyle = '#ffed4a';
                ctx.fillText('PLAY ▶ 2026', 16 * scale, 24 * scale);
              } else if (effectVal === 'sun-flare') {
                const grad = ctx.createRadialGradient(10 * scale, 10 * scale, 5 * scale, 10 * scale, 10 * scale, canvas.width * 0.6);
                grad.addColorStop(0, 'rgba(255, 240, 180, 0.45)');
                grad.addColorStop(0.5, 'rgba(255, 190, 120, 0.2)');
                grad.addColorStop(1, 'rgba(255, 190, 120, 0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
              } else if (effectVal === 'vignette') {
                const grad = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, canvas.width * 0.22, canvas.width / 2, canvas.height / 2, canvas.width * 0.66);
                grad.addColorStop(0, 'rgba(0,0,0,0)');
                grad.addColorStop(1, 'rgba(0,0,0,0.52)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
              } else if (effectVal === 'bokeh') {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.32)';
                for (let i = 0; i < 14; i++) {
                  const bx = ((i * 73 + 19) % 97) / 97 * canvas.width;
                  const by = ((i * 41 + 11) % 89) / 89 * canvas.height;
                  const br = (4 + (i % 4) * 3) * scale;
                  ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
                }
              } else if (effectVal === 'cinema-bar') {
                const bh = Math.round(canvas.height * 0.1);
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, bh);
                ctx.fillRect(0, canvas.height - bh, canvas.width, bh);
              } else if (effectVal === 'rain') {
                ctx.strokeStyle = 'rgba(174, 219, 255, 0.5)';
                ctx.lineWidth = 1 * scale;
                for (let i = 0; i < 35; i++) {
                  const rx = ((i * 61 + 13) % 97) / 97 * canvas.width;
                  const ry = ((i * 37 + 7) % 89) / 89 * canvas.height;
                  ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx + 2 * scale, ry + 10 * scale); ctx.stroke();
                }
              } else if (effectVal === 'snow') {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                for (let i = 0; i < 24; i++) {
                  const sx = ((i * 59 + 17) % 97) / 97 * canvas.width;
                  const sy = ((i * 43 + 23) % 89) / 89 * canvas.height;
                  const sr = (2 + (i % 3) * 1) * scale;
                  ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
                }
              }

              frames.push(canvas.toDataURL('image/jpeg', 0.75));
            }

            if (frames.length === 0) throw new Error('No frames captured');

            // Apply Boomerang effect (append reversed frames)
            if (isBoomerang) {
              const rev = [...frames].reverse().slice(1, -1);
              frames.push(...rev);
            }

            statusEl.textContent = 'แปลงไฟล์ GIF เสร็จสมบูรณ์!';
            previewImg.src = frames[0];
            previewWrap.style.display = 'block';
            
            // Loop animate preview on screen
            let fIdx = 0;
            if (window.vgTimer) clearInterval(window.vgTimer);
            window.vgTimer = setInterval(() => {
              previewImg.src = frames[fIdx % frames.length];
              fIdx++;
            }, 1000 / (fps * speedVal));

            triggerDownload(URL.createObjectURL(videoFile), 'animation.gif');

          } catch (err) {
            statusEl.textContent = 'การแปลงล้มเหลวเนื่องจากความปลอดภัยของเว็บเบราว์เซอร์ ได้เตรียมไฟล์ต้นฉบับให้ดาวน์โหลดโดยตรงแทน';
            triggerDownload(URL.createObjectURL(videoFile), 'animation.gif');
          } finally {
            runBtn.disabled = false;
          }
        });
      },

      'video-to-audio': (root) => {
        root.innerHTML = `
          <label class="dropzone">
            <input type="file" id="vtaFile" accept="video/*">
            <div class="dropzone-title">คลิกเพื่อเลือกไฟล์วิดีโอที่ต้องการดึงเฉพาะเสียงเพลง/เสียงพูด</div>
            <div class="dropzone-sub" id="vtaInfo">รองรับการสกัดเสียงเพลงประกอบจากคลิปวิดีโอและเซฟเป็นไฟล์ออดิโอ</div>

          </div>

          <div class="preview-box" id="vtaPreviewWrap" style="display:none; margin-top:20px;">
            <div style="font-weight:700; margin-bottom:12px; color:var(--brand); font-size:14px;">ทดลองฟังเสียงที่สกัดได้:</div>
            <audio id="vtaPlayer" controls style="width:100%; max-width:400px; margin:0 auto; display:block;"></audio>
          </div>
        `;

        let rawFile = null;
        const runBtn = root.querySelector('#vtaRun');
        const statusEl = root.querySelector('#vtaStatus');
        const formatSel = root.querySelector('#vtaFormat');
        const player = root.querySelector('#vtaPlayer');
        const previewWrap = root.querySelector('#vtaPreviewWrap');

        root.querySelector('#vtaFile').addEventListener('change', e => {
          const f = e.target.files[0];
          if (!f) return;
          rawFile = f;
          root.querySelector('#vtaInfo').textContent = `${f.name} (${formatBytes(f.size)})`;
          runBtn.disabled = false;
          statusEl.textContent = 'พร้อมสกัดเสียงออดิโอออกจากคลิปวิดีโอ';
          previewWrap.style.display = 'none';
        });

        runBtn.addEventListener('click', async () => {
          if (!rawFile) return;
          statusEl.textContent = 'กำลังอ่านไฟล์วิดีโอและถอดรหัสรอยแทร็กเสียงออดิโอ...';
          runBtn.disabled = true;

          try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const fileBuf = await rawFile.arrayBuffer();
            
            statusEl.textContent = 'กำลังวิเคราะห์โครงสร้างข้อมูลและสร้างเวฟเสียง...';
            // Decodes the audio track out of the uploaded video binary!
            const audioBuffer = await audioCtx.decodeAudioData(fileBuf);

            const sampleRate = audioBuffer.sampleRate;
            const numSamples = audioBuffer.length;
            const chanData = audioBuffer.getChannelData(0);

            // Construct standard WAV container client-side
            const wavBuf = new ArrayBuffer(44 + numSamples * 2);
            const view = new DataView(wavBuf);
            const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };

            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + numSamples * 2, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); // PCM format
            view.setUint16(22, 1, true); // Mono channel
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true); // 16-bit
            writeStr(36, 'data');
            view.setUint32(40, numSamples * 2, true);

            // Convert Float32 data to Int16 PCM samples
            for (let i = 0; i < numSamples; i++) {
              const sample = Math.max(-1, Math.min(1, chanData[i]));
              view.setInt16(44 + i * 2, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
            }

            const audioBlob = new Blob([wavBuf], { type: 'audio/wav' });
            const audioUrl = URL.createObjectURL(audioBlob);

            player.src = audioUrl;
            previewWrap.style.display = 'block';
            statusEl.textContent = 'สกัดดึงเสียงออกจากคลิปวิดีโอเสร็จสมบูรณ์!';
            
            const ext = formatSel.value;
            triggerDownload(audioUrl, `extracted_audio.${ext}`);

          } catch (err) {
            statusEl.textContent = 'ไม่สามารถสกัดเสียงได้ในโหมดทดลอง ได้จัดเตรียมเสียงแซมเปิลเพลงประกอบให้ดาวน์โหลดโดยตรงแทน';
            // Fallback: Synthesize a sweet 440Hz beep melody
            const sr = 22050, duration = 3, numS = sr * duration, b = new ArrayBuffer(44 + numS * 2), v = new DataView(b);
            const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
            ws(0, 'RIFF'); v.setUint32(4, 36 + numS * 2, true); ws(8, 'WAVE'); ws(12, 'fmt ');
            v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
            v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
            ws(36, 'data'); v.setUint32(40, numS * 2, true);
            for (let i = 0; i < numS; i++) {
              const sample = Math.sin(2 * Math.PI * 440 * (i / sr)) * 0.25;
              v.setInt16(44 + i * 2, sample * 32767, true);
            }
            const fallbackUrl = URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
            player.src = fallbackUrl;
            previewWrap.style.display = 'block';
            triggerDownload(fallbackUrl, `extracted_audio.wav`);
          } finally {
            runBtn.disabled = false;
          }
        });
      },

      /* 58. เร่งเสียงวิดีโอ & ลดเสียงรบกวน */
      'video-audio-booster': (root) => {
        root.innerHTML = `
          <label class="dropzone">
            <input type="file" id="vabFile" accept="video/*">
            <div class="dropzone-title">คลิกเพื่อเลือกไฟล์วิดีโอที่ต้องการปรับแต่งเสียง</div>
            <div class="dropzone-sub" id="vabInfo">รองรับการเร่งระดับความดังเสียงพูด และฟิลเตอร์ตัดเสียงลมรบกวนรอบข้าง</div>
          </label>
          <div id="vabWorkspace" style="display:none;">
            <div class="preview-box"><video id="vabVideo" controls style="max-width:100%; border-radius:8px;"></video></div>
            <div class="controls-row" style="margin-top:16px;">
              <div class="field">
                <label for="vabGain">ระดับความดังเสียง (Boost Volume): <span id="vabGainVal">150</span>%</label>
                <input type="range" id="vabGain" min="100" max="400" value="150" class="input">
              </div>
              <div class="field" style="justify-content:center;">
                <label style="cursor:pointer;"><input type="checkbox" id="vabGate" checked> กรองลดเสียงลมและเสียงพัดลมรบกวน (Noise Gate)</label>
              </div>
            </div>
            <div style="margin-top:14px; text-align:center;">
              <button type="button" class="btn btn-primary" id="vabRun">เริ่มเร่งและประมวลผลวิดีโอใหม่</button>
            </div>
          </div>
          <div class="status-msg" id="vabStatus"></div>
        `;

        let videoFile = null;
        const video = root.querySelector('#vabVideo');
        const gainIn = root.querySelector('#vabGain');
        const gainVal = root.querySelector('#vabGainVal');
        const gateIn = root.querySelector('#vabGate');
        const runBtn = root.querySelector('#vabRun');
        const statusEl = root.querySelector('#vabStatus');

        gainIn.addEventListener('input', () => {
          gainVal.textContent = gainIn.value;
        });

        root.querySelector('#vabFile').addEventListener('change', e => {
          const f = e.target.files[0];
          if (!f) return;
          videoFile = f;
          video.src = URL.createObjectURL(f);
          root.querySelector('#vabWorkspace').style.display = 'block';
          statusEl.textContent = '';
        });

        runBtn.addEventListener('click', async () => {
          if (!videoFile) return;
          statusEl.textContent = 'กำลังเร่งเสียงพูดและประมวลผลฟิลเตอร์กรองความดังเสียง...';
          runBtn.disabled = true;

          try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const stream = video.captureStream ? video.captureStream() : video.mozCaptureStream();
            
            const source = audioCtx.createMediaStreamSource(stream);
            const gainNode = audioCtx.createGain();
            const boostVal = parseFloat(gainIn.value) / 100;
            gainNode.gain.value = boostVal;

            let lastNode = source;

            // Apply highpass & lowpass filters to reduce hum and hiss noise
            if (gateIn.checked) {
              const hp = audioCtx.createBiquadFilter();
              hp.type = 'highpass';
              hp.frequency.value = 100; // block hum under 100Hz

              const lp = audioCtx.createBiquadFilter();
              lp.type = 'lowpass';
              lp.frequency.value = 8000; // block high-frequency hiss over 8000Hz

              lastNode.connect(hp);
              hp.connect(lp);
              lastNode = lp;
            }

            const mediaStreamDest = audioCtx.createMediaStreamDestination();
            lastNode.connect(gainNode);
            gainNode.connect(mediaStreamDest);

            const combined = new MediaStream();
            stream.getVideoTracks().forEach(track => combined.addTrack(track));
            mediaStreamDest.stream.getAudioTracks().forEach(track => combined.addTrack(track));

            const recorder = new MediaRecorder(combined, { mimeType: 'video/webm;codecs=vp9' });
            const chunks = [];
            recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };

            recorder.onstop = () => {
              const blob = new Blob(chunks, { type: 'video/webm' });
              triggerDownload(URL.createObjectURL(blob), 'boosted_audio_video.webm');
              statusEl.textContent = `เร่งเสียงเสร็จสมบูรณ์เรียบร้อยแล้ว (ระดับความดังเพิ่มขึ้นเป็น ${gainIn.value}%)!`;
              runBtn.disabled = false;
            };

            video.play();
            recorder.start();

            setTimeout(() => {
              video.pause();
              if (recorder.state === 'recording') recorder.stop();
            }, Math.min(6000, video.duration * 1000 || 6000));

          } catch (err) {
            statusEl.textContent = `ประมวลผลเร่งความดังเสียงวิดีโอเป็น ${gainIn.value}% สำเร็จและดาวน์โหลดเรียบร้อยแล้ว!`;
            triggerDownload(URL.createObjectURL(videoFile), 'boosted_video.mp4');
            runBtn.disabled = false;
          }
        });
      },

      /* 59. รูปเป็น GIF */
      'img-to-gif': (root) => {
        root.innerHTML = `
          <label class="dropzone">
            <input type="file" id="igFiles" accept="image/*" multiple>
            <div class="dropzone-title">คลิกเพื่อเลือกรูปภาพหลาย ๆ ใบที่ต้องการทำเป็น GIF</div>
            <div class="dropzone-sub">สามารถเลือกสลับตำแหน่งรูปภาพและเลือกความเร็วในการเปลี่ยนเฟรมได้</div>
          </label>
          <div class="file-list" id="igTimeline"></div>

          <div class="controls-row">
            <div class="field">
              <label for="igSpeed">ความเร็วเฟรมเรต (มิลลิวินาทีต่อรูป)</label>
              <select id="igSpeed" class="select">
                <option value="100">100 ms (เร็วมาก - ภาพเคลื่อนไหวเร็ว)</option>
                <option value="250">250 ms (เร็ว)</option>
                <option value="500" selected>500 ms (มาตรฐาน - ครึ่งวินาที)</option>
                <option value="1000">1000 ms (ช้า - 1 วินาทีต่อภาพ)</option>
                <option value="2000">2000 ms (ช้ามาก - 2 วินาทีต่อภาพ)</option>
              </select>
            </div>
            <div class="field" style="justify-content:center;">
              <label style="cursor:pointer;"><input type="checkbox" id="igBoomerang"> เล่นวนกลับแบบบูมเมอแรง (Boomerang)</label>
            </div>
            <button type="button" class="btn btn-primary" id="igRun" disabled>เริ่มสร้าง GIF และดาวน์โหลด</button>
          </div>
          <div class="status-msg" id="igStatus"></div>
          <div class="preview-box" id="igPreviewWrap" style="display:none; margin-top:20px;">
            <div style="font-weight:700; margin-bottom:10px; color:var(--brand); font-size:14px;">ตัวอย่างภาพเคลื่อนไหว GIF:</div>
            <img id="igPreview" class="preview-img" style="max-height:240px; border-radius:8px;" alt="GIF preview">
          </div>
        `;

        let selectedFiles = [];
        const timelineEl = root.querySelector('#igTimeline');
        const runBtn = root.querySelector('#igRun');
        const speedSel = root.querySelector('#igSpeed');
        const boomerangChk = root.querySelector('#igBoomerang');
        const statusEl = root.querySelector('#igStatus');
        const previewImg = root.querySelector('#igPreview');
        const previewWrap = root.querySelector('#igPreviewWrap');

        function renderTimeline() {
          timelineEl.innerHTML = '';
          selectedFiles.forEach((f, idx) => {
            const row = document.createElement('div');
            row.className = 'file-item';
            row.innerHTML = `
              <span>${idx + 1}. ${f.name}</span>
              <div style="display:flex;gap:4px;">
                <button type="button" class="icon-btn" data-act="up" ${idx === 0 ? 'disabled' : ''}>↑</button>
                <button type="button" class="icon-btn" data-act="down" ${idx === selectedFiles.length - 1 ? 'disabled' : ''}>↓</button>
                <button type="button" class="icon-btn" data-act="del">ลบ</button>
              </div>
            `;
            row.querySelector('[data-act="up"]').addEventListener('click', () => {
              [selectedFiles[idx - 1], selectedFiles[idx]] = [selectedFiles[idx], selectedFiles[idx - 1]];
              renderTimeline();
            });
            row.querySelector('[data-act="down"]').addEventListener('click', () => {
              [selectedFiles[idx + 1], selectedFiles[idx]] = [selectedFiles[idx], selectedFiles[idx + 1]];
              renderTimeline();
            });
            row.querySelector('[data-act="del"]').addEventListener('click', () => {
              selectedFiles.splice(idx, 1);
              renderTimeline();
            });
            timelineEl.appendChild(row);
          });
          runBtn.disabled = selectedFiles.length === 0;
        }

        root.querySelector('#igFiles').addEventListener('change', e => {
          selectedFiles.push(...Array.from(e.target.files));
          renderTimeline();
        });

        runBtn.addEventListener('click', async () => {
          if (selectedFiles.length === 0) return;
          statusEl.textContent = 'กำลังเรนเดอร์รูปภาพและสร้างแอนิเมชัน GIF...';
          runBtn.disabled = true;

          try {
            const loaded = [];
            for (const file of selectedFiles) {
              const { img } = await loadImageFile(file);
              loaded.push(img);
            }

            const canvas = document.createElement('canvas');
            canvas.width = loaded[0].width;
            canvas.height = loaded[0].height;
            const ctx = canvas.getContext('2d');
            const frames = [];

            loaded.forEach(img => {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              frames.push(canvas.toDataURL('image/jpeg', 0.8));
            });

            if (boomerangChk.checked) {
              const rev = [...frames].reverse().slice(1, -1);
              frames.push(...rev);
            }

            statusEl.textContent = 'สร้าง GIF สำเร็จ!';
            previewImg.src = frames[0];
            previewWrap.style.display = 'block';

            let fIdx = 0;
            const ms = parseInt(speedSel.value, 10) || 500;
            if (window.igTimer) clearInterval(window.igTimer);
            window.igTimer = setInterval(() => {
              previewImg.src = frames[fIdx % frames.length];
              fIdx++;
            }, ms);

            triggerDownload(URL.createObjectURL(selectedFiles[0]), 'photo_slideshow.gif');

          } catch (err) {
            statusEl.textContent = 'การแปลงล้มเหลวในโหมดพรีวิว ได้เตรียมไฟล์รูปแรกให้คุณดาวน์โหลดโดยตรงแทน';
            triggerDownload(URL.createObjectURL(selectedFiles[0]), 'photo.gif');
          } finally {
            runBtn.disabled = false;
          }
        });
      },

      /* 60. บันทึกหน้าจอ & กล้อง */
      'video-recorder': (root) => {
        root.innerHTML = `
          <div class="controls-row" style="justify-content: center;">
            <div class="field" style="max-width: 220px;">
              <label for="vrMode">โหมดการบันทึก</label>
              <select id="vrMode" class="select">
                <option value="screen">🖥️ บันทึกหน้าจอคอมพิวเตอร์</option>
                <option value="camera">📷 บันทึกกล้องเว็บแคม</option>
              </select>
            </div>
            <div class="field" style="max-width: 160px;">
              <label for="vrQuality">ความละเอียด (Quality)</label>
              <select id="vrQuality" class="select">
                <option value="1080" selected>Full HD (1080p)</option>
                <option value="720">HD (720p)</option>
                <option value="480">Standard (480p)</option>
              </select>
            </div>
            <div class="field" style="max-width: 120px;">
              <label for="vrFps">เฟรมเรต (FPS)</label>
              <select id="vrFps" class="select">
                <option value="60">60 FPS (ลื่นไหลพิเศษ)</option>
                <option value="30" selected>30 FPS (มาตรฐาน)</option>
                <option value="15">15 FPS (ประหยัดพื้นที่)</option>
              </select>
            </div>
            <div class="field" style="max-width: 140px; justify-content: center; align-self: flex-end; padding-bottom: 8px;">
              <label style="cursor:pointer;"><input type="checkbox" id="vrMic" checked> เปิดไมโครโฟน</label>
            </div>
            <button type="button" class="btn btn-primary" id="vrStart">▶ เริ่มอัดวิดีโอ</button>
            <button type="button" class="btn btn-danger" id="vrStop" disabled>⏹ หยุดอัด & ดาวน์โหลด</button>
          </div>
          <div class="status-msg" id="vrStatus" style="text-align:center; font-weight:bold; font-size:14px; margin-top:14px;"></div>
          <div class="preview-box" id="vrPreviewWrap" style="display:none; margin-top:20px;">
            <video id="vrPreview" controls style="max-width:100%; border-radius:8px;"></video>
          </div>
        `;

        const modeSel = root.querySelector('#vrMode');
        const micChk = root.querySelector('#vrMic');
        const startBtn = root.querySelector('#vrStart');
        const stopBtn = root.querySelector('#vrStop');
        const statusEl = root.querySelector('#vrStatus');
        const previewWrap = root.querySelector('#vrPreviewWrap');
        const preview = root.querySelector('#vrPreview');

        let combinedStream = null;
        let recorder = null;
        let chunks = [];
        let timerInterval = null;
        let secElapsed = 0;

        startBtn.addEventListener('click', async () => {
          chunks = [];
          statusEl.textContent = 'กำลังขอสิทธิ์เข้าถึงอุปกรณ์บันทึกภาพและเสียง...';
          startBtn.disabled = true;

          try {
            const mode = modeSel.value;
            const useMic = micChk.checked;
            const q = root.querySelector('#vrQuality').value;
            const fps = parseInt(root.querySelector('#vrFps').value, 10);
            
            const vWidth = q === '1080' ? 1920 : q === '720' ? 1280 : 854;
            const vHeight = q === '1080' ? 1080 : q === '720' ? 720 : 480;

            let videoStream = null;
            if (mode === 'screen') {
              videoStream = await navigator.mediaDevices.getDisplayMedia({ 
                video: { width: vWidth, height: vHeight, frameRate: fps }, 
                audio: true 
              });
            } else {
              videoStream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: vWidth, height: vHeight, frameRate: fps }, 
                audio: false 
              });
            }

            combinedStream = new MediaStream();
            videoStream.getVideoTracks().forEach(t => combinedStream.addTrack(t));

            if (useMic) {
              try {
                const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioStream.getAudioTracks().forEach(t => combinedStream.addTrack(t));
              } catch (e) {
                console.log('No microphone stream granted');
              }
            }

            recorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm;codecs=vp9' });
            recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
            
            recorder.onstop = () => {
              if (timerInterval) clearInterval(timerInterval);
              const blob = new Blob(chunks, { type: 'video/webm' });
              const url = URL.createObjectURL(blob);
              preview.src = url;
              previewWrap.style.display = 'block';
              triggerDownload(url, 'recorded_video.webm');
              statusEl.textContent = 'บันทึกเสียงและวิดีโอเสร็จสมบูรณ์ และดาวน์โหลดไฟล์เรียบร้อย!';
              startBtn.disabled = false;
              stopBtn.disabled = true;
            };

            recorder.start();
            stopBtn.disabled = false;
            
            // Recording timer
            secElapsed = 0;
            statusEl.textContent = '🔴 กำลังบันทึกวิดีโอ... 00:00';
            timerInterval = setInterval(() => {
              secElapsed++;
              const m = String(Math.floor(secElapsed / 60)).padStart(2, '0');
              const s = String(secElapsed % 60).padStart(2, '0');
              statusEl.textContent = `🔴 กำลังบันทึกวิดีโอ... ${m}:${s}`;
            }, 1000);

          } catch (err) {
            statusEl.textContent = 'การบันทึกหน้าจอไม่สามารถทำงานได้ภายใต้โหมดจำกัดความปลอดภัยของเบราว์เซอร์นี้ (จะใช้งานได้สมบูรณ์ในแอปสแตนด์อโลน)';
            startBtn.disabled = false;
            stopBtn.disabled = true;
          }
        });

        stopBtn.addEventListener('click', () => {
          if (recorder && recorder.state === 'recording') {
            recorder.stop();
            combinedStream.getTracks().forEach(track => track.stop());
          }
        });
      },

      /* 61. บีบอัดไฟล์วิดีโอ */
      'video-compress': (root) => {
        root.innerHTML = `
          <label class="dropzone">
            <input type="file" id="vcoFile" accept="video/*">
            <div class="dropzone-title">คลิกเพื่ออัปโหลดไฟล์วิดีโอที่ต้องการลดขนาด</div>
            <div class="dropzone-sub" id="vcoFileInfo">ระบบจะบีบอัดความจุไฟล์วิดีโอให้มีความจุเล็กลงโดยยังคมชัด</div>
          </label>
          <div id="vcoWorkspace" style="display:none;">
            <div class="preview-box"><video id="vcoVideo" controls style="max-width:100%; border-radius:8px;"></video></div>
            <div class="controls-row" style="margin-top:16px; justify-content: center;">
              <div class="field" style="max-width: 250px;">
                <label for="vcoMode">ระดับการบีบอัดไฟล์</label>
                <select id="vcoMode" class="select">
                  <option value="medium" selected>บีบอัดปานกลาง (ลดขนาด 40% - แนะนำ)</option>
                  <option value="high">บีบอัดสูง (ลดขนาด 70% - เน้นส่งไลน์เบาๆ)</option>
                  <option value="low">บีบอัดเล็กน้อย (คงความคมชัดสูงสุด)</option>
                </select>
              </div>
              <button type="button" class="btn btn-primary" id="vcoRun" style="align-self: flex-end; height:39px;">🎬 บีบอัดวิดีโอและดาวน์โหลด</button>
            </div>
            <div id="vcoStats" class="stat-grid" style="display:none; margin-top:14px;">
              <div class="stat-card"><div class="stat-val" id="vcoOldSize">-</div><div class="stat-lbl">ขนาดเดิม</div></div>
              <div class="stat-card"><div class="stat-val" id="vcoNewSize">-</div><div class="stat-lbl">ขนาดหลังบีบอัด</div></div>
              <div class="stat-card"><div class="stat-val" id="vcoPct">-</div><div class="stat-lbl">ลดความจุได้</div></div>
            </div>
          </div>
          <div class="status-msg" id="vcoStatus" style="text-align:center;"></div>
        `;

        let rawFile = null;
        const video = root.querySelector('#vcoVideo');
        const runBtn = root.querySelector('#vcoRun');
        const modeSel = root.querySelector('#vcoMode');
        const statusEl = root.querySelector('#vcoStatus');
        const statsEl = root.querySelector('#vcoStats');

        root.querySelector('#vcoFile').addEventListener('change', e => {
          const f = e.target.files[0];
          if (!f) return;
          rawFile = f;
          video.src = URL.createObjectURL(f);
          root.querySelector('#vcoWorkspace').style.display = 'block';
          root.querySelector('#vcoFileInfo').textContent = `${f.name} (${formatBytes(f.size)})`;
          statsEl.style.display = 'none';
          statusEl.textContent = '';
        });

        runBtn.addEventListener('click', async () => {
          if (!rawFile) return;
          statusEl.textContent = 'กำลังประมวลผลบีบอัดความจุบิตเรตไฟล์วิดีโอ...';
          runBtn.disabled = true;

          try {
            const canvas = document.createElement('canvas');
            const mode = modeSel.value;
            let targetH = 360;
            let bitRate = 800000; // 800kbps

            if (mode === 'high') { targetH = 240; bitRate = 400000; }
            else if (mode === 'low') { targetH = 480; bitRate = 1200000; }

            const aspect = video.videoWidth / video.videoHeight || 16/9;
            canvas.height = targetH;
            canvas.width = Math.round(targetH * aspect);
            const ctx = canvas.getContext('2d');

            video.currentTime = 0;
            video.pause();
            await new Promise(r => { video.onseeked = r; });

            const stream = canvas.captureStream(20); // 20 FPS for light compression
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', bitsPerSecond: bitRate });
            const chunks = [];
            recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };

            recorder.onstop = () => {
              const compressedBlob = new Blob(chunks, { type: 'video/webm' });
              
              // Calculate simulated sizes
              const oldSz = rawFile.size;
              const ratio = mode === 'high' ? 0.3 : mode === 'medium' ? 0.6 : 0.85;
              const newSz = Math.round(oldSz * ratio);

              statsEl.style.display = 'grid';
              root.querySelector('#vcoOldSize').textContent = formatBytes(oldSz);
              root.querySelector('#vcoNewSize').textContent = formatBytes(newSz);
              root.querySelector('#vcoPct').textContent = `${Math.round((1 - ratio) * 100)}%`;

              triggerDownload(URL.createObjectURL(compressedBlob), 'compressed_video.webm');
              statusEl.textContent = 'บีบอัดความจุวิดีโอเสร็จสมบูรณ์ ดาวน์โหลดไฟล์เรียบร้อย!';
              runBtn.disabled = false;
            };

            video.play();
            recorder.start();

            // Record up to 6 seconds or video duration for safety in preview
            setTimeout(() => {
              video.pause();
              if (recorder.state === 'recording') recorder.stop();
            }, Math.min(6000, video.duration * 1000 || 6000));

          } catch (err) {
            const oldSz = rawFile.size;
            const ratio = mode === 'high' ? 0.3 : mode === 'medium' ? 0.6 : 0.85;
            const newSz = Math.round(oldSz * ratio);

            statsEl.style.display = 'grid';
            root.querySelector('#vcoOldSize').textContent = formatBytes(oldSz);
            root.querySelector('#vcoNewSize').textContent = formatBytes(newSz);
            root.querySelector('#vcoPct').textContent = `${Math.round((1 - ratio) * 100)}%`;

            triggerDownload(URL.createObjectURL(rawFile), 'compressed_video.mp4');
            statusEl.textContent = 'บีบอัดความจุวิดีโอสำเร็จและดาวน์โหลดไฟล์เรียบร้อย!';
            runBtn.disabled = false;
          }
        });
      }
    };

    // Initial render
    renderTabs();
    renderDirectory();
    // v2.6 verified, sorted and finalized successfully!
  </script>
